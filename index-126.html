{
  id:"maths-crpt-plo-3e-2025",
  cycle:"secondaire1", classe:"3e", serie:null, matiere:"Mathématiques", examen:"Composition Régionale (3e trimestre)", annee:2025, session:"DRE Plateaux-Ouest — corrigé officiel",
  duree:"2H", coef:"3",
  exercices:[
    {
      titre:"Exercice 1",
      points:"8 pts",
      enonce:`Un gérant de station-service reçoit une citerne de 20 000 litres de carburant super sans plomb, facturée 13 000 000 F CFA toutes taxes comprises (taxes appliquées : 18%). Il vend en moyenne 1000 litres par jour à 700 F CFA le litre.

Consigne 1 : Détermine le prix d'un litre de carburant hors taxes, puis donne ton avis sur l'affirmation du gérant concernant la date de la prochaine livraison.
Consigne 2 : Détermine le montant mensuel maximal que le gérant peut réaliser.`,
      consignes:[
        {
          q:"Corrigé officiel — Consigne 1",
          r:`Soit x le prix hors taxe d'un litre. x + 18x/100 = 13 000 000/20 000 → x + 0,18x = 650 → 1,18x = 650 → x = 650×100/118 ≈ 550,85 F CFA (prix hors taxes).
Avec 20 000 litres et une vente moyenne de 1000 litres/jour, le stock dure 20 000/1000 = 20 jours. La date limite pour la prochaine livraison est donc 20 jours après la réception (le 06 juin 2025 dans le contexte du sujet), confirmant l'affirmation du gérant.`
        },
        {
          q:"Corrigé officiel — Consigne 2",
          r:`Montant journalier maximal : 1000×700 = 700 000 F CFA. Pour un mois de 31 jours (montant mensuel maximal) : 700 000×31 = 21 700 000 F CFA.`
        }
      ]
    },
    {
      titre:"Exercice 2",
      points:"6 pts",
      enonce:`A. Réponds par vrai ou faux (énoncé complet non disponible).
B. Choisis la bonne réponse (4 questions, énoncé complet non disponible).
C. Complète (vocabulaire géométrique/algébrique) : a. Le rayon est la ...a... du diamètre. b. ... c. Le centre... / d = ... ; e = intervalle ... / f = condition d'existence d'une fraction ; g = forme simplifiée / h = un vecteur colonne.
D. Définis une pyramide régulière.`,
      consignes:[
        { q:"Corrigé officiel — A et B", r:`A. 1-Faux · 2-Faux · 3-Vrai · 4-Faux.
B. 1-a · 2-c · 3-b · 4-c.` },
        {
          q:"Corrigé officiel — C",
          r:`1. a = moitié ; b = mesure ; c = centre.
2. d = −3 ; e = (−9 ; −3).
3. f : x≠2/3 et x≠−5 ; g : H = (5−x)/(x+5).
4. h = (1;3) (vecteur colonne).`
        },
        { q:"Corrigé officiel — D", r:`Une pyramide régulière est une pyramide dont la base est un polygone régulier et dont les faces latérales sont des triangles isocèles superposables.` }
      ]
    },
    {
      titre:"Exercice 3",
      points:"6 pts",
      enonce:`I. 1a. Simplifie D = 5√28 − 3√175 + √252. 1b. Développe et réduis H = (x−3)² − (6−2x)(5−x) − x² + 9.
2. A(1;2) et H(2;2). Montre que le point E, symétrique de A par rapport à H, a pour coordonnées (3;6).

II. Une étude porte sur la masse (en g) de mangues réparties en classes : [300;350[→6, [350;400[→10, [400;450[→13, [450;500[→x, [500;550[→14, [550;600[→2. Total : 60 mangues.
a. Donne la nature du caractère étudié. b. Calcule x, et donne la classe modale. c. Calcule le pourcentage de mangues pesant moins de 450g. d. Construis l'histogramme.`,
      consignes:[
        {
          q:"Corrigé officiel — I",
          r:`1a. D = 5√(4×7) − 3√(25×7) + √(36×7) = (5×2 − 3×5 + 6)√7 = (10−15+6)√7 = √7.
1b. H = (x²−6x+9) − (30−6x−10x+2x²) − x²+9 = x²−2x²−x² −6x+16x +9+9−30 = −2x²+10x−12.
2. Vecteur AH = vecteur HE → E = 2H−A = (2×2−1 ; 2×2−2) = (3 ; 6). (Dans le corrigé officiel, y_A=−2 est utilisé pour aboutir à y_E=6 ; les coordonnées exactes de A doivent être vérifiées auprès du sujet original.)`
        },
        {
          q:"Corrigé officiel — II",
          r:`a. Le caractère étudié est la masse des mangues ; il est quantitatif.
b. 6+10+13+x+14+2=60 → x=15. Classe modale : [400;450[.
c. Nombre de mangues < 450g : 6+10+13+15=44. Pourcentage : 44/60×100 ≈ 73,33%.
d. Histogramme à construire à partir des effectifs de chaque classe.`
        }
      ]
    }
  ]
},
{
  id:"svt-crps-centrale-1a4-2025",
  cycle:"secondaire2", classe:"Première", serie:"A4", matiere:"SVT", examen:"Composition Régionale (1er semestre)", annee:2025, session:"DRE Centrale",
  duree:"2H", coef:"1",
  exercices:[
    {
      titre:"Exercice 1 — Situation d'évaluation",
      points:"8 pts",
      enonce:`Votre camarade de classe WAZILA, guéri d'un paludisme qui l'a empêché de suivre les cours, reçoit de son professeur un document (schéma d'une cellule annotée de 1 à 13, avec en particulier une grande vacuole, plusieurs mitochondries réparties dans le cytoplasme, et une structure allongée richement texturée en bas de la cellule associée aux repères 9 à 13) portant sur l'étude de la cellule, qu'il a du mal à comprendre.

Consigne 1 : Aide-le à comprendre l'organisation cellulaire tout en précisant les rôles des éléments cellulaires 5, 7 et 13.
Consigne 2 : Différencie cette cellule à un autre type de cellule que vous avez étudié.`,
      consignes:[
        {
          q:"Corrigé — Consigne 1",
          r:`Organisation : la cellule observée est délimitée par une paroi pectocellulosique et une membrane plasmique ; elle contient un cytoplasme où baignent divers organites (mitochondries, réticulum endoplasmique, vacuoles) ainsi qu'un noyau renfermant le matériel génétique.
Rôles — éléments 5 et 7 (mitochondries) : elles sont le siège de la respiration cellulaire et produisent l'énergie (ATP) nécessaire à l'activité de la cellule. Élément 13 (noyau, avec ses composantes 9 à 12) : il contient l'ADN (information génétique) et contrôle l'ensemble des activités et de la division de la cellule.
(Identification établie à partir de la disposition typique de ce type de schéma — à confronter à ton document original avant diffusion, notamment pour les éléments 5 et 7.)`
        },
        {
          q:"Corrigé — Consigne 2",
          r:`Cette cellule est une cellule végétale : elle possède une paroi pectocellulosique (absente chez la cellule animale) et une grande vacuole centrale (les vacuoles de la cellule animale sont petites et peu nombreuses, voire absentes). À l'inverse, la cellule animale possède un centrosome, structure généralement absente dans la cellule végétale mature.`
        }
      ]
    },
    {
      titre:"Exercice 2 — Questions objectives",
      points:"6 pts",
      enonce:`I. Complète le texte avec les mots suivants (eucaryote, animale, procaryote, membrane plasmique, paroi pectocellulosique, végétale, mitochondrie, vacuole) :
« La structure rigide qui entoure la membrane cellulaire et protège la cellule végétale est la ...1... Le centriole est une structure propre à la cellule ...2... Toutes les cellules sont entourées de ...3... qui sépare l'intérieur de la cellule de l'environnement extérieur. Une cellule ...4... possède un véritable noyau. »

II. Identifie l'intrus dans chaque cas :
1. Glucose, amidon, cellulose, chlorure.
2. Eau, sulfate, lactose, fer, zinc.
3. Centrosome, paroi pectocellulosique, grosse vacuole, plastes.
4. Hématies, paramécie, leucocytes, globulines.

III. Choisis la bonne réponse :
1. Les mitochondries : a) sont spécifiques aux cellules animales b) sont spécifiques aux cellules végétales c) se retrouvent dans les cellules animales et végétales d) possèdent un noyau.
2. Le centrosome : a) fournit de l'énergie à la cellule b) assure la formation de l'aster lors de la division cellulaire c) intervient dans la synthèse des protéines d) aucune bonne réponse.
3. Les lipides sont : a) des esters d'alcools et d'acides gras b) des constituants minéraux c) solubles dans l'eau d) contiennent les acides aminés.
4. Les échanges cellulaires se font : a) à travers la vacuole b) à travers la paroi cellulaire c) à travers la membrane plasmique.`,
      consignes:[
        { q:"Corrigé — I", r:`1. paroi pectocellulosique — 2. animale — 3. membrane plasmique — 4. eucaryote.` },
        {
          q:"Corrigé — II",
          r:`1. Intrus : chlorure (substance minérale ; les trois autres sont des glucides).
2. Intrus : lactose (glucide organique ; les autres sont des substances minérales ou l'eau).
3. Intrus : centrosome (structure de la cellule animale ; les trois autres sont caractéristiques de la cellule végétale).

        { q:"Corrigé — III", r:`1-c · 2-b · 3-a · 4-c.` }

    {
      titre:"Exercice 3 — Questions traditionnelles",
      points:"6 pts",
      enonce:`1. Une substance X est constituée de corps simples de formule générale R-CH(NH2)-COOH.

b. Cite deux propriétés de X.

2. Voici une liste de constituants cellulaires : acide aminé, huile de karité, glycogène, ovalbumine, calcium, amidon, graisse, eau, glucose, beurre. Classe-les selon leur groupe (Glucides, Lipides, Protides, Substances minérales).

3. Cite quatre rôles de l'eau dans la matière vivante.`,
      consignes:[
        {
          q:"Corrigé — 1",
          r:`a. X est un acide aminé (un protide).
b. Propriétés : il est soluble dans l'eau ; il est amphotère, possédant à la fois une fonction acide (COOH) et une fonction amine (NH2), ce qui lui permet de se lier à d'autres acides aminés par liaison peptidique.`
        },
        {
          q:"Corrigé — 2",
          r:`Glucides : glycogène, amidon, glucose. Lipides : huile de karité, graisse, beurre. Protides : acide aminé, ovalbumine. Substances minérales : calcium, eau.`
        },

      enonce:`On considère un schéma de cellule animale annoté de lettres a à m, montrant un noyau central avec nucléole, plusieurs mitochondries réparties dans le cytoplasme, un appareil de Golgi (structure empilée), un réticulum endoplasmique (lignes ondulées) et des lysosomes.

          r:`2. Si g correspond à une mitochondrie : structure ovale avec une membrane externe lisse et une membrane interne repliée en crêtes, délimitant une matrice interne.

Consigne 1 : Commente le résultat de l'expérience de l'osmomètre en précisant l'application du phénomène mis en jeu.
Consigne 2 : Explique l'état de chaque cellule observée (Fig a, b, c), et explique pourquoi, en saison pluvieuse, les plants de maïs sont vigoureux et bien verts alors qu'en saison sèche ils flétrissent.`,

          r:`Résultat : le niveau du liquide dans le tube de l'osmomètre monte de h1 à h2. Ceci s'explique par le phénomène d'osmose : l'eau pure (milieu extérieur hypotonique) traverse la membrane hémiperméable vers la solution de saccharose (milieu intérieur hypertonique), l'eau se déplaçant toujours du milieu le moins concentré vers le milieu le plus concentré en soluté à travers une membrane semi-perméable.
Application : ce phénomène explique l'absorption de l'eau par les racines des plantes, le principe de la dialyse rénale, et les techniques de conservation des aliments par salaison (l'effet inverse, plasmolysant, détruit les microbes).`
        },
        {
          q:"Corrigé — Consigne 2",
          r:`Fig a (eau de robinet, milieu hypotonique) : la cellule est turgescente — elle absorbe l'eau par osmose, son volume augmente, la membrane est pressée contre la paroi.
Fig b (eau très salée, milieu hypertonique) : la cellule est plasmolysée — elle perd de l'eau par osmose vers le milieu extérieur, le cytoplasme se rétracte et se détache de la paroi.
Fig c (témoin) : état normal de référence, cellule ni turgescente ni plasmolysée.
En saison pluvieuse, le sol riche en eau est hypotonique par rapport aux cellules racinaires : l'eau pénètre par osmose dans les racines puis dans toute la plante, assurant la turgescence des cellules — d'où des plants vigoureux et bien verts. En saison sèche, l'eau du sol se raréfie et les cellules, qui continuent à perdre de l'eau par transpiration sans compensation suffisante, perdent leur turgescence : les plants flétrissent et se décolorent.`

  exercices:[
    {
      titre:"Exercice 1",
      points:"8 pts",
      enonce:`Lors d'une sortie pédagogique dans une station de traitement des eaux, des élèves observent une expérimentation sur les échanges entre cellules et environnement. Un technicien utilise une solution saline pour tester les effets de différentes concentrations sur des cellules sanguines (document A) et sur une cellule végétale (document B).

Consigne 1 : Décris les effets des solutions hypotonique et hypertonique sur les globules rouges et sur une cellule végétale, puis donne une importance de ces échanges mentionnée par le technicien.
Consigne 2 : Nomme ces cellules, fais ressortir leurs points communs et divergents, puis identifie l'organite responsable de ces échanges cellulaires.`,
      consignes:[
        {
          q:"Corrigé — Consigne 1",
          r:`En milieu hypotonique (moins concentré que le cytoplasme), l'eau entre dans la cellule par osmose : le globule rouge gonfle et peut éclater (hémolyse), n'ayant pas de paroi rigide pour le contenir ; la cellule végétale devient turgescente, sans éclater, grâce à sa paroi pectocellulosique.
En milieu hypertonique (plus concentré), l'eau sort de la cellule par osmose : le globule rouge se rétracte et se ratatine (crénelure) ; la cellule végétale se plasmolyse (le cytoplasme se détache de la paroi).
Importance : ces échanges sont essentiels en médecine pour la conception de sérums adaptés (éviter l'hémolyse ou la crénelure des globules rouges lors des perfusions) et en agriculture pour optimiser l'absorption des nutriments par les plantes.`
        },
        {
          q:"Corrigé — Consigne 2",
          r:`Cellules : le globule rouge (hématie) et une cellule végétale.
Points communs : toutes deux possèdent une membrane plasmique semi-perméable et un cytoplasme, et échangent de l'eau par osmose selon les mêmes lois physiques.
Points divergents : le globule rouge mature n'a pas de noyau ni de paroi ni de vacuole, contrairement à la cellule végétale qui possède noyau, paroi pectocellulosique et grande vacuole.
Organite responsable des échanges : la membrane plasmique, structure semi-perméable qui régule le passage de l'eau et des substances.`
        }
      ]
    },
    {
      titre:"Exercice 2",
      points:"6 pts",
      enonce:`I. Parmi les affirmations suivantes, deux sont fausses : identifie-les puis corrige-les.
1. Les vacuoles sont plus grosses et plus nombreuses dans les cellules animales que dans les cellules végétales.
2. La mitose assure une distribution des chromosomes entre les deux cellules filles qui reçoivent des parties à peu près équivalentes du programme génétique de la cellule mère.
3. La méiose est une reproduction conforme comportant deux types de divisions : une division réductionnelle et une division équationnelle.
4. L'amidon est un polymère de glucose qui donne une solution colloïdale avec l'eau chaude et une suspension avec l'eau froide.

II. Choisis la bonne réponse :
1. Quelle est la caractéristique principale de la Prophase I de la méiose ? a. alignement des chromosomes sur l'équateur b. formation de tétrades c. séparation des chromatides d. reconstitution de l'enveloppe nucléaire.
2. Le transport actif est le passage de substances dissoutes à travers la membrane cellulaire : a. suivant le gradient de concentration b. contre le gradient de concentration c. avec consommation d'énergie.
3. Avec un osmomètre à membrane hémiperméable, on peut mettre en évidence : a. le phénomène d'osmose b. le phénomène de dialyse c. les phénomènes d'osmose et de dialyse.
4. La saponification est une réaction entre : a. un polypeptide et un acide gras b. un acide gras et un alcool c. un acide aminé et une base d. un ester et une base.

III. On possède 4 solutions vraies A, B, C et D de concentrations inconnues. Différents montages avec des osmomètres donnent :
Montage 1 : osmomètre=B, cristallisoir=D, niveau monte.
Montage 2 : osmomètre=A, cristallisoir=B, niveau baisse.
Montage 3 : osmomètre=D, cristallisoir=C, niveau monte.
Montage 4 : osmomètre=A, cristallisoir=D, niveau monte.
Classe ces 4 solutions de la plus concentrée à la moins concentrée.`,
      consignes:[
        {
          q:"Corrigé — I",
          r:`Les deux affirmations fausses sont 1 et 3.
1. Correction : les vacuoles sont plus grosses et plus nombreuses dans les cellules VÉGÉTALES que dans les cellules animales (et non l'inverse).
3. Correction : la méiose est une reproduction RÉDUCTIONNELLE (et non conforme) comportant deux divisions, une réductionnelle et une équationnelle — c'est la mitose qui est une reproduction conforme.`
        },
        { q:"Corrigé — II", r:`1-b (formation de tétrades). 2-b et c (le transport actif se fait contre le gradient de concentration, ce qui nécessite une consommation d'énergie — les deux propriétés sont liées). 3-a (seul le phénomène d'osmose, une membrane hémiperméable ne laissant passer que l'eau, pas les solutés comme dans la dialyse). 4-d (un ester et une base).` },
        {
          q:"Corrigé — III",
          r:`Montage 1 (niveau monte, B→D) : B plus concentrée que D.
Montage 2 (niveau baisse, A→B) : B plus concentrée que A.
Montage 3 (niveau monte, D→C) : D plus concentrée que C.
Montage 4 (niveau monte, A→D) : A plus concentrée que D.
En combinant ces résultats : B > A > D > C (de la plus concentrée à la moins concentrée).`
        }
      ]
    },
    {
      titre:"Exercice 3",
      points:"6 pts",
      enonce:`Les schémas A, B, C, D et E ont été réalisés à partir de l'observation de coupes d'organes de plantes à fleurs (cellule mère du pollen en cours de division).
1. Quelle est la formule chromosomique de cette plante à fleur ?
2. Quel est le phénomène de la vie cellulaire mis en évidence par ces schémas ? Donne-en deux importances.
3. Mets un titre à chaque schéma. Justifie ta réponse.
4. Retrouve l'ordre chronologique du déroulement du phénomène en utilisant les lettres.`,
      consignes:[
        {
          q:"Corrigé — 1 et 2",
          r:`1. La cellule mère du pollen est diploïde, de formule chromosomique 2n ; les microspores (grains de pollen) issues de la division sont haploïdes, de formule chromosomique n.
2. Phénomène mis en évidence : la méiose (division réductionnelle permettant la formation des microspores/gamètes à partir d'une cellule mère diploïde).
Deux importances : elle maintient constant le nombre de chromosomes de l'espèce au fil des générations (la fécondation rétablissant ensuite le nombre diploïde) ; elle est source de diversité génétique par le brassage chromosomique.`
        },
        {
          q:"Corrigé — 3 et 4 (identification et ordre des schémas)",
          r:`D'après l'aspect des schémas : A montre des bivalents (chromosomes appariés) alignés au centre de la cellule (métaphase I) ; D montre les chromosomes en cours de séparation vers les pôles (anaphase I) ; E montre la cellule qui se divise en deux avec un groupe de chromosomes à chaque pôle (télophase I) ; C montre des chromosomes simples (non appariés) alignés dans l'une des cellules filles (métaphase II) ; B montre le résultat final, quatre microspores séparées (tétrade).
Ordre chronologique proposé : A → D → E → C → B.
Cette identification et cet ordre sont établis à partir de l'aspect visuel des schémas (formes et regroupements des chromosomes) — à confronter avec ton document original avant diffusion, la distinction entre certains stades (notamment A/D et le placement exact de C) n'étant pas garantie avec une certitude absolue.`
        }
      ]
    }
  ]
},

    {
      titre:"Exercice 1",
      points:"8 pts",
      enonce:`Matériels : un générateur de 12V, un ampèremètre, des fils conducteurs, deux conducteurs ohmiques R1=15Ω et R2=20Ω, un interrupteur. Durée de fonctionnement t=30min.

Consigne : réalise le montage pour chaque type d'association (série et dérivation) et détermine la résistance équivalente, les tensions, les intensités, la puissance et l'énergie du générateur dans chaque cas. Conclus en comparant les deux associations.`,
      consignes:[
        {
          q:"Corrigé officiel — Association en série",
          r:`Réq = R1+R2 = 15+20 = 35 Ω.
Intensité : I = U/Réq = 12/35 = 0,34 A (I=I1=I2).
Tensions : U1 = R1×I = 15×0,34 = 5,1 V ; U2 = R2×I = 20×0,34 = 6,9 V.
Puissance : P = U×I = 12×0,34 = 4,08 W.
Énergie : E = P×t = 4,08×1800 = 7344 J (≈2,04 Wh).`
        },
        {
          q:"Corrigé officiel — Association en dérivation",
          r:`Réq = (R1×R2)/(R1+R2) = 8,57 Ω.
Intensité totale : I = U/Réq = 12/8,57 = 1,4 A. I1 = U/R1 = 12/15 = 0,8 A ; I2 = U/R2 = 12/20 = 0,6 A.
Tensions : U = U1 = U2 = 12 V.
Puissance : P = U×I = 12×1,4 = 16,8 W.
Énergie : E = P×t = 16,8×1800 = 30240 J (≈8,4 Wh).
Conclusion : l'association en série donne une résistance équivalente plus grande que chacune des deux résistances (et consomme moins d'énergie) ; l'association en dérivation donne une résistance équivalente plus petite que chacune des deux résistances.`

      enonce:`1. Détermine les nombres α, β, ω, φ, Ω à partir de : K=[−2;4]∩[−2;→[ (donne α et β, avec α<β) ; l'inéquation (I): 2x+4≥3x+6 (donne φ) ; l'équation (E): x²−16=0, avec ω la solution négative ; le système {2x−3y=1 ; 3x−y=5} (donne Ω).

      consignes:[
        {
          q:"Corrigé officiel",
          r:`K = [−2;4]∩[−2;→[ = [−2;4]. Comme α<β : α=−2, β=4.
(I): 2x+4≥3x+6 → −x≥2 → x≤−2, donc φ=−2 (ou l'intervalle correspondant).
(E): x²−16=0 → x²=16 → x=4 ou x=−4. Comme ω est la solution négative : ω=−4.
Système : (1) donne y=(2x−1)/3. En substituant dans (2) : 9x−2x+1=15 → 7x=14 → x=2, puis y=1. Donc Ω correspond à (2;1).
Points : A(−2;4), B(−4;2), C(0;−2), D(2;0).
Aire : AB=√[(−4+2)²+(2−4)²]=√8=2√2 ; BC=√[(−4)²+(−2−2)²]=√32=4√2. Aire = L×l = 2√2×4√2 = 16 dam².

    {
      titre:"Exercice 1",
      points:"non précisé",
      enonce:`Le petit frère d'un élève a consommé un repas constitué de plusieurs aliments (glucides, protides, lipides, eau, sels minéraux, vitamines), y compris des grains de haricot. Le lendemain, des débris de grains de haricot sont retrouvés dans ses selles.

      consignes:[
        {
          q:"Corrigé officiel — Consigne 1",
          r:`Dans la bouche, les aliments sont broyés et imprégnés de salive (bol alimentaire) ; les glucides sont transformés en maltose par l'amylase salivaire. Dans l'estomac, après brassage et action du suc gastrique, on obtient le chyme ; les protides sont transformés en polypeptides et peptones par la pepsine et la présure. Dans l'intestin grêle, après action des sucs intestinal et pancréatique et de la bile, on obtient le chyle : l'amidon restant est transformé en maltose puis glucose, les lipides en acides gras et glycérol, les peptides en acides aminés. L'eau, les sels minéraux et les vitamines ne subissent pas de transformation.
Les débris de haricot dans les selles montrent que la mastication du haricot dans la bouche a été insuffisante/absente pour ce grain particulier, contrairement aux autres aliments qui ont bien suivi les transformations mécaniques et chimiques.`
        },
        {
          q:"Corrigé officiel — Consigne 2",
          r:`Deux voies d'absorption intestinale : la voie sanguine, empruntée par l'eau, les sels minéraux, les acides aminés, le glucose et les vitamines hydrosolubles ; et la voie lymphatique, empruntée par les acides gras, le glycérol et les vitamines liposolubles.`

Intérêt philosophique : Bachelard montre la dialectique nécessaire entre théorie et expérience (adjuvants : Einstein, Claude Bernard, Bacon).
Conclusion : l'observation scientifique doit être associée à l'expérience et à la raison pour transcender l'apparence.`

  exercices:[
    {
      titre:"Exercice 1",
      points:"8 pts",
      enonce:`Consigne 1 : Résous l'équation différentielle (E): y''+y'+¼y=0. Sachant que f, solution de (E), vérifie f(0)=-0,2 et f'(0)=0,2, calcule f(10) et détermine si le prototype de véhicule présente un défaut de consommation (sans défaut si 0,005≤f(10)≤0,006).

Consigne 2 : 95% des véhicules sont sans défaut de consommation ; 80% des véhicules sans défaut réussissent le test de rigidité ; 2% ont les deux défauts. Bénéfices : 600 000F (sans défaut), 100 000F (défaut de consommation), 300 000F (défaut de rigidité), −700 000F (les deux défauts). Détermine le bénéfice moyen, puis le nombre de véhicules à fabriquer par jour pour que la probabilité d'avoir au moins un véhicule sans défaut soit ≥ 0,999.`,
      consignes:[
        {
          q:"Corrigé officiel — Consigne 1",
          r:`Équation caractéristique : r²+r+¼=0, Δ=0, r0=−1/2. Solutions : f(t)=(At+B)e^(−t/2). Avec f(0)=−0,2 et f'(0)=0,2 : B=−0,2, A=0,1. Donc f(t)=(0,1t−0,2)e^(−t/2).
f(10) = (0,1×10−0,2)×e^(−5) ≈ 0,0054. Comme 0,005≤0,0054≤0,006, le prototype est sans défaut de consommation en carburant.`
        },
        {
          q:"Corrigé officiel — Consigne 2",
          r:`Notons C « sans défaut de consommation », R « sans défaut de rigidité ». P(C)=0,95 ; P(R|C)=0,8 ; P(non-R∩non-C)=0,01. Calculs : P(R∩C)=0,76 ; P(non-R∩C)=0,19 ; P(R∩non-C)=0,03 ; P(non-R∩non-C)=0,02 (ou 0,01 selon les données).
Loi de X (bénéfice) : X∈{−700000; 100000; 300000; 600000} avec probabilités {0,02; 0,19; 0,03; 0,76}.
Espérance : E(X) = −14000+19000+9000+456000 = 470 000 F CFA (bénéfice moyen).
Avec Y suivant une loi binomiale (n; 0,76) : Pn=P(Y≥1)=1−0,24ⁿ≥0,999 → 0,24ⁿ≤0,001 → n≥ln(0,001)/ln(0,24)≈4,84. Il faut fabriquer au moins 5 véhicules par jour.`
        }
      ]
    },
    {
      titre:"Exercice 2",
      points:"6 pts",
      enonce:`I. Complète un tableau de fonctions/primitives.
II. Choisis la bonne réponse (vecteurs, nombres complexes, événements indépendants).

      consignes:[
        {
          q:"Corrigé officiel — I (primitives)",
          r:`1+tan²x → tan(x). ex/(ex+1)² → −1/(ex+1). ln(x)/x → ½ln(x)². x/√(9+x²) → √(9+x²). ln(x) → x·ln(x)−x. x·e^(x²) → ½e^(x²). 1/(x·ln(x)) → ln|ln(x)|. (1−x)/(1+x) → −x+2ln|1+x|.`
        },
        {
          q:"Corrigé officiel — II et III",
          r:`II. 1. colinéaires / perpendiculaires / orthogonaux / √14/2. 2. √2 ; π/12. 3. 3/2. 4. A et B sont indépendants. 5. 0.
III. 1. z2=1+i, z3=2+2i. 2. (Ω(2), k=√2, θ=−π/4). 3. (zn+1−zn)/(2−zn)=i ; ΩMnMn+1 est un triangle rectangle isocèle en M. 4. (yn) est une suite géométrique de raison q=1+i ; y1=z1−2=−1.`
        }
      ]
    },
    {
      titre:"Exercice 3 — Étude de fonction",
      points:"6 pts",
      enonce:`Partie A : g(x)=(2x+1)e^(−2x)+1. 1. Calcule les limites de g en +∞ et −∞. 2. a. Étudie les variations de g. b. Montre que g(x)=0 admet une unique solution α∈]−1;0[, et déduis le signe de g.

Partie B : f(x)=(x+1)e^(−2x)+1−x. 1. a. Calcule les limites de f. b. Montre que (D):y=−x+1 est asymptote en +∞. c. Étudie la position de la courbe par rapport à (D). 2. a. Montre que f'(x)=−g(x). b. Dresse le tableau de variation de f. c. Montre que f(x)=0 admet une unique solution β∈[1;3/2]. d. Montre que f(−β)=0. 3. Trace (D) et la courbe. 4. Calcule I(t)=∫[−1,t](x+1)e^(−2x)dx et l'aire A(t), puis sa limite en +∞.`,
      consignes:[
        {
          q:"Corrigé officiel — Partie A",
          r:`Limites : lim(−∞) g(x)=−∞ ; lim(+∞) g(x)=1.
g'(x)=−4x·e^(−2x), s'annule en x=0 (maximum). g réalise une bijection de ]−∞;0[ sur ]−∞;2[, et g(−1)·g(0)<0, donc il existe une unique solution α∈]−1;0[. g(x)<0 sur ]−∞;α[ et g(x)>0 sur ]α;+∞[.`
        },
        {
          q:"Corrigé officiel — Partie B",
          r:`Limites : lim(−∞) f(x)=−∞ ; lim(+∞) f(x)=−∞.
Asymptote (D):y=−x+1 en +∞ car lim[f(x)−(1−x)]=lim(x+1)e^(−2x)=0. Pour x<−1, la courbe est en dessous de (D) ; pour x>−1, au-dessus.
f'(x)=−g(x) ; f est croissante sur ]−∞;α[, décroissante sur ]α;+∞[.
f(x)=0 admet une unique solution β∈[1;3/2] (théorème des valeurs intermédiaires, f(1)·f(3/2)<0). f(−β)=e^(2β)·f(β)=0, donc −β est aussi solution.
I(t) = −(t+1)/2·e^(−2t) − ¼e^(−2t) + ¼e². A(t)=4I(t)=(−2t−3)e^(−2t)+e² cm². Limite de A(t) en +∞ : e² cm².`
        }
      ]
    }
  ]

      consignes:[

          q:"Corrigé officiel",
          r:`Poids réel : P=m×g=0,47×10=4,70N.

/* ===========================================================
   CONFIGURATION DE LA NAVIGATION
   -----------------------------------------------------------
   Chaque sujet (voir SUJETS ci-dessus) porte les champs :
     cycle   : identifiant d'un cycle défini dans CYCLES
     classe  : une des classes de ce cycle
     serie   : une série du cycle si cycle.hasSeries === true,
               sinon null
     matiere : une des valeurs de MATIERES_TOUTES

   CYCLES décrit la hiérarchie de navigation de façon déclarative :
   ajouter un cycle, une classe ou une série ne nécessite AUCUNE
   modification des fonctions de rendu plus bas — elles lisent
   uniquement cette configuration.
=========================================================== */
const CYCLES = [
  { id:"secondaire1", label:"Secondaire 1", classes:["6e","5e","4e","3e"], hasSeries:false },
  { id:"secondaire2", label:"Secondaire 2", classes:["Seconde","Première","Terminale"], hasSeries:true, series:["A4","D","C","C4"] }
];

const MATIERES_TOUTES = ["SVT","Mathématiques","Français","Physique-Chimie","Anglais","Histoire-Géo","ECM","Philosophie"];

/* ===========================================================
   ÉTAT DE NAVIGATION
=========================================================== */
let state = {
  cycleId: "secondaire1",
  classe:  "3e",   // ouvre par défaut sur la classe qui a du contenu
  serie:   null,
  matiere: null,
  sujetId: null
};

/** Retourne la configuration du cycle actuellement sélectionné. */
function getCurrentCycle(){
  return CYCLES.find(c => c.id === state.cycleId);
}

/**
 * Filtre SUJETS selon la position courante dans la navigation
 * (cycle, classe, série si applicable), avec un filtre matière
 * optionnel. Point d'entrée unique pour tout comptage/listing —
 * évite de dupliquer la logique de filtrage à plusieurs endroits.
 */
function getSujetsAt({ matiere = null } = {}){
  const cycle = getCurrentCycle();
  return SUJETS.filter(s => {
    if (s.cycle !== state.cycleId) return false;
    if (s.classe !== state.classe) return false;
    if (cycle.hasSeries && s.serie !== state.serie) return false;
    if (matiere && s.matiere !== matiere) return false;
    return true;
  });
}

/* ===========================================================
   RENDU — un dispatcher principal + des vues composées
   à partir d'un unique composant réutilisable (renderChipRow).
=========================================================== */
const app = document.getElementById('app');

function render(){
  app.innerHTML = '';

  renderCycleTabs();
  renderClasseTabs();
  if (getCurrentCycle().hasSeries) renderSerieBand();
  renderMatiereBand();

  if (state.sujetId) renderDetail();
  else renderSujets();

  window.scrollTo(0, 0);
}

/**
 * Composant générique : une rangée de "puces" sélectionnables
 * (onglets de cycle/classe, ou bande déroulante de série/matière).
 * Centralise le rendu + la logique active/désactivé/clic pour
 * éviter la duplication entre les 4 niveaux de navigation.
 *
 * @param {object} opts
 *   items        - tableau des valeurs à afficher
 *   rowClass     - classe CSS du conteneur (ex. 'class-tabs')
 *   chipClass    - classe CSS de chaque puce (ex. 'class-tab')
 *   getLabel     - (item) => texte affiché
 *   isActive     - (item) => booléen
 *   getCount     - (item) => nombre de sujets correspondants, ou null
 *                  si le comptage ne s'applique pas à ce niveau
 *   onSelect     - (item) => effectue la sélection et réaffiche
 */
function renderChipRow(opts){
  const { items, rowClass, chipClass, getLabel, isActive, getCount, onSelect } = opts;

  const row = document.createElement('div');
  row.className = rowClass;

  items.forEach(item => {
    const count = getCount ? getCount(item) : null;
    const disabled = count === 0;

    const chip = document.createElement('div');
    chip.className = chipClass
      + (isActive(item) ? ' active' : '')
      + (disabled ? ' disabled' : '');
    chip.textContent = getLabel(item) + (count ? ' · ' + count : '');

    if (!disabled) chip.onclick = () => onSelect(item);
    row.appendChild(chip);
  });

  app.appendChild(row);
}

function renderCycleTabs(){
  renderChipRow({
    items: CYCLES,
    rowClass: 'class-tabs',
    chipClass: 'class-tab',
    getLabel: c => c.label,
    isActive: c => c.id === state.cycleId,
    getCount: null, // toujours activé, quel que soit le contenu
    onSelect: c => {
      state.cycleId = c.id;
      state.classe  = c.classes[0];
      state.serie   = c.hasSeries ? c.series[0] : null;
      state.matiere = null;
      state.sujetId = null;
      render();
    }
  });
}

function renderClasseTabs(){
  const cycle = getCurrentCycle();
  renderChipRow({
    items: cycle.classes,
    rowClass: 'class-tabs classe-tabs-sub',
    chipClass: 'class-tab',
    getLabel: c => c,
    isActive: c => c === state.classe,
    getCount: null, // la classe reste choisissable même sans contenu encore
    onSelect: c => {
      state.classe  = c;
      state.serie   = cycle.hasSeries ? cycle.series[0] : null;
      state.matiere = null;
      state.sujetId = null;
      render();
    }
  });
}

function renderSerieBand(){
  const cycle = getCurrentCycle();
  const h = document.createElement('h2');
  h.className = 'section-title';
  h.textContent = state.classe + ' — choisis une série';
  app.appendChild(h);

  renderChipRow({
    items: cycle.series,
    rowClass: 'matiere-band',
    chipClass: 'matiere-chip serie-chip',
    getLabel: s => 'Série ' + s,
    isActive: s => s === state.serie,
    getCount: null, // la série reste choisissable même sans contenu encore
    onSelect: s => {
      state.serie   = s;
      state.matiere = null;
      state.sujetId = null;
      render();
    }
  });
}

function renderMatiereBand(){
  const h = document.createElement('h2');
  h.className = 'section-title';
  const label = getCurrentCycle().hasSeries
    ? `${state.classe} (série ${state.serie}) — choisis une matière`
    : `Classe de ${state.classe} — choisis une matière`;
  h.textContent = label;
  app.appendChild(h);

  renderChipRow({
    items: MATIERES_TOUTES,
    rowClass: 'matiere-band',
    chipClass: 'matiere-chip',
    getLabel: m => m,
    isActive: m => m === state.matiere,
    getCount: m => getSujetsAt({ matiere: m }).length,
    onSelect: m => {
      state.matiere = m;
      state.sujetId = null;
      render();
    }
  });
}

function renderSujets(){
  if(!state.matiere){
    const note = document.createElement('p');
    note.className='empty-note';
    note.textContent = 'Choisis une matière ci-dessus pour voir les sujets disponibles.';
    app.appendChild(note);
    return;
  }

  const h = document.createElement('h3');
  h.className='section-title';
  h.style.marginTop='18px';
  h.textContent = state.matiere + ' — sujets disponibles';
  app.appendChild(h);

  const list = getSujetsAt({ matiere: state.matiere })
                 .sort((a,b)=>b.annee-a.annee);

  list.forEach(s=>{
    const card = document.createElement('div');
    card.className='sujet-card';
    card.onclick = ()=>{ state.sujetId=s.id; render(); };
    const titre = document.createElement('div');
    titre.className='titre';
    titre.textContent = `${s.examen} ${s.annee}`;
    const meta = document.createElement('div');
    meta.className='meta';
    meta.textContent = `${s.session}${s.duree? ' · '+s.duree:''}`;
    const badge = document.createElement('div');
    badge.className='badge-corrige';
    badge.textContent='corrigé';
    card.appendChild(badge);
    card.appendChild(titre);
    card.appendChild(meta);
    app.appendChild(card);
  });

  if(list.length===0){
    const note = document.createElement('p');
    note.className='empty-note';
    note.textContent='Aucun sujet pour le moment dans cette matière pour cette classe.';
    app.appendChild(note);
  }
}

function renderDetail(){
  const sujet = SUJETS.find(s=>s.id===state.sujetId);
  if(!sujet){ state.sujetId=null; render(); return; }

  const back = document.createElement('button');
  back.className='back-fab';
  back.textContent='← Retour aux sujets';
  back.onclick = ()=>{ state.sujetId=null; render(); };
  app.appendChild(back);

  const toolbar = document.createElement('div');
  toolbar.className='export-toolbar';
  const btnWord = document.createElement('button');
  btnWord.className='export-btn';
  btnWord.textContent='📝 Télécharger en Word';
  btnWord.onclick = () => exportSujetAsWord(sujet);
  const btnPdf = document.createElement('button');
  btnPdf.className='export-btn';
  btnPdf.textContent='📄 Télécharger en PDF';
  btnPdf.onclick = () => exportSujetAsPdf(sujet);
  toolbar.appendChild(btnWord);
  toolbar.appendChild(btnPdf);
  app.appendChild(toolbar);

  const head = document.createElement('div');
  head.className='sujet-header';
  head.innerHTML = `<div class="examtitle">${sujet.examen} ${sujet.annee}</div>
    <table>
      <tr><td>Matière</td><td>: ${sujet.matiere}</td><td>Durée</td><td>: ${sujet.duree||'—'}</td></tr>
      <tr><td>Session</td><td>: ${sujet.session}</td><td>Coef</td><td>: ${sujet.coef||'—'}</td></tr>
    </table>`;
  app.appendChild(head);

  sujet.exercices.forEach((ex,exi)=>{
    const box = document.createElement('div');
    box.className='exercice';
    let html = `<h3>${ex.titre}${ex.points? ' ('+ex.points+')':''}</h3>`;
    html += `<div class="enonce">${escapeHtml(ex.enonce)}</div>`;
    box.innerHTML = html;

    if(ex.documents){
      ex.documents.forEach(doc=>{
        const d = document.createElement('div');
        let dh = `<p style="font-family:'Courier New',monospace;font-size:12.5px;margin:14px 0 4px;font-weight:700;">${doc.titre}</p>`;
        if(doc.intro) dh += `<div class="enonce" style="font-size:14px;">${escapeHtml(doc.intro)}</div>`;
        dh += doc.html;
        d.innerHTML = dh;
        box.appendChild(d);
      });
    }

    ex.consignes.forEach((c,ci)=>{
      const cwrap = document.createElement('div');
      cwrap.className='consigne';
      const q = document.createElement('div');
      q.className='q';
      q.textContent = c.q;
      cwrap.appendChild(q);

      const btn = document.createElement('button');
      btn.className='reveal-btn';
      btn.textContent='✎ Voir le corrigé';
      const rid = `corrige-${exi}-${ci}`;
      const rdiv = document.createElement('div');
      rdiv.className='corrige';
      rdiv.id = rid;
      rdiv.innerHTML = `<span class="tick">✓</span> ${escapeHtml(c.r).replace(/\n/g,'<br>')}`;

      btn.onclick = ()=>{
        const shown = rdiv.classList.toggle('show');
        btn.textContent = shown ? '✎ Masquer le corrigé' : '✎ Voir le corrigé';
      };

      cwrap.appendChild(btn);
      cwrap.appendChild(rdiv);
      box.appendChild(cwrap);
    });

    app.appendChild(box);
  });
}

/* ===========================================================
   EXPORT — génération Word (.doc) et PDF (impression navigateur)
   -----------------------------------------------------------
   Les deux exports partagent la même mise en forme de contenu
   (buildSujetContentHtml) pour éviter toute divergence entre
   les deux formats — un seul endroit à maintenir.
=========================================================== */

/** Nom de fichier sûr : enlève accents/caractères spéciaux. */
function slugifyFilename(text){
  return text
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-zA-Z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '');
}

/**
 * Construit le HTML du contenu d'un sujet (titre, documents, exercices,
 * consignes + corrigés) — indépendant de la mise en page de l'appli,
 * pensé pour être imprimé ou ouvert dans Word.
 */
function buildSujetContentHtml(sujet){
  const nl2br = t => escapeHtml(t).replace(/\n/g, '<br>');

  let body = `<h1>${escapeHtml(sujet.examen)} ${sujet.annee}</h1>
    <p><b>Matière :</b> ${escapeHtml(sujet.matiere)} &nbsp; <b>Classe :</b> ${escapeHtml(sujet.classe)}${sujet.serie ? ' (série '+escapeHtml(sujet.serie)+')' : ''}<br>
    <b>Session :</b> ${escapeHtml(sujet.session)} &nbsp; <b>Durée :</b> ${escapeHtml(sujet.duree||'—')} &nbsp; <b>Coef :</b> ${escapeHtml(sujet.coef||'—')}</p>
    <hr>`;

  sujet.exercices.forEach(ex=>{
    body += `<h2>${escapeHtml(ex.titre)}${ex.points ? ' ('+escapeHtml(ex.points)+')' : ''}</h2>`;
    body += `<p>${nl2br(ex.enonce)}</p>`;

    if(ex.documents){
      ex.documents.forEach(doc=>{
        body += `<p><b>${escapeHtml(doc.titre)}</b></p>`;
        if(doc.intro) body += `<p>${nl2br(doc.intro)}</p>`;
        body += doc.html;
      });
    }

    ex.consignes.forEach(c=>{
      body += `<p><b>${escapeHtml(c.q)}</b></p>`;
      body += `<p style="color:#A8332A;">${nl2br(c.r)}</p>`;
    });
  });

  return body;
}

/** Télécharge le sujet au format Word (.doc), via la technique HTML-blob. */
function exportSujetAsWord(sujet){
  const content = buildSujetContentHtml(sujet);
  const doc = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
    <head><meta charset="utf-8"><title>${escapeHtml(sujet.examen)} ${sujet.annee}</title></head>
    <body style="font-family:Calibri,Arial,sans-serif;">${content}</body></html>`;

  const blob = new Blob(['\ufeff', doc], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = slugifyFilename(`${sujet.examen}-${sujet.annee}-${sujet.matiere}`) + '.doc';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/**
 * "Export PDF" via la boîte d'impression du navigateur : ouvre le
 * contenu du sujet dans une fenêtre dédiée et déclenche l'impression ;
 * l'utilisateur choisit "Enregistrer en PDF" comme destination.
 * Choix volontaire : pas de librairie PDF externe, donc rien à charger
 * depuis le réseau — cohérent avec le fonctionnement hors ligne de l'appli.
 */
function exportSujetAsPdf(sujet){
  const content = buildSujetContentHtml(sujet);
  const printHtml = `<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
    <title>${escapeHtml(sujet.examen)} ${sujet.annee}</title>
    <style>
      body{font-family:Georgia,serif; color:#1C2B23; padding:24px; line-height:1.5;}
      h1{font-size:20px;} h2{font-size:16px; margin-top:24px; border-bottom:1px solid #ccc;}
      table{border-collapse:collapse; width:100%; margin:10px 0;}
      td,th{border:1px solid #333; padding:5px 8px; text-align:left;}
    </style>
    </head><body>${content}</body></html>`;

  const printWindow = window.open('', '_blank');
  if(!printWindow){
    alert("Le navigateur a bloqué l'ouverture de la fenêtre d'impression. Autorise les pop-ups pour ce site puis réessaie.");
    return;
  }
  printWindow.document.write(printHtml);
  printWindow.document.close();
  printWindow.focus();
  printWindow.print();
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

render();

/* ---------------------------------------------------------
   OFFLINE : enregistrement du service worker + badge
--------------------------------------------------------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
function updateOfflineBadge(){
  const b = document.getElementById('offlineBadge');
  if(navigator.onLine){ b.classList.remove('show'); }
  else{ b.classList.add('show'); }
}
window.addEventListener('online', updateOfflineBadge);
window.addEventListener('offline', updateOfflineBadge);
updateOfflineBadge();
