<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#22352A">
<title>Annales BEPC/BAC — AYH</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --paper:#EAE3D2;
    --paper-dark:#DCD3BC;
    --ink:#1C2B23;
    --board:#22352A;
    --board-dark:#16241C;
    --red:#A8332A;
    --red-dim:#c96a5f;
    --gold:#C8932A;
    --line:#c9bfa4;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:Georgia, 'Times New Roman', serif;
    min-height:100vh;
    padding-bottom:40px;
  }
  /* subtle paper texture via layered gradients */
  body{
    background-image:
      radial-gradient(circle at 15% 8%, rgba(0,0,0,0.025) 0, transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(0,0,0,0.025) 0, transparent 40%);
  }

  header.top{
    background:var(--board);
    color:var(--paper);
    padding:18px 16px 22px;
    position:relative;
    overflow:hidden;
    border-bottom:4px solid var(--gold);
  }
  header.top .eyebrow{
    font-family:'Courier New', monospace;
    letter-spacing:3px;
    font-size:11px;
    opacity:0.75;
    text-transform:uppercase;
  }
  header.top h1{
    margin:6px 0 2px;
    font-family:'Courier New', monospace;
    font-size:24px;
    letter-spacing:1px;
    font-weight:700;
  }
  header.top p.sub{
    margin:0;
    font-size:13px;
    opacity:0.85;
    font-style:italic;
  }
  .stamp{
    position:absolute;
    right:-14px; top:-14px;
    width:92px; height:92px;
    border:3px solid var(--gold);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    transform:rotate(14deg);
    opacity:0.85;
  }
  .stamp span{
    font-family:'Courier New', monospace;
    font-size:9px;
    letter-spacing:1px;
    text-align:center;
    color:var(--gold);
    line-height:1.3;
  }

  .offline-badge{
    position:fixed; top:8px; right:10px;
    font-size:10px; color:var(--paper);
    background:rgba(0,0,0,0.35);
    padding:3px 7px; border-radius:10px;
    display:none; z-index:50;
    font-family:'Courier New', monospace;
  }
  .offline-badge.show{display:block;}

  main{max-width:640px; margin:0 auto; padding:16px;}

  /* breadcrumb */
  .crumbs{
    font-family:'Courier New', monospace;
    font-size:12px;
    color:var(--ink);
    opacity:0.65;
    margin:14px 4px 10px;
  }
  .crumbs button{
    background:none;border:none;color:var(--red);
    font-family:inherit;font-size:inherit;cursor:pointer;
    padding:0;text-decoration:underline;
  }

  /* matiere tags */
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .tag{
    font-family:'Courier New', monospace;
    font-size:13px;
    padding:10px 14px;
    border:2px solid var(--ink);
    border-radius:3px;
    background:var(--paper-dark);
    cursor:pointer;
    letter-spacing:0.5px;
  }
  .tag.active{background:var(--board);color:var(--paper);border-color:var(--board);}
  .tag.disabled{opacity:0.4; cursor:default;}
  .tag .count{opacity:0.6; font-size:11px;}

  section.block{margin-top:22px;}
  h2.section-title{
    font-family:'Courier New', monospace;
    font-size:13px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--ink);
    opacity:0.55;
    margin:0 4px 10px;
    border-bottom:1px solid var(--line);
    padding-bottom:6px;
  }

  /* sujet cards */
  .sujet-card{
    background:var(--paper-dark);
    border:1px solid var(--line);
    border-left:5px solid var(--board);
    border-radius:2px;
    padding:14px 16px;
    margin-bottom:12px;
    cursor:pointer;
    position:relative;
  }
  .sujet-card:active{transform:scale(0.99);}
  .sujet-card .titre{
    font-family:'Courier New', monospace;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.5px;
  }
  .sujet-card .meta{
    font-size:12.5px;
    color:var(--ink);
    opacity:0.65;
    margin-top:4px;
    font-style:italic;
  }
  .sujet-card .badge-corrige{
    position:absolute;top:12px;right:12px;
    font-family:'Courier New', monospace;
    font-size:10px;
    color:var(--red);
    border:1px solid var(--red);
    padding:2px 6px;
    border-radius:10px;
    transform:rotate(-6deg);
  }

  /* sujet detail */
  .sujet-header{
    background:var(--paper);
    border:1px solid var(--ink);
    padding:14px 16px;
    margin-bottom:16px;
  }
  .sujet-header table{width:100%;border-collapse:collapse;font-family:'Courier New',monospace;font-size:12px;}
  .sujet-header td{padding:3px 0;}
  .sujet-header .examtitle{font-weight:700;font-size:16px;margin-bottom:8px;font-family:'Courier New',monospace;}

  .exercice{
    background:#fff8ec;
    border:1px solid var(--line);
    padding:16px;
    margin-bottom:18px;
    border-radius:2px;
  }
  .exercice h3{
    margin:0 0 10px;
    font-family:'Courier New', monospace;
    font-size:14px;
    text-decoration:underline;
  }
  .exercice .enonce{white-space:pre-wrap;font-size:15px;line-height:1.55;}
  .exercice table.doc-table{
    width:100%;border-collapse:collapse;margin:12px 0;font-size:13px;
  }
  .exercice table.doc-table td, .exercice table.doc-table th{
    border:1px solid var(--ink);padding:6px 8px;text-align:left;vertical-align:top;
  }
  .exercice table.doc-table th{background:var(--paper-dark);}

  .consigne{margin-top:16px;}
  .consigne .q{font-weight:700;font-size:15px;line-height:1.5;}
  .reveal-btn{
    margin-top:8px;
    background:none;
    border:1.5px dashed var(--red);
    color:var(--red);
    font-family:'Courier New', monospace;
    font-size:12.5px;
    padding:7px 12px;
    border-radius:3px;
    cursor:pointer;
    letter-spacing:0.5px;
  }
  .reveal-btn:active{background:rgba(168,51,42,0.08);}
  .corrige{
    display:none;
    margin-top:10px;
    padding:12px 14px 12px 16px;
    border-left:3px dashed var(--red);
    color:var(--red);
    font-style:italic;
    font-size:14.5px;
    line-height:1.6;
    transform:rotate(-0.4deg);
    background:rgba(168,51,42,0.04);
  }
  .corrige.show{display:block;}
  .corrige .tick{color:var(--red); font-style:normal; font-weight:700;}

  .back-fab{
    display:inline-block;
    margin-bottom:10px;
    font-family:'Courier New', monospace;
    font-size:13px;
    color:var(--board);
    border:1.5px solid var(--board);
    padding:6px 12px;
    border-radius:3px;
    cursor:pointer;
    background:none;
  }

  footer.credit{
    text-align:center;
    font-family:'Courier New', monospace;
    font-size:10.5px;
    opacity:0.45;
    margin-top:36px;
  }

  .empty-note{
    font-style:italic;
    opacity:0.65;
    font-size:13.5px;
    padding:10px 4px;
  }
</style>
</head>

const SUJETS = [
{
  id:"svt-bepc-2026-normale",
  matiere:"SVT", examen:"BEPC", annee:2026, session:"Session normale",
  duree:"2H",
  exercices:[
    {
      titre:"Exercice 1",
      points:"8 pts",
      enonce:`Adjoa est une femme enceinte depuis deux mois. Elle vit avec sa belle-mère Mariam, son mari Kokou et sa nièce Solim âgée de 19 ans. Depuis quelques jours, elle a des nausées, des vomissements, des maux de tête, des troubles respiratoires (essoufflements, gêne respiratoire) et la fièvre ; elle se sent faible et manque d'énergie.

Ces symptômes ont été banalisés car étant considérés comme des manifestations de la grossesse. Mais suite à une aggravation de son état de santé une nuit, elle fut transportée d'urgence au Centre Hospitalier Régional (CHR). Le médecin après consultation demande les analyses suivantes : la goutte épaisse (G.E) et la Numération Formule Sanguine (NFS).

Les résultats de ces analyses sont consignés dans le document 1.`,
      documents:[
        {
          titre:"Document 1 : Analyses et Résultats",
          html:`<table class="doc-table"><tr><th>Analyses</th><th>Résultats</th></tr>
          <tr><td>Goutte Épaisse</td><td>Présence de nombreux plasmodiums (+++)</td></tr>
          <tr><td>NFS</td><td>Nombre très faible de globules rouges par rapport à la normale et très faible concentration d'hémoglobine par rapport à la normale.</td></tr></table>`
        },
        {
          titre:"Document 2 : Tests sanguins et résultats",
          intro:`Au regard des résultats, le médecin prescrit des médicaments à la femme enceinte et décide de lui faire une transfusion sanguine. Malheureusement, il y a une pénurie de sang à la banque de sang du CHR. Les membres de sa famille se portent volontaires pour lui donner du sang. Des prélèvements de sang sont faits sur Adjoa et les membres de sa famille pour déterminer lequel des membres pourrait donner du sang.`,
          html:`<table class="doc-table"><tr><th>Gouttes de sang</th><th>Anti-A</th><th>Anti-B</th><th>Anti-A et Anti-B</th><th>Anti-Rh</th></tr>
          <tr><td>Adjoa</td><td>Pas d'agglutination</td><td>Pas d'agglutination</td><td>Pas d'agglutination</td><td>Agglutination</td></tr>
          <tr><td>Solim</td><td>Agglutination</td><td>Pas d'agglutination</td><td>Agglutination</td><td>Agglutination</td></tr>
          <tr><td>Kokou</td><td>Agglutination</td><td>Agglutination</td><td>Agglutination</td><td>Pas d'agglutination</td></tr>
          <tr><td>Mariam</td><td>Pas d'agglutination</td><td>Pas d'agglutination</td><td>Pas d'agglutination</td><td>Pas d'agglutination</td></tr></table>`
        }
      ],
      consignes:[
        {
          q:"Consigne 1 : Établis le lien entre le résultat de la goutte épaisse et l'anémie, l'insuffisance respiratoire et le manque d'énergie observés chez Adjoa.",
          r:`La goutte épaisse révèle de nombreux plasmodiums : Adjoa est atteinte de paludisme. Le plasmodium se multiplie dans les globules rouges et les détruit (hémolyse), ce qui explique le nombre très faible de globules rouges et la faible concentration d'hémoglobine (anémie) constatés à la NFS. Or l'hémoglobine transporte l'oxygène : sa diminution réduit l'apport d'oxygène aux organes, d'où le manque d'énergie ; et l'organisme accélère la respiration pour compenser ce déficit, d'où les troubles respiratoires.`
        },
        {
          q:"Consigne 2 : Après avoir expliqué l'importance des tests réalisés au niveau du document 2, détermine par un raisonnement logique la personne qui pourra donner du sang à Adjoa.",
          r:`Ces tests permettent de déterminer le groupe sanguin (ABO) et le facteur Rhésus de chaque personne, afin d'éviter une agglutination dangereuse lors de la transfusion.
D'après le document 2 : Adjoa est du groupe O, Rh+ ; Solim est du groupe A, Rh+ ; Kokou est du groupe AB, Rh− ; Mariam est du groupe O, Rh−.
Adjoa (O) possède des anticorps anti-A et anti-B : elle ne peut recevoir que des globules rouges du groupe O. Solim (A) et Kokou (AB) sont donc incompatibles.
Mariam (O−) est compatible : le groupe O est donneur universel, et un donneur Rh− convient à un receveur Rh+.
C'est donc Mariam qui peut donner son sang à Adjoa.`
        }
      ]
    },
    {
      titre:"Exercice 2",
      points:"6 pts",
      enonce:`I. Trouve l'intrus parmi les termes suivants puis justifie ton choix :
1. Drépanocytose - tuberculose - albinisme - hémophilie
2. Bacille tétanique - plasmodium - levure de bière - gonocoque
3. Sachets plastiques - poussières - bouteilles - gaz d'échappement
4. Progestérone - amylase salivaire - testostérone - œstrogènes

II. Associe chaque élément de la colonne A à son correspondant de la colonne B :
Colonne A : 1. Espèce humaine — 2. Couleur de la peau — 3. Réabsorption tubulaire — 4. Scissiparité — 5. Vaccin — 6. Allaitement maternel — 7. Manganèse — 8. Modification de l'ADN
Colonne B : a. Prévention du cancer du sein — b. Bassin des Voltas — c. 23 paires de chromosomes — d. Une étape de la production de l'urine — e. Caractère transmis des ascendants aux descendants — f. Apparition des maladies héréditaires — g. Reproduction asexuée — h. Stimule la production d'anticorps par l'organisme

III. Sans recopier le texte, trouve les mots ou expressions correspondants aux chiffres :
« Le Togo est parcouru par quatre principales formations ...1... La plus jeune de ces formations est le ...2... contenant des minerais comme le ...3... qui est utilisé en industrie pour la fabrication du ciment. La plus vieille formation est le ...4... contenant le ...5... qui est une roche magmatique caractéristique de cette formation. Le ...6... est une formation sédimentaire qui présente deux supergroupes séparés par une couche de tillites : le supergroupe infratillitique et le supergroupe ...7... Entre les deux formations sédimentaires se trouve ...8... qui est une formation géologique caractérisée par une chaîne de montagnes qui traverse le pays en bandoulière. »`,
      consignes:[
        {
          q:"Corrigé — I. Intrus",
          r:`1. Tuberculose — c'est une maladie infectieuse (microbienne), alors que les trois autres (drépanocytose, albinisme, hémophilie) sont des maladies héréditaires.
2. Levure de bière — c'est un microbe non pathogène (utile), alors que les trois autres sont pathogènes.
3. Gaz d'échappement — c'est un polluant gazeux, alors que les trois autres sont des déchets solides.
4. Amylase salivaire — c'est une enzyme digestive, alors que les trois autres sont des hormones sexuelles.`
        },
        {
          q:"Corrigé — II. Association",
          r:`1-c · 2-e · 3-d · 4-g · 5-h · 6-a · 7-b · 8-f`
        },
        {
          q:"Corrigé — III. Texte à trous (géologie du Togo)",
          r:`1. géologiques — 2. bassin sédimentaire côtier — 3. calcaire — 4. Dahoméyen — 5. granite — 6. Voltaïen — 7. supratillitique — 8. la chaîne de l'Atacora (l'Atacorien).`
        }
      ]
    },
    {
      titre:"Exercice 3",
      points:"6 pts",
      enonce:`1. Fais le schéma annoté de la coupe transversale dans la moelle épinière en place dans le canal rachidien. (2,5 pts)

2. Kodjo et Afiwa sont deux camarades de classe ; Kodjo voit mal les objets éloignés tandis qu'Afiwa voit mal les objets rapprochés.
2.1 De quelle anomalie de l'œil souffre chacun d'eux ?
2.2 Propose une correction pour chaque anomalie.

3.1 Qu'appelle-t-on contraception ?
3.2 Cite trois méthodes contraceptives.
3.3 Énumère quatre intérêts de la contraception.

4. Qu'appelle-t-on sérovaccination ? Quel est l'intérêt de cette méthode ?`,
      consignes:[
        {
          q:"Corrigé — 1 (schéma)",
          r:`Schéma à réaliser : coupe transversale de la moelle épinière dans le canal rachidien, en indiquant vertèbre, méninges, substance grise (en forme de papillon, au centre) et substance blanche (en périphérie), racines nerveuses dorsale et ventrale.`
        },
        {
          q:"Corrigé — 2",
          r:`2.1 Kodjo (voit mal de loin) : myopie. Afiwa (voit mal de près) : hypermétropie.
2.2 Myopie → verres divergents (biconcaves). Hypermétropie → verres convergents (biconvexes).`
        },
        {
          q:"Corrigé — 3",
          r:`3.1 Contraception : ensemble des méthodes réversibles permettant d'éviter une grossesse non désirée, en empêchant la fécondation ou la nidation.
3.2 Trois méthodes : la pilule contraceptive, le préservatif, le stérilet (DIU).
3.3 Quatre intérêts : espacer les naissances, prévenir les grossesses précoces/non désirées, protéger la santé de la mère, permettre la poursuite de la scolarité des jeunes filles.`
        },
        {
          q:"Corrigé — 4",
          r:`Sérovaccination : association d'une sérothérapie (injection de sérum contenant des anticorps déjà formés, protection immédiate) et d'une vaccination (injection d'antigènes atténués, protection durable), pratiquées simultanément.
Intérêt : elle assure une double protection, immédiate et durable — utile par exemple après une blessure à risque de tétanos.`
        }
      ]
    }
  ]
},
{
  id:"svt-bepc-blanc-tsevie-2026",
  matiere:"SVT", examen:"BEPC Blanc", annee:2026, session:"Février — DRE Maritime, IESG-Tsévié",
  duree:"2H", coef:"2",
  exercices:[
    {
      titre:"Exercice 1 — Situation d'évaluation",
      points:"8 pts",
      enonce:`Au cours d'une émission sur l'Homme et sa santé, un médecin donne la liste des microbes que voici : bacille de Koch, nitrobacter, gonocoque, vibrion de choléra, levure de bière, VIH, penicillium notatum, plasmodium. Il affirme qu'il y a dans cette liste des microbes pathogènes et non pathogènes ; il ajoute que la liste en question comporte un microbe parasite responsable d'une maladie endémique qui menace les régions intertropicales.`,
      consignes:[
        {
          q:"Consigne 1 : Identifie les microbes pathogènes et non pathogènes de la liste tout en donnant le rôle de chacun de ces microbes.",
          r:`Pathogènes : bacille de Koch (tuberculose) ; gonocoque (blennorragie) ; vibrion cholérique (choléra) ; VIH (SIDA) ; plasmodium (paludisme).
Non pathogènes : nitrobacter (nitrification du sol, utile à l'agriculture) ; levure de bière (fermentation : pain, bière) ; penicillium notatum (production de pénicilline, antibiotique).`
        },
        {
          q:"Consigne 2 : Nomme la maladie parasitaire dont parle le texte, ses manifestations puis les mesures de prévention contre cette maladie.",
          r:`Maladie : le paludisme, causé par le plasmodium et transmis par la piqûre d'un anophèle femelle infecté.
Manifestations : fièvre, frissons, maux de tête, courbatures, parfois vomissements et anémie.
Prévention : dormir sous moustiquaire imprégnée, assainir l'environnement (éliminer les eaux stagnantes), utiliser des répulsifs, consulter rapidement dès les premiers symptômes.`
        }
      ]
    },
    {
      titre:"Exercice 2 — Questions objectives",
      points:"6 pts",
      enonce:`I. Complète le texte en utilisant uniquement les chiffres accompagnés des réponses justes :
« Au cours de la digestion des aliments, l'amidon cuit est transformé dans la bouche en …1… par l'…2… Dans l'estomac, les protides sont transformés en …3… par les enzymes du suc …4… À la fin de la digestion gastrique, on obtient une bouillie acidulée appelée le …5… qui passe dans l'…6… Les produits finis de la digestion, encore appelés les …7…, passent dans le sang : c'est l'…8… »

II. QCM : 1. Le calcaire est exploité à : A. Notsè B. Lomé C. Tabligbo D. Hahotoe
2. La morphine et l'opium sont : A. Des drogues illicites B. Des drogues silices C. Des médicaments D. Des drogues licites
3. L'apprentissage de l'écriture, de la natation sont une finalité des réflexes : A. Innés B. Conditionnels C. Automatiques
4. On corrige la myopie avec des verres : A. Convergents B. Biconcaves C. Spéciaux D. Divergents
5. Le vaccin amène l'organisme à produire : A. Des leucocytes B. Des anticorps C. Des hématies D. Des plaquettes sanguines
6. Le groupe sanguin A+ peut recevoir le sang du groupe sanguin : A. AB+ B. B+ C. O+

III. Constitue des groupes avec les mots suivants et attribue un nom à chaque groupe :
Pie-mère ; choroïde ; sensibilité ; veines ; rétine ; sclérotique ; dure-mère ; protection ; production de vitamine D ; artères ; arachnoïde ; capillaires sanguins ; régulation thermique.

IV. Vrai ou Faux :
1. Pratiquer l'antisepsie consiste à stériliser les matériels chirurgicaux afin d'empêcher la contamination.
2. La peau est un organe de défense artificielle contre les microbes.`,
      consignes:[
        {
          q:"Corrigé — I. Texte à trous",
          r:`1. maltose — 2. amylase salivaire (ptyaline) — 3. peptides — 4. gastrique (pepsine) — 5. chyme — 6. intestin grêle — 7. nutriments — 8. absorption.`
        },
        {
          q:"Corrigé — II. QCM",
          r:`1-C (Tabligbo) · 2-A (drogues illicites) · 3-B (conditionnels) · 4-D (divergents) · 5-B (anticorps) · 6-C (O+).`
        },
        {
          q:"Corrigé — III. Classement",
          r:`Méninges : pie-mère, arachnoïde, dure-mère.
Tuniques de l'œil : sclérotique, choroïde, rétine.
Peau (structures et fonctions) : sensibilité, protection, production de vitamine D, régulation thermique, veines, artères, capillaires sanguins.`
        },
        {
          q:"Corrigé — IV. Vrai/Faux",
          r:`1. Faux — c'est l'asepsie (stérilisation du matériel), et non l'antisepsie (destruction des microbes sur une plaie).

        }
      ]
    },
    {
      titre:"Exercice 3 — Questions traditionnelles",
      points:"6 pts",
      enonce:`1. Qu'appelle-t-on immunité ? Dépigmentation ?
2. Donne la composition du chyle.
3. Énumère les phases d'une révolution cardiaque en précisant les caractéristiques de chaque phase.
4. Réalise le schéma annoté de la double circulation.`,
      consignes:[
        {
          q:"Corrigé",
          r:`1. Immunité : capacité de l'organisme à résister aux agents pathogènes. Dépigmentation : pratique consistant à éclaircir la peau en réduisant la mélanine, souvent par des produits chimiques — pratique risquée pour la santé cutanée.
2. Chyle : lymphe blanchâtre riche en lipides absorbés au niveau de l'intestin grêle, contenant aussi de l'eau, des sels minéraux et des globules blancs.
3. Révolution cardiaque : systole auriculaire (contraction des oreillettes) → systole ventriculaire (contraction des ventricules, éjection du sang) → diastole générale (relâchement, remplissage du cœur).
4. Schéma : petite circulation (cœur droit → poumons → cœur gauche) et grande circulation (cœur gauche → organes → cœur droit) — à réaliser sous forme de schéma annoté.`
        }
      ]
    }
  ]
},
{

        {

          <p style="font-size:13px;margin-top:8px;">a. Donne deux fonctions du rein. b. Cette personne est-elle malade ou en bonne santé ? c. Quel peut être l'organe défaillant si la personne est malade ? d. De quelle maladie peut-il s'agir ? e. Donne deux conseils pratiques à cette personne.</p>
          <p style="font-size:13px;margin-top:10px;">9. a. Par quelle fonction biologique l'espèce humaine assure-t-elle sa pérennité ? b. Cite deux rôles que jouent les glandes génitales mâles. c. Qu'est-ce que la nidation et à quel niveau de l'organe génital de la femme se déroule-t-elle ? d. Donne deux inconvénients d'une grossesse précoce chez une élève.</p>`

        },

e. Conseils : suivi médical/glycémique, alimentation pauvre en sucres rapides, activité physique régulière.`

        }

{
  id:"svt-bepc-septembre-2020",
  matiere:"SVT", examen:"BEPC", annee:2020, session:"Septembre",

  exercices:[
    {
      titre:"Partie A",
      points:"8 pts",
      enonce:`1. Reproduis le schéma annoté de l'appareil digestif de l'Homme. (4 pts)
2. Reproduis et annote le schéma de l'articulation mobile de la hanche ou du coude de l'Homme. (4 pts)`,
      consignes:[
        { q:"Corrigé", r:`Schémas à réaliser : appareil digestif complet (bouche, œsophage, estomac, intestin grêle, gros intestin, glandes annexes) ; articulation mobile (os, cartilage articulaire, ligaments, capsule articulaire, liquide synovial).` }
      ]
    },
    {
      titre:"Partie B",
      points:"12 pts",
      enonce:`3. a) Localise les différents tissus de la peau dans les différentes couches. (1,5 pt)
b) On nourrit trois lots de rats avec des rations alimentaires différentes. Les rats des lots N1 et N2 grandissent normalement, ceux du lot N3 ne grandissent pas. L'analyse de la ration du lot N3 montre l'absence d'une vitamine donnée. De quelle vitamine s'agit-il ? Sur quelles structures de l'os cette vitamine agit-elle pour favoriser la croissance du rat ? (1 pt)

4. Cite trois différents rôles des reins et trois différents rôles de la peau. (3 pts)

5. La combinaison entre l'hémoglobine et les gaz respiratoires.
a) Quel nom donne-t-on à la forme combinée de l'hémoglobine et du dioxygène ? à la forme combinée de l'hémoglobine et du dioxyde de carbone ? (1 pt)
b) Cite le lieu où a lieu chacune de ces combinaisons. (1 pt)
c) À quels niveaux de l'organisme se dissocient-elles ? (1 pt)

6. Un patient présente : amaigrissement, diarrhée chronique, fièvre persistante. L'analyse au laboratoire révèle une sérologie positive au VIH.
a) De quelle maladie souffre le patient ? (0,5 pt)
b) Quel est le nom de l'agent pathogène de cette maladie ? (0,5 pt)
c) Cite deux mesures pratiques qu'on peut prendre pour éviter cette maladie. (1 pt)

7. Cite et précise les caractéristiques des différents types d'hémorragie externe. (1,5 pt)`,
      consignes:[
        { q:"Corrigé — 3", r:`a. Épiderme : tissu épithélial (kératinocytes, mélanocytes). Derme : tissu conjonctif (vaisseaux sanguins, terminaisons nerveuses, follicules pileux, glandes). Hypoderme : tissu adipeux.
b. Vitamine D. Elle agit sur les structures osseuses en favorisant la fixation du calcium et la minéralisation, au niveau du cartilage de croissance des os longs.` },
        { q:"Corrigé — 4", r:`Reins : épuration du sang (élimination des déchets comme l'urée), régulation de la composition du sang (eau, sels minéraux), maintien de l'équilibre du milieu intérieur.
Peau : protection contre les agressions/microbes, régulation thermique, organe de sensibilité (tactile).` },
        { q:"Corrigé — 5", r:`a. Hémoglobine + O2 = oxyhémoglobine. Hémoglobine + CO2 = carbaminohémoglobine.
b. L'oxyhémoglobine se forme au niveau des poumons ; la carbaminohémoglobine se forme au niveau des tissus/organes.
c. Elles se dissocient en sens inverse : l'oxyhémoglobine se dissocie au niveau des tissus (libère l'O2) ; la carbaminohémoglobine se dissocie au niveau des poumons (libère le CO2).` },
        { q:"Corrigé — 6", r:`a. Le SIDA. b. Le VIH (virus de l'immunodéficience humaine). c. Utiliser un préservatif lors des rapports sexuels ; éviter le partage d'objets tranchants/seringues.` },
        { q:"Corrigé — 7", r:`Hémorragie artérielle : sang rouge vif, giclant par saccades (au rythme des battements cardiaques).
Hémorragie veineuse : sang rouge sombre, s'écoulant en nappe continue.
Hémorragie capillaire : saignement léger et diffus, le sang suinte.` }
      ]
    }
  ]
},
{
  id:"svt-bepc-juin-2019",
  matiere:"SVT", examen:"BEPC", annee:2019, session:"Juin",

  exercices:[
    {
      titre:"Partie A",
      points:"8 pts",
      enonce:`1. Reproduis et annote le schéma de l'arc réflexe simple ; indique le sens de l'influx nerveux. (4 pts)
2. Reproduis et annote le schéma d'une articulation mobile de ton choix. (4 pts)`,
      consignes:[
        { q:"Corrigé", r:`Schémas à réaliser : arc réflexe simple (récepteur, nerf sensitif, centre nerveux/moelle, nerf moteur, effecteur — flèche indiquant le sens de l'influx du récepteur vers l'effecteur) ; articulation mobile au choix.` }

    },
    {
      titre:"Partie B",
      points:"12 pts",
      enonce:`3. a) Donne la différence de structure entre un os long de veau et un os long de bœuf, en précisant son rôle. (1 pt)
b) Voici des mots relatifs à la digestion : bol alimentaire, chyme stomacal, déglutition. Dis à quel niveau de l'appareil digestif se passe chaque phénomène. (1,5 pt)

5. Voici une liste de microbes : plasmodium falciparum, levure de bière, amibe dysentérique, penicillium notatum.
a) Cite les microbes pathogènes de la liste en précisant les maladies que chacun provoque. (1,5 pt)

6. Les centres nerveux sont protégés par des enveloppes.

      consignes:[
        { q:"Corrigé — 3", r:`a. L'os de veau (jeune) présente un cartilage de conjugaison entre épiphyse et diaphyse, car il est en croissance ; l'os de bœuf (adulte) n'en a plus, la croissance est achevée. Rôle : le cartilage de conjugaison permet la croissance en longueur de l'os.

        { q:"Corrigé — 6", r:`a. Les méninges. b. La méningite. c. L'encéphale (cerveau) et la moelle épinière.` },
        { q:"Corrigé — 7", r:`a. L'accommodation. b. Le cristallin (qui change de courbure).` },
        { q:"Corrigé — 8", r:`a. Dans les trompes utérines (trompes de Fallope). b. Le spermatozoïde et l'ovule. c. Testicules (spermatozoïdes) et ovaires (ovules).` }

{
  id:"pct-bepc-2026-normale",
  matiere:"Physique-Chimie", examen:"BEPC", annee:2026, session:"Session normale",
  duree:"2H",
  exercices:[
    {
      titre:"Exercice 1",
      points:"8 pts",
      enonce:`Situation A
Un élève en classe de troisième rend visite à son père, technicien en électronique, dans son atelier un samedi. Ce dernier répare une télévision dont la panne est liée à la défaillance d'un conducteur ohmique de résistance R = 24 Ω. Ne disposant pas d'un conducteur ohmique de cette valeur, il décide de le remplacer en associant deux conducteurs ohmiques de résistances R1 et R2.
R1 porte les couleurs jaune – rouge – noir et R2 les couleurs vert – bleu – noir.
L'élève souhaite déterminer le type d'association permettant d'obtenir une résistance équivalente égale à 24 Ω.
Étant camarade de cet élève, détermine la valeur de R1 et R2, puis le type d'association adaptée, schéma à l'appui.

Table des couleurs : Noir=0, Marron=1, Rouge=2, Orange=3, Jaune=4, Vert=5, Bleu=6, Violet=7, Gris=8, Blanc=9.

Situation B
Ton oncle souhaite éclairer l'enclos de ses volailles à l'aide d'une lampe fonctionnant à l'énergie solaire. Il achète un kit composé de panneaux solaires, de fils conducteurs, d'un accumulateur (batterie) et d'une lampe. Il te fait appel pour l'installation. À la fin, il t'avoue qu'il ne comprend pas comment ces différents éléments permettent d'obtenir de la lumière.
Explique à ton oncle le fonctionnement de ce dispositif installé.`,
      consignes:[
        {
          q:"Corrigé — Situation A",
          r:`Lecture du code des couleurs : R1 (jaune-rouge-noir) = 4, 2, ×10⁰ = 42 Ω. R2 (vert-bleu-noir) = 5, 6, ×10⁰ = 56 Ω.
En série : R1+R2 = 98 Ω (≠ 24 Ω). En parallèle : Réq = (R1×R2)/(R1+R2) = (42×56)/98 = 24 Ω ✓
Il faut donc associer R1 et R2 en parallèle (en dérivation), les deux résistances branchées entre les deux mêmes points du circuit (schéma : deux branches parallèles entre les bornes A et B).`
        },
        {
          q:"Corrigé — Situation B",
          r:`Le panneau solaire capte la lumière du soleil et la convertit en énergie électrique (effet photovoltaïque). Cette énergie est transportée par les fils conducteurs jusqu'à l'accumulateur (batterie), qui la stocke sous forme d'énergie chimique. Lorsque la lampe est allumée, la batterie restitue cette énergie sous forme électrique, que la lampe convertit en lumière. Ainsi, le panneau recharge la batterie le jour, et la batterie alimente la lampe même la nuit, en l'absence de soleil.`
        }
      ]
    },
    {
      titre:"Exercice 2",
      points:"6 pts",

/* ---------------------------------------------------------
   ROUTAGE simple : matière -> année/sujet -> détail
--------------------------------------------------------- */
const app = document.getElementById('app');
let state = { view:'matieres', matiere:null, sujetId:null };

const MATIERES_TOUTES = ["SVT","Mathématiques","Français","Physique-Chimie","Anglais","Histoire-Géo"];

function render(){
  app.innerHTML = '';
  if(state.view === 'matieres') renderMatieres();
  else if(state.view === 'sujets') renderSujets();
  else if(state.view === 'detail') renderDetail();
  window.scrollTo(0,0);
}

function renderMatieres(){
  const wrap = document.createElement('div');
  const h = document.createElement('h2');
  h.className='section-title';
  h.textContent='Choisis une matière';
  wrap.appendChild(h);

  const tags = document.createElement('div');
  tags.className='tags';
  MATIERES_TOUTES.forEach(m=>{
    const count = SUJETS.filter(s=>s.matiere===m).length;
    const t = document.createElement('div');
    t.textContent = m + (count? '' : '');
    t.className = 'tag' + (count===0 ? ' disabled' : '');
    if(count>0){
      const c = document.createElement('span');
      c.className='count';
      c.textContent = ' · '+count;
      t.appendChild(c);
      t.onclick = ()=>{ state.view='sujets'; state.matiere=m; render(); };
    }
    tags.appendChild(t);
  });
  wrap.appendChild(tags);

  const note = document.createElement('p');
  note.className='empty-note';
  note.textContent = 'Les autres matières arrivent au fur et à mesure — bibliothèque en construction.';
  wrap.appendChild(note);

  app.appendChild(wrap);
}

function renderSujets(){
  const crumbs = document.createElement('div');
  crumbs.className='crumbs';
  const back = document.createElement('button');
  back.textContent='← Matières';
  back.onclick = ()=>{ state.view='matieres'; render(); };
  crumbs.appendChild(back);
  crumbs.append(' / ' + state.matiere);
  app.appendChild(crumbs);

  const h = document.createElement('h2');
  h.className='section-title';
  h.textContent = state.matiere + ' — sujets disponibles';
  app.appendChild(h);

  const list = SUJETS.filter(s=>s.matiere===state.matiere)
                      .sort((a,b)=>b.annee-a.annee);

  list.forEach(s=>{
    const card = document.createElement('div');
    card.className='sujet-card';
    card.onclick = ()=>{ state.view='detail'; state.sujetId=s.id; render(); };
    const titre = document.createElement('div');
    titre.className='titre';
    titre.textContent = `${s.examen} ${s.annee}`;
    const meta = document.createElement('div');
    meta.className='meta';
    meta.textContent = `${s.session}${s.duree? ' · '+s.duree:''}`;
    const badge = document.createElement('div');
    badge.className='badge-corrige';
    badge.textContent='corrigé';
    card.appendChild(badge);
    card.appendChild(titre);
    card.appendChild(meta);
    list.length && app.appendChild(card);
  });

  if(list.length===0){
    const note = document.createElement('p');
    note.className='empty-note';
    note.textContent='Aucun sujet pour le moment dans cette matière.';
    app.appendChild(note);
  }
}

function renderDetail(){
  const sujet = SUJETS.find(s=>s.id===state.sujetId);
  if(!sujet){ state.view='matieres'; render(); return; }

  const back = document.createElement('button');
  back.className='back-fab';
  back.textContent='← Retour aux sujets';
  back.onclick = ()=>{ state.view='sujets'; render(); };
  app.appendChild(back);

  const head = document.createElement('div');
  head.className='sujet-header';
  head.innerHTML = `<div class="examtitle">${sujet.examen} ${sujet.annee}</div>
    <table>
      <tr><td>Matière</td><td>: ${sujet.matiere}</td><td>Durée</td><td>: ${sujet.duree||'—'}</td></tr>
      <tr><td>Session</td><td>: ${sujet.session}</td><td>Coef</td><td>: ${sujet.coef||'—'}</td></tr>
    </table>`;
  app.appendChild(head);

  sujet.exercices.forEach((ex,exi)=>{
    const box = document.createElement('div');
    box.className='exercice';
    let html = `<h3>${ex.titre}${ex.points? ' ('+ex.points+')':''}</h3>`;
    html += `<div class="enonce">${escapeHtml(ex.enonce)}</div>`;
    box.innerHTML = html;

    if(ex.documents){
      ex.documents.forEach(doc=>{
        const d = document.createElement('div');
        let dh = `<p style="font-family:'Courier New',monospace;font-size:12.5px;margin:14px 0 4px;font-weight:700;">${doc.titre}</p>`;
        if(doc.intro) dh += `<div class="enonce" style="font-size:14px;">${escapeHtml(doc.intro)}</div>`;
        dh += doc.html;
        d.innerHTML = dh;
        box.appendChild(d);
      });
    }

    ex.consignes.forEach((c,ci)=>{
      const cwrap = document.createElement('div');
      cwrap.className='consigne';
      const q = document.createElement('div');
      q.className='q';
      q.textContent = c.q;
      cwrap.appendChild(q);

      const btn = document.createElement('button');
      btn.className='reveal-btn';
      btn.textContent='✎ Voir le corrigé';
      const rid = `corrige-${exi}-${ci}`;
      const rdiv = document.createElement('div');
      rdiv.className='corrige';
      rdiv.id = rid;
      rdiv.innerHTML = `<span class="tick">✓</span> ${escapeHtml(c.r).replace(/\n/g,'<br>')}`;

      btn.onclick = ()=>{
        const shown = rdiv.classList.toggle('show');
        btn.textContent = shown ? '✎ Masquer le corrigé' : '✎ Voir le corrigé';
      };

      cwrap.appendChild(btn);
      cwrap.appendChild(rdiv);
      box.appendChild(cwrap);
    });

    app.appendChild(box);
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

render();

/* ---------------------------------------------------------
   OFFLINE : enregistrement du service worker + badge
--------------------------------------------------------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
function updateOfflineBadge(){
  const b = document.getElementById('offlineBadge');
  if(navigator.onLine){ b.classList.remove('show'); }
  else{ b.classList.add('show'); }
}
window.addEventListener('online', updateOfflineBadge);
window.addEventListener('offline', updateOfflineBadge);
updateOfflineBadge();
</script>
