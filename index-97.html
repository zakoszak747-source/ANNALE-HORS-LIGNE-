<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#22352A">
<title>Annales scolaires — AYH</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --paper:#EAE3D2;
    --paper-dark:#DCD3BC;
    --ink:#1C2B23;
    --board:#22352A;
    --board-dark:#16241C;
    --red:#A8332A;
    --red-dim:#c96a5f;
    --gold:#C8932A;
    --line:#c9bfa4;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:Georgia, 'Times New Roman', serif;
    min-height:100vh;
    padding-bottom:40px;
  }
  /* subtle paper texture via layered gradients */
  body{
    background-image:
      radial-gradient(circle at 15% 8%, rgba(0,0,0,0.025) 0, transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(0,0,0,0.025) 0, transparent 40%);
  }

  header.top{
    background:var(--board);
    color:var(--paper);
    padding:18px 16px 22px;
    position:relative;
    overflow:hidden;
    border-bottom:4px solid var(--gold);
  }
  header.top .eyebrow{
    font-family:'Courier New', monospace;
    letter-spacing:3px;
    font-size:11px;
    opacity:0.75;
    text-transform:uppercase;
  }
  header.top h1{
    margin:6px 0 2px;
    font-family:'Courier New', monospace;
    font-size:24px;
    letter-spacing:1px;
    font-weight:700;
  }
  header.top p.sub{
    margin:0;
    font-size:13px;
    opacity:0.85;
    font-style:italic;
  }
  .stamp{
    position:absolute;
    right:-14px; top:-14px;
    width:92px; height:92px;
    border:3px solid var(--gold);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    transform:rotate(14deg);
    opacity:0.85;
  }
  .stamp span{
    font-family:'Courier New', monospace;
    font-size:9px;
    letter-spacing:1px;
    text-align:center;
    color:var(--gold);
    line-height:1.3;
  }

  .offline-badge{
    position:fixed; top:8px; right:10px;
    font-size:10px; color:var(--paper);
    background:rgba(0,0,0,0.35);
    padding:3px 7px; border-radius:10px;
    display:none; z-index:50;
    font-family:'Courier New', monospace;
  }
  .offline-badge.show{display:block;}

  main{max-width:640px; margin:0 auto; padding:16px;}

  /* onglets de cycle (Secondaire 1 / Secondaire 2) — niveau supérieur, fixe */
  .class-tabs{
    display:flex;
    gap:0;
    border-bottom:2px solid var(--ink);
    margin-bottom:6px;
    position:sticky;
    top:0;
    background:var(--paper);
    z-index:10;
    padding-top:2px;
  }
  .class-tab{
    flex:1;
    text-align:center;
    font-family:'Courier New', monospace;
    font-weight:700;
    font-size:14px;
    padding:10px 4px;
    cursor:pointer;
    color:var(--ink);
    opacity:0.55;
    border-bottom:3px solid transparent;
    letter-spacing:0.5px;
  }
  .class-tab.active{
    opacity:1;
    color:var(--board);
    border-bottom:3px solid var(--red);
  }
  .class-tab.disabled{ opacity:0.3; cursor:default; }

  /* onglets de classe (6e/5e/4e/3e ou Seconde/Première/Terminale) —
     niveau secondaire, non fixe, style plus discret */
  .classe-tabs-sub{
    position:static;
    border-bottom:1px solid var(--line);
    margin-top:2px;
  }
  .classe-tabs-sub .class-tab{
    font-size:12.5px;
    padding:8px 4px;
    opacity:0.6;
  }
  .classe-tabs-sub .class-tab.active{
    opacity:1;
    border-bottom-width:2px;
  }

  /* puces de série (A4 / D / C) — même style que les puces matière */
  .serie-chip{ font-weight:700; }

  /* bande déroulante des matières */
  .matiere-band{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:4px 2px 12px;
    margin-bottom:4px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .matiere-band::-webkit-scrollbar{display:none;}
  .matiere-chip{
    flex:0 0 auto;
    white-space:nowrap;
    font-family:'Courier New', monospace;
    font-size:12.5px;
    padding:9px 13px;
    border:2px solid var(--ink);
    border-radius:16px;
    background:var(--paper-dark);
    cursor:pointer;
    letter-spacing:0.3px;
  }
  .matiere-chip.active{background:var(--board);color:var(--paper);border-color:var(--board);}
  .matiere-chip.disabled{opacity:0.35; cursor:default;}

  /* matiere tags (conservé pour compat) */
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .tag{
    font-family:'Courier New', monospace;
    font-size:13px;
    padding:10px 14px;
    border:2px solid var(--ink);
    border-radius:3px;
    background:var(--paper-dark);
    cursor:pointer;
    letter-spacing:0.5px;
  }
  .tag.active{background:var(--board);color:var(--paper);border-color:var(--board);}
  .tag.disabled{opacity:0.4; cursor:default;}
  .tag .count{opacity:0.6; font-size:11px;}

  section.block{margin-top:22px;}
  h2.section-title{
    font-family:'Courier New', monospace;
    font-size:13px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--ink);
    opacity:0.55;
    margin:0 4px 10px;
    border-bottom:1px solid var(--line);
    padding-bottom:6px;
  }

  /* sujet cards */
  .sujet-card{
    background:var(--paper-dark);
    border:1px solid var(--line);
    border-left:5px solid var(--board);
    border-radius:2px;
    padding:14px 16px;
    margin-bottom:12px;
    cursor:pointer;
    position:relative;
  }
  .sujet-card:active{transform:scale(0.99);}
  .sujet-card .titre{
    font-family:'Courier New', monospace;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.5px;
  }
  .sujet-card .meta{
    font-size:12.5px;
    color:var(--ink);
    opacity:0.65;
    margin-top:4px;
    font-style:italic;
  }
  .sujet-card .badge-corrige{
    position:absolute;top:12px;right:12px;
    font-family:'Courier New', monospace;
    font-size:10px;
    color:var(--red);
    border:1px solid var(--red);
    padding:2px 6px;
    border-radius:10px;
    transform:rotate(-6deg);
  }

  /* sujet detail */
  .sujet-header{
    background:var(--paper);
    border:1px solid var(--ink);
    padding:14px 16px;
    margin-bottom:16px;
  }
  .sujet-header table{width:100%;border-collapse:collapse;font-family:'Courier New',monospace;font-size:12px;}
  .sujet-header td{padding:3px 0;}
  .sujet-header .examtitle{font-weight:700;font-size:16px;margin-bottom:8px;font-family:'Courier New',monospace;}

  .exercice{
    background:#fff8ec;
    border:1px solid var(--line);
    padding:16px;
    margin-bottom:18px;
    border-radius:2px;
  }
  .exercice h3{
    margin:0 0 10px;
    font-family:'Courier New', monospace;
    font-size:14px;
    text-decoration:underline;
  }
  .exercice .enonce{white-space:pre-wrap;font-size:15px;line-height:1.55;}
  .exercice table.doc-table{
    width:100%;border-collapse:collapse;margin:12px 0;font-size:13px;
  }
  .exercice table.doc-table td, .exercice table.doc-table th{
    border:1px solid var(--ink);padding:6px 8px;text-align:left;vertical-align:top;
  }
  .exercice table.doc-table th{background:var(--paper-dark);}

  .consigne{margin-top:16px;}
  .consigne .q{font-weight:700;font-size:15px;line-height:1.5;}
  .reveal-btn{
    margin-top:8px;
    background:none;
    border:1.5px dashed var(--red);
    color:var(--red);
    font-family:'Courier New', monospace;
    font-size:12.5px;
    padding:7px 12px;
    border-radius:3px;
    cursor:pointer;
    letter-spacing:0.5px;
  }
  .reveal-btn:active{background:rgba(168,51,42,0.08);}
  .corrige{
    display:none;
    margin-top:10px;
    padding:12px 14px 12px 16px;
    border-left:3px dashed var(--red);
    color:var(--red);
    font-style:italic;
    font-size:14.5px;
    line-height:1.6;
    transform:rotate(-0.4deg);
    background:rgba(168,51,42,0.04);
  }
  .corrige.show{display:block;}
  .corrige .tick{color:var(--red); font-style:normal; font-weight:700;}

  .back-fab{
    display:inline-block;
    margin-bottom:10px;
    font-family:'Courier New', monospace;
    font-size:13px;
    color:var(--board);
    border:1.5px solid var(--board);
    padding:6px 12px;
    border-radius:3px;
    cursor:pointer;
    background:none;
  }

  .export-toolbar{
    display:flex;
    gap:8px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .export-btn{
    font-family:'Courier New', monospace;
    font-size:12.5px;
    color:var(--paper);
    background:var(--board);
    border:1.5px solid var(--board);
    padding:8px 12px;
    border-radius:3px;
    cursor:pointer;
    letter-spacing:0.3px;
  }
  .export-btn:active{ background:var(--board-dark); }

  footer.credit{
    text-align:center;
    font-family:'Courier New', monospace;
    font-size:10.5px;
    opacity:0.45;
    margin-top:36px;
  }

  .empty-note{
    font-style:italic;
    opacity:0.65;
    font-size:13.5px;
    padding:10px 4px;
  }
</style>
</head>

<main id="app"></main>

<script>
/* ---------------------------------------------------------
   DONNÉES — chaque sujet : matière / examen / année / exercices

const SUJETS = [
{
  id:"svt-bepc-2026-normale",
  cycle:"secondaire1", classe:"3e", serie:null, matiere:"SVT", examen:"BEPC", annee:2026, session:"Session normale",
  duree:"2H",
  exercices:[
    {
      titre:"Exercice 1",
      points:"8 pts",
      enonce:`Adjoa est une femme enceinte depuis deux mois. Elle vit avec sa belle-mère Mariam, son mari Kokou et sa nièce Solim âgée de 19 ans. Depuis quelques jours, elle a des nausées, des vomissements, des maux de tête, des troubles respiratoires (essoufflements, gêne respiratoire) et la fièvre ; elle se sent faible et manque d'énergie.

Ces symptômes ont été banalisés car étant considérés comme des manifestations de la grossesse. Mais suite à une aggravation de son état de santé une nuit, elle fut transportée d'urgence au Centre Hospitalier Régional (CHR). Le médecin après consultation demande les analyses suivantes : la goutte épaisse (G.E) et la Numération Formule Sanguine (NFS).

Les résultats de ces analyses sont consignés dans le document 1.`,
      documents:[
        {
          titre:"Document 1 : Analyses et Résultats",
          html:`<table class="doc-table"><tr><th>Analyses</th><th>Résultats</th></tr>
          <tr><td>Goutte Épaisse</td><td>Présence de nombreux plasmodiums (+++)</td></tr>
          <tr><td>NFS</td><td>Nombre très faible de globules rouges par rapport à la normale et très faible concentration d'hémoglobine par rapport à la normale.</td></tr></table>`
        },
        {
          titre:"Document 2 : Tests sanguins et résultats",
          intro:`Au regard des résultats, le médecin prescrit des médicaments à la femme enceinte et décide de lui faire une transfusion sanguine. Malheureusement, il y a une pénurie de sang à la banque de sang du CHR. Les membres de sa famille se portent volontaires pour lui donner du sang. Des prélèvements de sang sont faits sur Adjoa et les membres de sa famille pour déterminer lequel des membres pourrait donner du sang.`,
          html:`<table class="doc-table"><tr><th>Gouttes de sang</th><th>Anti-A</th><th>Anti-B</th><th>Anti-A et Anti-B</th><th>Anti-Rh</th></tr>
          <tr><td>Adjoa</td><td>Pas d'agglutination</td><td>Pas d'agglutination</td><td>Pas d'agglutination</td><td>Agglutination</td></tr>
          <tr><td>Solim</td><td>Agglutination</td><td>Pas d'agglutination</td><td>Agglutination</td><td>Agglutination</td></tr>
          <tr><td>Kokou</td><td>Agglutination</td><td>Agglutination</td><td>Agglutination</td><td>Pas d'agglutination</td></tr>
          <tr><td>Mariam</td><td>Pas d'agglutination</td><td>Pas d'agglutination</td><td>Pas d'agglutination</td><td>Pas d'agglutination</td></tr></table>`
        }
      ],
      consignes:[
        {
          q:"Consigne 1 : Établis le lien entre le résultat de la goutte épaisse et l'anémie, l'insuffisance respiratoire et le manque d'énergie observés chez Adjoa.",
          r:`La goutte épaisse révèle de nombreux plasmodiums : Adjoa est atteinte de paludisme. Le plasmodium se multiplie dans les globules rouges et les détruit (hémolyse), ce qui explique le nombre très faible de globules rouges et la faible concentration d'hémoglobine (anémie) constatés à la NFS. Or l'hémoglobine transporte l'oxygène : sa diminution réduit l'apport d'oxygène aux organes, d'où le manque d'énergie ; et l'organisme accélère la respiration pour compenser ce déficit, d'où les troubles respiratoires.`
        },
        {
          q:"Consigne 2 : Après avoir expliqué l'importance des tests réalisés au niveau du document 2, détermine par un raisonnement logique la personne qui pourra donner du sang à Adjoa.",
          r:`Ces tests permettent de déterminer le groupe sanguin (ABO) et le facteur Rhésus de chaque personne, afin d'éviter une agglutination dangereuse lors de la transfusion.
D'après le document 2 : Adjoa est du groupe O, Rh+ ; Solim est du groupe A, Rh+ ; Kokou est du groupe AB, Rh− ; Mariam est du groupe O, Rh−.
Adjoa (O) possède des anticorps anti-A et anti-B : elle ne peut recevoir que des globules rouges du groupe O. Solim (A) et Kokou (AB) sont donc incompatibles.
Mariam (O−) est compatible : le groupe O est donneur universel, et un donneur Rh− convient à un receveur Rh+.
C'est donc Mariam qui peut donner son sang à Adjoa.`
        }
      ]
    },
    {
      titre:"Exercice 2",
      points:"6 pts",
      enonce:`I. Trouve l'intrus parmi les termes suivants puis justifie ton choix :
1. Drépanocytose - tuberculose - albinisme - hémophilie
2. Bacille tétanique - plasmodium - levure de bière - gonocoque
3. Sachets plastiques - poussières - bouteilles - gaz d'échappement
4. Progestérone - amylase salivaire - testostérone - œstrogènes

II. Associe chaque élément de la colonne A à son correspondant de la colonne B :
Colonne A : 1. Espèce humaine — 2. Couleur de la peau — 3. Réabsorption tubulaire — 4. Scissiparité — 5. Vaccin — 6. Allaitement maternel — 7. Manganèse — 8. Modification de l'ADN
Colonne B : a. Prévention du cancer du sein — b. Bassin des Voltas — c. 23 paires de chromosomes — d. Une étape de la production de l'urine — e. Caractère transmis des ascendants aux descendants — f. Apparition des maladies héréditaires — g. Reproduction asexuée — h. Stimule la production d'anticorps par l'organisme

III. Sans recopier le texte, trouve les mots ou expressions correspondants aux chiffres :
« Le Togo est parcouru par quatre principales formations ...1... La plus jeune de ces formations est le ...2... contenant des minerais comme le ...3... qui est utilisé en industrie pour la fabrication du ciment. La plus vieille formation est le ...4... contenant le ...5... qui est une roche magmatique caractéristique de cette formation. Le ...6... est une formation sédimentaire qui présente deux supergroupes séparés par une couche de tillites : le supergroupe infratillitique et le supergroupe ...7... Entre les deux formations sédimentaires se trouve ...8... qui est une formation géologique caractérisée par une chaîne de montagnes qui traverse le pays en bandoulière. »`,
      consignes:[
        {
          q:"Corrigé — I. Intrus",
          r:`1. Tuberculose — c'est une maladie infectieuse (microbienne), alors que les trois autres (drépanocytose, albinisme, hémophilie) sont des maladies héréditaires.
2. Levure de bière — c'est un microbe non pathogène (utile), alors que les trois autres sont pathogènes.
3. Gaz d'échappement — c'est un polluant gazeux, alors que les trois autres sont des déchets solides.
4. Amylase salivaire — c'est une enzyme digestive, alors que les trois autres sont des hormones sexuelles.`
        },
        {
          q:"Corrigé — II. Association",
          r:`1-c · 2-e · 3-d · 4-g · 5-h · 6-a · 7-b · 8-f`
        },
        {
          q:"Corrigé — III. Texte à trous (géologie du Togo)",
          r:`1. géologiques — 2. bassin sédimentaire côtier — 3. calcaire — 4. Dahoméyen — 5. granite — 6. Voltaïen — 7. supratillitique — 8. la chaîne de l'Atacora (l'Atacorien).`
        }
      ]
    },
    {
      titre:"Exercice 3",
      points:"6 pts",
      enonce:`1. Fais le schéma annoté de la coupe transversale dans la moelle épinière en place dans le canal rachidien. (2,5 pts)

2. Kodjo et Afiwa sont deux camarades de classe ; Kodjo voit mal les objets éloignés tandis qu'Afiwa voit mal les objets rapprochés.
2.1 De quelle anomalie de l'œil souffre chacun d'eux ?
2.2 Propose une correction pour chaque anomalie.

3.1 Qu'appelle-t-on contraception ?
3.2 Cite trois méthodes contraceptives.
3.3 Énumère quatre intérêts de la contraception.

4. Qu'appelle-t-on sérovaccination ? Quel est l'intérêt de cette méthode ?`,
      consignes:[
        {
          q:"Corrigé — 1 (schéma)",
          r:`Schéma à réaliser : coupe transversale de la moelle épinière dans le canal rachidien, en indiquant vertèbre, méninges, substance grise (en forme de papillon, au centre) et substance blanche (en périphérie), racines nerveuses dorsale et ventrale.`
        },
        {
          q:"Corrigé — 2",
          r:`2.1 Kodjo (voit mal de loin) : myopie. Afiwa (voit mal de près) : hypermétropie.
2.2 Myopie → verres divergents (biconcaves). Hypermétropie → verres convergents (biconvexes).`
        },
        {
          q:"Corrigé — 3",
          r:`3.1 Contraception : ensemble des méthodes réversibles permettant d'éviter une grossesse non désirée, en empêchant la fécondation ou la nidation.
3.2 Trois méthodes : la pilule contraceptive, le préservatif, le stérilet (DIU).
3.3 Quatre intérêts : espacer les naissances, prévenir les grossesses précoces/non désirées, protéger la santé de la mère, permettre la poursuite de la scolarité des jeunes filles.`
        },
        {
          q:"Corrigé — 4",
          r:`Sérovaccination : association d'une sérothérapie (injection de sérum contenant des anticorps déjà formés, protection immédiate) et d'une vaccination (injection d'antigènes atténués, protection durable), pratiquées simultanément.
Intérêt : elle assure une double protection, immédiate et durable — utile par exemple après une blessure à risque de tétanos.`
        }
      ]
    }
  ]
},
{
  id:"svt-bepc-blanc-tsevie-2026",

  duree:"2H", coef:"2",
  exercices:[
    {
      titre:"Exercice 1 — Situation d'évaluation",

      enonce:`Au cours d'une émission sur l'Homme et sa santé, un médecin donne la liste des microbes que voici : bacille de Koch, nitrobacter, gonocoque, vibrion de choléra, levure de bière, VIH, penicillium notatum, plasmodium. Il affirme qu'il y a dans cette liste des microbes pathogènes et non pathogènes ; il ajoute que la liste en question comporte un microbe parasite responsable d'une maladie endémique qui menace les régions intertropicales.`,

      enonce:`I. Complète le texte en utilisant uniquement les chiffres accompagnés des réponses justes :
« Au cours de la digestion des aliments, l'amidon cuit est transformé dans la bouche en …1… par l'…2… Dans l'estomac, les protides sont transformés en …3… par les enzymes du suc …4… À la fin de la digestion gastrique, on obtient une bouillie acidulée appelée le …5… qui passe dans l'…6… Les produits finis de la digestion, encore appelés les …7…, passent dans le sang : c'est l'…8… »

II. QCM : 1. Le calcaire est exploité à : A. Notsè B. Lomé C. Tabligbo D. Hahotoe
2. La morphine et l'opium sont : A. Des drogues illicites B. Des drogues silices C. Des médicaments D. Des drogues licites
3. L'apprentissage de l'écriture, de la natation sont une finalité des réflexes : A. Innés B. Conditionnels C. Automatiques
4. On corrige la myopie avec des verres : A. Convergents B. Biconcaves C. Spéciaux D. Divergents
5. Le vaccin amène l'organisme à produire : A. Des leucocytes B. Des anticorps C. Des hématies D. Des plaquettes sanguines
6. Le groupe sanguin A+ peut recevoir le sang du groupe sanguin : A. AB+ B. B+ C. O+

III. Constitue des groupes avec les mots suivants et attribue un nom à chaque groupe :
Pie-mère ; choroïde ; sensibilité ; veines ; rétine ; sclérotique ; dure-mère ; protection ; production de vitamine D ; artères ; arachnoïde ; capillaires sanguins ; régulation thermique.

IV. Vrai ou Faux :
1. Pratiquer l'antisepsie consiste à stériliser les matériels chirurgicaux afin d'empêcher la contamination.
2. La peau est un organe de défense artificielle contre les microbes.`,
      consignes:[
        {
          q:"Corrigé — I. Texte à trous",
          r:`1. maltose — 2. amylase salivaire (ptyaline) — 3. peptides — 4. gastrique (pepsine) — 5. chyme — 6. intestin grêle — 7. nutriments — 8. absorption.`
        },
        {
          q:"Corrigé — II. QCM",
          r:`1-C (Tabligbo) · 2-A (drogues illicites) · 3-B (conditionnels) · 4-D (divergents) · 5-B (anticorps) · 6-C (O+).`
        },
        {
          q:"Corrigé — III. Classement",
          r:`Méninges : pie-mère, arachnoïde, dure-mère.
Tuniques de l'œil : sclérotique, choroïde, rétine.
Peau (structures et fonctions) : sensibilité, protection, production de vitamine D, régulation thermique, veines, artères, capillaires sanguins.`
        },
        {
          q:"Corrigé — IV. Vrai/Faux",
          r:`1. Faux — c'est l'asepsie (stérilisation du matériel), et non l'antisepsie (destruction des microbes sur une plaie).
2. Faux — la peau est une barrière naturelle, pas artificielle.`
        }
      ]
    },
    {
      titre:"Exercice 3 — Questions traditionnelles",
      points:"6 pts",
      enonce:`1. Qu'appelle-t-on immunité ? Dépigmentation ?
2. Donne la composition du chyle.
3. Énumère les phases d'une révolution cardiaque en précisant les caractéristiques de chaque phase.
4. Réalise le schéma annoté de la double circulation.`,
      consignes:[
        {
          q:"Corrigé",
          r:`1. Immunité : capacité de l'organisme à résister aux agents pathogènes. Dépigmentation : pratique consistant à éclaircir la peau en réduisant la mélanine, souvent par des produits chimiques — pratique risquée pour la santé cutanée.
2. Chyle : lymphe blanchâtre riche en lipides absorbés au niveau de l'intestin grêle, contenant aussi de l'eau, des sels minéraux et des globules blancs.
3. Révolution cardiaque : systole auriculaire (contraction des oreillettes) → systole ventriculaire (contraction des ventricules, éjection du sang) → diastole générale (relâchement, remplissage du cœur).
4. Schéma : petite circulation (cœur droit → poumons → cœur gauche) et grande circulation (cœur gauche → organes → cœur droit) — à réaliser sous forme de schéma annoté.`
        }
      ]
    }
  ]
},

      consignes:[
        { q:"Corrigé — 3", r:`a. Épiderme : tissu épithélial (kératinocytes, mélanocytes). Derme : tissu conjonctif (vaisseaux sanguins, terminaisons nerveuses, follicules pileux, glandes). Hypoderme : tissu adipeux.

        { q:"Corrigé — 7", r:`Hémorragie artérielle : sang rouge vif, giclant par saccades (au rythme des battements cardiaques).

      enonce:`Situation A
Un élève en classe de troisième rend visite à son père, technicien en électronique, dans son atelier un samedi. Ce dernier répare une télévision dont la panne est liée à la défaillance d'un conducteur ohmique de résistance R = 24 Ω. Ne disposant pas d'un conducteur ohmique de cette valeur, il décide de le remplacer en associant deux conducteurs ohmiques de résistances R1 et R2.
R1 porte les couleurs jaune – rouge – noir et R2 les couleurs vert – bleu – noir.
L'élève souhaite déterminer le type d'association permettant d'obtenir une résistance équivalente égale à 24 Ω.
Étant camarade de cet élève, détermine la valeur de R1 et R2, puis le type d'association adaptée, schéma à l'appui.

Table des couleurs : Noir=0, Marron=1, Rouge=2, Orange=3, Jaune=4, Vert=5, Bleu=6, Violet=7, Gris=8, Blanc=9.

Situation B
Ton oncle souhaite éclairer l'enclos de ses volailles à l'aide d'une lampe fonctionnant à l'énergie solaire. Il achète un kit composé de panneaux solaires, de fils conducteurs, d'un accumulateur (batterie) et d'une lampe. Il te fait appel pour l'installation. À la fin, il t'avoue qu'il ne comprend pas comment ces différents éléments permettent d'obtenir de la lumière.
Explique à ton oncle le fonctionnement de ce dispositif installé.`,
      consignes:[
        {
          q:"Corrigé — Situation A",
          r:`Lecture du code des couleurs : R1 (jaune-rouge-noir) = 4, 2, ×10⁰ = 42 Ω. R2 (vert-bleu-noir) = 5, 6, ×10⁰ = 56 Ω.
En série : R1+R2 = 98 Ω (≠ 24 Ω). En parallèle : Réq = (R1×R2)/(R1+R2) = (42×56)/98 = 24 Ω ✓
Il faut donc associer R1 et R2 en parallèle (en dérivation), les deux résistances branchées entre les deux mêmes points du circuit (schéma : deux branches parallèles entre les bornes A et B).`
        },
        {
          q:"Corrigé — Situation B",
          r:`Le panneau solaire capte la lumière du soleil et la convertit en énergie électrique (effet photovoltaïque). Cette énergie est transportée par les fils conducteurs jusqu'à l'accumulateur (batterie), qui la stocke sous forme d'énergie chimique. Lorsque la lampe est allumée, la batterie restitue cette énergie sous forme électrique, que la lampe convertit en lumière. Ainsi, le panneau recharge la batterie le jour, et la batterie alimente la lampe même la nuit, en l'absence de soleil.`
        }

    {
      titre:"Exercice 2",
      points:"6 pts",
      enonce:`A. Choisis la bonne réponse.

3. Un fer à repasser soumis à une tension de 220 V est parcouru par un courant de 15 A. Quelle est l'énergie électrique consommée pendant 5 h de fonctionnement ? a- 16,5 kWh b- 165 kWh c- 16500 kWh
4. Quelle est l'équation bilan équilibrée de la réaction entre l'oxyde ferrique et l'aluminium ?
a- Fe2O3 + 2Fe → 3Al + Al2O3
b- Fe2O3 + 2Al → 2Fe + Al2O3
c- 2Fe + Al2O3 → Fe2O3 + 2Al

B. Réorganise les mots pour obtenir une phrase correcte :
1. vers 7. / solution acide, / dilue une / son pH / et tend / augmente / Lorsqu'on

« L'électrolyse de l'eau est la décomposition de l'eau en deux gaz. En effet, traversée par un courant __1__ dans un __2__, l'eau est décomposée en dihydrogène et en dioxygène. Le __3__ se dégage à la cathode tandis que le __4__ se dégage à l'anode. Le volume de gaz obtenu à la cathode est le __5__ de celui obtenu à l'anode. Lorsqu'un mélange de deux volumes de __6__ et d'un volume de __7__ est brûlé, il se forme de l'eau : c'est __8__ de l'eau. »`,

    {
      titre:"Exercice 3",
      points:"6 pts",
      enonce:`I. On décide de déterminer la formule brute de deux alcanes A et B. Le nombre d'atomes d'hydrogène de l'alcane A est 8 ; l'alcane B est composé de 8 atomes au total.
1. a. Détermine la formule brute et le nom de chacun des deux alcanes A et B. b. Écris la formule développée de chacun de ces alcanes.
2. On réalise la combustion complète de B. a. Écris l'équation correspondante. b. On a utilisé un volume de 8,75 m³ d'air pour brûler complètement le composé B. Détermine le volume de ce composé B ainsi que le volume de dioxyde de carbone produit.

II. 1. On verse quelques gouttes de phénolphtaléine dans une fraction de solution inconnue de pH = 12.
a. Définis le pH. b. Quelle est la couleur prise par la solution ?
2. On prélève 1 mL de cette solution puis on ajoute 999 mL d'eau distillée.
a. Comment varie le pH de cette solution après dilution ? b. Détermine le pH de la solution finale obtenue après l'ajout de l'eau distillée.

III. Un objet AB de 10 cm de hauteur est placé perpendiculairement sur l'axe optique, à 30 cm d'une lentille convergente de distance focale f = 20 cm.
1. Construis l'image A'B' de AB à l'échelle 1/5.
2. À quelle distance doit-on placer l'écran pour recueillir l'image de cet objet ?
3. Détermine la taille réelle de l'image A'B'.`,
      consignes:[
        {
          q:"Corrigé — I. Alcanes",
          r:`Alcane CnH2n+2. A : 2n+2=8 → n=3 → C3H8, le propane. B : n+(2n+2)=8 → n=2 → C2H6, l'éthane.
Formules développées : propane CH3–CH2–CH3 ; éthane CH3–CH3.
Combustion de B : 2C2H6 + 7O2 → 4CO2 + 6H2O.
Air = 8,75 m³, dont O2 = 8,75/5 = 1,75 m³. Rapport C2H6:O2 = 2:7 → V(B) = 1,75×2/7 = 0,5 m³. Rapport C2H6:CO2 = 1:2 → V(CO2) = 2×0,5 = 1 m³.`
        },
        {
          q:"Corrigé — II. pH",
          r:`a. Le pH mesure l'acidité ou la basicité d'une solution (échelle 0-14 ; <7 acide, =7 neutre, >7 basique).
b. Solution basique (pH=12) : la phénolphtaléine devient rose.
2a. Après dilution, le pH diminue et se rapproche de 7 (la solution reste basique).
2b. Dilution ×1000 : [OH⁻] passe de 10⁻² à 10⁻⁵ mol/L → pOH=5 → pH final = 14−5 = 9.`
        },
        {
          q:"Corrigé — III. Optique",
          r:`Formule des lentilles : 1/OA' = 1/f + 1/OA = 1/20 + 1/(−30) = 3/60 − 2/60 = 1/60 → OA' = 60 cm.
L'écran doit être placé à 60 cm de la lentille.
Grandissement γ = OA'/OA = 60/(−30) = −2 → A'B' = γ×AB = −2×10 = −20 cm.
Taille réelle de l'image : 20 cm, image réelle et inversée.`
        }
      ]
    }
  ]
},

Mesures préventives (4) : dormir sous moustiquaire imprégnée, assainir l'environnement (éliminer les eaux stagnantes), utiliser des répulsifs, prendre une chimioprophylaxie (personnes à risque : femmes enceintes, enfants).`

    {
      titre:"Exercice 1",
      points:"8 pts",
      enonce:`Suite au recensement général de la population effectué en 2022, les autorités de votre localité ont constaté une forte augmentation du taux de natalité alors que de nombreux jeunes sont confrontés au chômage et aux difficultés économiques.
Afin de sensibiliser la population sur la maîtrise des naissances et la santé reproductive, une équipe de professionnels de santé organise une campagne d'information dans votre établissement scolaire. Cette campagne porte sur le fonctionnement du cycle sexuel féminin, la détermination de la période fertile et les méthodes contraceptives permettant d'éviter les grossesses non désirées.
Au cours de cette séance, les documents 1 et 2 ont été présentés aux élèves : Document 1, le cycle sexuel féminin (28 jours) — développement des follicules, ovulation, formation puis régression du corps jaune ; Document 2, quelques méthodes contraceptives — préservatif masculin, préservatif féminin, pilule contraceptive, injection contraceptive, DIU (stérilet), implant contraceptif, diaphragme, méthode du calendrier.

      consignes:[

          q:"Consigne 1 : Explique le fonctionnement du cycle illustré par ces documents et détermine la période fertile de ta camarade.",
          r:`Fonctionnement : sous l'action des hormones, des follicules se développent dans l'ovaire ; l'un d'eux arrive à maturité et libère l'ovule (c'est l'ovulation, vers le milieu du cycle) ; le follicule rompu se transforme en corps jaune, qui sécrète des hormones préparant l'utérus à une éventuelle grossesse ; en l'absence de fécondation, le corps jaune régresse et un nouveau cycle commence avec les règles.
Calcul : pour un cycle de 28 jours, l'ovulation a lieu vers le 14e jour. Dernières règles le 15 avril → ovulation vers le 28 avril. En tenant compte de la durée de vie des gamètes (ovule ~24h, spermatozoïdes quelques jours), la période féconde se situe environ du 25 au 30 avril.`

    {

      points:"8 pts",
      enonce:`Ton petit frère ALIOU consomme un repas composé du riz mélangé au haricot, accompagné de la sauce d'arachide à la viande de poulet. Il va à la selle le lendemain matin. À sa grande surprise, il remarque des débris des graines du haricot dans ses selles. Il se pose alors des questions sur ce qui s'est passé avec les autres aliments qu'il avait consommés la veille. Il vient donc à toi.

        {
          q:"Corrigé — Consigne 1",
          r:`Les graines de haricot possèdent une enveloppe (tégument) riche en cellulose, une substance que l'organisme humain ne peut pas digérer (il ne possède pas d'enzyme capable de la dégrader) : ces débris ne sont donc ni digérés ni absorbés, et se retrouvent tels quels dans les selles.
Le riz, la viande et l'arachide, eux, sont des aliments composés digérés par les enzymes digestives : ils sont transformés en nutriments simples (glucose, acides aminés, acides gras) qui sont absorbés au niveau de l'intestin et passent dans le sang ou la lymphe — d'où leur « disparition » apparente.`
        },
        {
          q:"Corrigé — Consigne 2",
          r:`Haricot (riche en amidon et en protéines végétales) → glucose et acides aminés.
Viande de poulet (protides) → acides aminés.
Sauce d'arachide (90% lipides) → acides gras et glycérol.`
        }
      ]
    },

      titre:"Exercice 2",
      points:"6 pts",
      enonce:`I. Réponds par vrai ou faux en corrigeant les fausses affirmations :
1. Le nerf optique interprète et analyse l'image des objets.
2. La dépigmentation est souvent à l'origine du cancer de la peau.
3. Le cycle du développement du moustique se déroule chez deux hôtes.
4. L'assimilation des nutriments se fait au niveau des villosités intestinales.
5. Lors du passage des nutriments dans le sang, ils empruntent uniquement la voie sanguine.

II. Choisis la bonne réponse :
1. Les éléments figurés du sang sont : a) hématies, leucocytes, globulines b) hématies, leucocytes, fibrinogène c) hématies, leucocytes, plasma
2. Parmi les maladies suivantes, laquelle est liée au fonctionnement des vaisseaux sanguins ? a) COVID-19 b) artériosclérose c) drépanocytose

III. Remplace les chiffres par les mots manquants :
« Au cours de la circulation pulmonaire, le sang rouge sombre riche en ...a... quitte le ventricule ...b... , arrive aux poumons en passant par l'...c... . Dans les poumons, il se débarrasse du dioxyde de carbone et s'enrichit en ...d... avant de revenir rouge clair dans l'oreillette gauche par l'intermédiaire des ...e... »`,
      consignes:[
        {
          q:"Corrigé — I. Vrai/Faux",
          r:`1. Faux — c'est le cerveau (cortex visuel) qui interprète et analyse l'image ; le nerf optique se contente de transmettre l'influx nerveux.
2. Vrai.
3. Faux — c'est le plasmodium (agent du paludisme) qui a un cycle de développement se déroulant chez deux hôtes (l'homme et le moustique) ; le moustique lui-même se développe dans l'eau.
4. Faux — c'est l'absorption (et non l'assimilation) qui se fait au niveau des villosités intestinales ; l'assimilation se fait au niveau des cellules de l'organisme.
5. Faux — les lipides empruntent la voie lymphatique (vaisseaux chylifères), pas seulement la voie sanguine.`
        },
        {
          q:"Corrigé — II. QCM",
          r:`1. Ce QCM semble comporter une erreur : les éléments figurés du sang sont normalement les hématies, les leucocytes et les plaquettes — or aucune des trois options proposées ne cite les plaquettes (elles citent globulines, fibrinogène ou plasma, qui sont des composants du plasma, pas des éléments figurés). À vérifier avec le sujet original avant diffusion.
2. b) artériosclérose (maladie liée au durcissement/épaississement des artères).`
        },
        {
          q:"Corrigé — III. Texte à trous",
          r:`a. dioxyde de carbone — b. droit — c. artère pulmonaire — d. dioxygène — e. veines pulmonaires.`
        }
      ]

      enonce:`1. Fais le schéma annoté d'un arc réflexe. (2,5 pts)

3. Quelles sont les phases de la révolution cardiaque ? Que se passe-t-il à chaque phase ? (1,5 pt)
4. Cite les grands groupes de microbes. (1 pt)`,
      consignes:[
        { q:"Corrigé — 1 (schéma)", r:`Arc réflexe : récepteur, nerf sensitif, centre nerveux (moelle épinière), nerf moteur, effecteur.` },
        { q:"Corrigé — 2", r:`Enzyme : amylase salivaire (ptyaline). Produit obtenu : le maltose.` },
        { q:"Corrigé — 3", r:`Systole auriculaire (contraction des oreillettes, envoie le sang vers les ventricules) → systole ventriculaire (contraction des ventricules, éjection du sang vers l'aorte et l'artère pulmonaire) → diastole générale (relâchement complet, remplissage des cavités).` },

      titre:"Exercice 1 — Situation d'évaluation",

      enonce:`INOUSSA a l'habitude de participer à un jeu qu'il n'a jamais gagné. Cette fois-ci, il cherche tous les moyens d'y gagner. Le jeu consiste à mettre en mouvement une voiturette de masse m = 1280 g en appuyant sur la force correspondante, de telle sorte qu'elle ait une vitesse v qui lui permettrait d'avoir une énergie de 16 J à l'arrivée.
Le dispositif propose trois forces : F1 = 2,5 N ; F2 = 3,2 N ; F3 = 5,7 N. La piste est horizontale, sans frottement, de longueur L = 5 m.
Sachant que le travail est égal à l'énergie, trouve une solution à INOUSSA : quelle force doit-il utiliser et quelle sera la vitesse d'arrivée ?`,
      consignes:[
        {
          q:"Corrigé",
          r:`Forces agissant sur la voiturette au début du mouvement : le poids (vertical, vers le bas), la réaction normale du support (vertical, vers le haut, R=P puisque piste horizontale sans frottement) et la force motrice F (horizontale, dans le sens du mouvement).
Travail = Énergie : W = F×L = Ec = 16 J → F = 16/5 = 3,2 N. C'est donc la force F2 qu'il faut utiliser.
Vitesse d'arrivée : Ec = ½mv² → v² = 2×16/1,28 = 25 → v = 5 m/s.`

      ]

      titre:"Exercice 2",
      points:"6 pts",
      enonce:`A. Vrai ou faux :
1. La représentation d'un objet de 100 m de long à l'échelle 1/1000 est 10 cm.
2. En dessin technique, le plan est la projection orthogonale d'un objet.
3. Une solution aqueuse est une solution dont le solvant est l'alcool.
4. Une solution est électriquement neutre lorsqu'elle contient autant de cations que d'anions.

B. Choisis la bonne réponse :
1. Équation bilan : H2O + X → Al2O3 + Y. a) formules de X et Y : a1) Fe et H2 a2) Al et O2 a3) Al et H2. b) l'oxydant et le réducteur dans cet ordre : b1) X et H2O b2) Al2O3 et Y b3) H2O et X
2. En enflammant 8 cm³ de dihydrogène dans 3 cm³ de dioxygène, il restera : a) aucun gaz b) du dihydrogène c) du dioxygène
3. L'alcane dont le rapport entre son nombre d'atomes d'hydrogène et son nombre d'atomes de carbone est 2,5 est : a) le butane b) le propane c) le méthane

C. Complète : « En branchant un transformateur au secteur, on obtient une tension de sortie de 11V. La tension d'entrée vaut ---a---. Son rapport de transformation est k= ---b--- : il s'agit d'un transformateur ---c--- de tension. Ayant 1000 spires au secondaire, son nombre de spires au primaire est alors ---d---. »`,
      consignes:[
        { q:"Corrigé — A. Vrai/Faux", r:`1. Vrai (100m×1/1000 = 0,1m = 10cm). 2. Vrai. 3. Faux — le solvant d'une solution aqueuse est l'eau, pas l'alcool. 4. Vrai.` },
        {
          q:"Corrigé — B. QCM",
          r:`1. Réaction : 2Al + 3H2O → Al2O3 + 3H2 (aluminium + vapeur d'eau). a) réponse a3 (Al et H2). b) H2O est l'oxydant, Al le réducteur → réponse b3 (H2O et X).
2. Équation : 2H2 + O2 → 2H2O. Pour 3 cm³ d'O2, il faut 6 cm³ de H2 ; sur les 8 cm³ disponibles, il en reste 2 cm³ → réponse b) du dihydrogène.
3. Alcane CnH2n+2, rapport H/C = (2n+2)/n = 2,5 → n=4 → C4H10 → réponse a) le butane.`
        },
        { q:"Corrigé — C. Transformateur", r:`a. 220 V (tension secteur). b. k = 11/220 = 0,05. c. abaisseur. d. N1 = N2/k = 1000/0,05 = 20 000 spires.` }

    {
      titre:"Exercice 3",

      enonce:`Partie A : L'équation bilan de la combustion complète d'un hydrocarbure A de formule CxHy est : CxHy + a O2 → 4CO2 + 5H2O.

Partie B : Deux résistors R1 et R2 sont traversés par un même courant d'intensité I=0,5A et alimentés par un générateur de tension U=12V.
1. Comment sont montées R1 et R2 ? 2. Calcule la résistance équivalente. 3. Détermine R1 sachant que R2=10Ω.

Partie C : Pour déterminer la nature d'une solution S, on réalise deux tests. Test 1 : S + soude → précipité bleu. Test 2 : S + nitrate d'argent → précipité blanc qui noircit à la lumière.

      consignes:[
        {
          q:"Corrigé — Partie A",
          r:`D'après l'équation : x=4 (4CO2), y=10 (5H2O → 10 H) → A = C4H10, le butane.

Équilibrage de l'oxygène : 2a = 4×2+5×1 = 13 → a = 6,5.`
        },
        {
          q:"Corrigé — Partie B",
          r:`1. Même courant dans les deux résistors → montage en série.
2. Réq = U/I = 12/0,5 = 24 Ω.
3. Réq = R1+R2 → R1 = 24−10 = 14 Ω.`
        },
        {
          q:"Corrigé — Partie C",
          r:`Précipité bleu avec la soude → hydroxyde de cuivre Cu(OH)2 → présence d'ions cuivre Cu²⁺.
Précipité blanc noircissant à la lumière avec le nitrate d'argent → chlorure d'argent AgCl → présence d'ions chlorure Cl⁻. (Solution S = chlorure de cuivre II).
Équations : Cu²⁺ + 2OH⁻ → Cu(OH)2 ; Ag⁺ + Cl⁻ → AgCl.`
        }
      ]
    }

      enonce:`Le père de Nina dispose d'un terrain ABCD qu'il veut vendre à 50 000 F le dam². Il fait appel à un géomètre qui, arrivé sur les lieux, retrouve par GPS trois bornes A, B et C tels que : OA = 7OI + OJ ; BO = −8OI − 4OJ ; C(−1 ; 7). Il veut connaître la nature du terrain ABCD sachant que les 4 bornes A, B, C et D forment un parallélogramme. Nina, élève en classe de 3e, vous sollicite.

          r:`A(7 ; 1) (d'après OA = 7OI+OJ). B(8 ; 4) (d'après BO=−8OI−4OJ, donc O−B=(−8,−4) → B=(8,4)). C(−1 ; 7) donné.

    {

      enonce:`I. Vrai ou faux :

II. Choisis la bonne réponse :
1. √((2−√5)²) est égale à : a) −2+√5 b) 9−√5 c) +2−√5
2. L'équation (−2x+6)(x−7)=0 a pour solution : a) S={−7;−3} b) S={3;7} c) S={6;7}

B/ On considère R = [(x−5)(4x+7)] / [(3x+2)(x−5)]

      enonce:`Ton oncle Salifou vit à Lomé depuis 15 ans. Il constate que cette ville et ses environs reçoivent moins de pluies que Notsè, Tsévié et Agou. Il remarque aussi que plusieurs activités se développent autour des cours d'eau dans la zone et au-delà.
Consigne 1 : Relève les causes de cette faible pluviométrie enregistrée à Lomé. (4 pts)
Consigne 2 : Montre que les cours d'eau au Togo ont une importance dans l'économie. (4 pts)`,

        {

          r:`Lomé se situe dans une zone côtière soumise à l'effet du courant marin froid, qui refroidit l'air et limite la formation de nuages pluvieux. Contrairement à Agou (zone de relief), Lomé ne bénéficie pas de pluies orographiques faute de relief élevé. La végétation moins dense en zone côtière réduit aussi l'évapotranspiration locale.`
        },

          q:"Corrigé — Consigne 2",
          r:`Les cours d'eau permettent : l'irrigation des cultures (maraîchage, riziculture) ; la pêche (source de revenus et d'alimentation) ; la production d'hydroélectricité (ex. barrage de Nangbéto sur le Mono) ; l'approvisionnement en eau pour la consommation et l'élevage ; et, dans certaines zones, le transport fluvial.`

      enonce:`1. Vrai ou faux :

d. La pyramide des âges du Togo présente une base (large, rétrécie, effilée).
e. Éboulement et glissement de terrain sont des risques liés (à la végétation, au relief, au climat).

      enonce:`1. Définis : impérialisme, économie de traite. (1 pt)

4b. Sur une carte du Togo allemand, place les foyers de résistance des peuples.`,

          r:`1. Impérialisme : politique d'expansion et de domination d'un État puissant sur d'autres territoires/peuples, à des fins économiques et politiques. Économie de traite : système colonial basé sur l'exportation de matières premières brutes et l'importation de produits manufacturés, sans transformation locale.

      enonce:`À l'approche des élections, le Ministre de la sécurité annonce à la radio : « Les médias doivent jouer dans l'impartialité leur rôle pour consolider la démocratie dans notre pays le Togo. Alors, les médias, en fonction de leurs caractéristiques en démocratie, doivent jouer leur partition ». Ton oncle te sollicite pour mieux comprendre.

          r:`Caractéristiques des médias en démocratie : pluralisme (diversité des médias publics et privés), liberté de la presse (indépendance vis-à-vis du pouvoir), impartialité et objectivité dans le traitement de l'information, accessibilité au grand public, rôle de contre-pouvoir (surveillance de l'action publique).`

          r:`Rôles des médias contre l'extrémisme violent : sensibiliser et informer la population sur ses dangers, dénoncer les discours de haine et la propagande extrémiste, promouvoir la paix et le vivre-ensemble, relayer les messages de prévention des autorités.`

      titre:"Partie B — Questions objectives",
      points:"6 pts",
      enonce:`1. Vrai ou faux :

      enonce:`Texte : « LES ROUTES SANGLANTES DE L'EXIL » (extrait), Moïse O. INANDJO

1a. Relève dans le texte le nom et la profession du mari d'Aurélie.

    {
      titre:"Troisième partie — Production écrite",
      points:"8 pts",
      enonce:`Sujet 1 : Tu vis avec tes parents dans une ville du pays. Une situation qui ne favorisait pas la paix pour la famille vous oblige à quitter cette ville pour une autre. Raconte les faits en insistant sur la situation de départ, le départ lui-même et la situation finale.

          r:`Sujet 1 (récit) : structurer en trois temps — situation de départ (contexte, cause du conflit), le départ (déroulement, émotions, difficultés du trajet), situation finale (arrivée, adaptation à la nouvelle ville). Utiliser le passé (imparfait pour la description, passé simple/composé pour les actions).
Sujet 2 (texte argumentatif/expositif) : présenter plusieurs conséquences de la migration forcée — perte des repères, rupture familiale, difficultés économiques et scolaires, traumatismes psychologiques — en les illustrant d'exemples concrets liés à la situation d'Aurélie.
Il n'y a pas de « corrigé » unique pour une production écrite : l'évaluation porte sur la pertinence, la cohérence, la richesse de la langue et la correction grammaticale (critères PP/CL/CI/P donnés dans le sujet).`

    {

{
  id:"pct-bepc-blanc-golfe-2025",
  cycle:"secondaire1", classe:"3e", serie:null, matiere:"Physique-Chimie", examen:"BEPC Blanc", annee:2025, session:"IESG-Golfe — Zone Amadahomé",
  duree:"2H", coef:"3",
  exercices:[
    {
      titre:"Exercice 1",
      points:"8 pts",
      enonce:`Au cours d'une randonnée, un de tes camarades à vélo, dont la masse est estimée à 80 kg, parcourt la portion RFI. Il quitte le point R sans vitesse initiale (vR=0 m/s), passe le point F avec une vitesse vF=16 m/s, et arrive au point I au sommet d'une colline avec une vitesse vI=10 m/s.
Données : hauteur de R au-dessus de F, H=12,8 m. Hauteur de I au-dessus de F, h=7,8 m. (g=10 N/kg)
Il estime que son énergie mécanique n'a pas varié le long de son parcours. Vérifie son affirmation.`,
      consignes:[
        {
          q:"Corrigé",
          r:`En prenant F comme référence des altitudes (h=0), et en notant Em = énergie potentielle + énergie cinétique = mgh + ½mv² :
En R : Em = m×10×12,8 + 0 = 128m
En F : Em = m×10×0 + ½×m×16² = 128m
En I : Em = m×10×7,8 + ½×m×10² = 78m + 50m = 128m
Les trois valeurs sont identiques (128m, soit 10 240 J pour m=80 kg) : l'énergie mécanique est bien restée constante. L'affirmation de ton camarade est donc vraie.`
        }
      ]
    },
    {
      titre:"Exercice 2",
      points:"6 pts",
      enonce:`A. Réponds par vrai ou faux :
1. Les solutions aqueuses sont classées en deux grands groupes.
2. Une solution basique contient majoritairement des ions H3O⁺.
3. Dans un détecteur de lumière, le capteur est une thermistance ou LDR.
4. Le vent et le soleil sont des sources d'énergie renouvelable.

B. Complète le texte avec les mots de la liste (Électrique, acide, informatiques, hydroxydes, capteurs, neutralité, programme, BBT, ordinateur, basique, logiciel, hydrogène, techniques, dilution, spécifique) :
« Un ...1... Scientifique est un ...2... conçu pour aider à résoudre des problèmes scientifiques et ...3... Plus on ajoute de l'eau à une solution ...4..., la concentration des ions ...5... augmente si bien que le pH de la solution finale augmente par rapport à la solution initiale. Cette opération d'addition s'appelle la ...6... »

C. Choisis la bonne réponse :
1. Le nombre total d'atomes dans un alcane est 8. Sa formule brute est : a) C2H6 b) C3H6 c) C4H10
2. Un eudiomètre contient 48 cm³ de dihydrogène et 32 cm³ de dioxygène. On produit une étincelle. À la fin, il reste du dioxygène. Ce volume restant est : a) 16 cm³ b) 6 cm³ c) 8 cm³
3. Lors de l'électrolyse de l'eau, on recueille 60 cm³ d'un gaz à la cathode. Le volume du gaz recueilli à l'anode est : a) 120 cm³ b) 30 cm³ c) 60 cm³

D. Recopie et complète le tableau de caractérisation :
Formule de l'ion | Nom de l'ion | Réactif utilisé | Équation bilan | Couleur du précipité
Fe²⁺ | | | |
| | | | Rouille`,
      consignes:[
        { q:"Corrigé — A. Vrai/Faux", r:`1. Faux — les solutions aqueuses se classent en trois groupes (acide, basique, neutre).
2. Faux — c'est la solution acide qui contient majoritairement des ions H3O⁺ ; la basique contient majoritairement des OH⁻.
3. Faux — le capteur de lumière est une LDR ; la thermistance est un capteur de température.
4. Vrai.` },
        { q:"Corrigé — B. Texte à trous", r:`1. logiciel — 2. programme — 3. techniques — 4. acide — 5. hydroxydes — 6. dilution.
(En diluant une solution acide, la concentration des ions H3O⁺ diminue, donc celle des ions OH⁻ augmente relativement — d'où la hausse du pH.)` },
        { q:"Corrigé — C. QCM", r:`1-a : nombre d'atomes = n+(2n+2)=8 → n=2 → C2H6.
2-c : réaction 2H2+O2→2H2O ; 48cm³ H2 consomme 24cm³ O2 (sur 32 disponibles) → il reste 8 cm³ de O2.
3-b : le gaz à la cathode est le dihydrogène (60cm³) ; celui à l'anode (dioxygène) en volume moitié → 30 cm³.` },
        { q:"Corrigé — D. Tableau", r:`Fe²⁺ : ion fer II (ferreux) ; réactif = solution de soude (NaOH) ; équation : Fe²⁺+2OH⁻→Fe(OH)2 ; précipité vert.
Fe³⁺ : ion fer III (ferrique) ; réactif = solution de soude (NaOH) ; équation : Fe³⁺+3OH⁻→Fe(OH)3 ; précipité rouille.` }
      ]
    },
    {
      titre:"Exercice 3",
      points:"6 pts",
      enonce:`I. On dilue un volume de 3 cm³ d'une solution S de pH initial pHi=2,5.
1. Donne la nature de cette solution initiale. 2. Comment varie le pH lors de la dilution ? 3. La solution obtenue après dilution a un pH final pHf=4,5.
a. De combien de fois a-t-on dilué cette solution ? b. Calcule le volume d'eau ajouté.

II. Un ouvrier monte une brouette de sable de masse totale M=80 kg dans une pièce de chantier. Il pousse la brouette sur une planche AB qui fait un angle de 30° avec le sol AC. L'ouvrier s'arrête sur la planche.
1. Fais la figure et représente les forces qui maintiennent la brouette en équilibre. (Échelle : 1 cm pour 400 N ; g=10 N/kg)
2. Détermine graphiquement la force F exercée par l'ouvrier.

III.
1. Quels sont les dangers du courant du secteur ?
2. À la maison, cite deux dispositifs pour assurer la sécurité des personnes.
3. Cite quatre caractéristiques d'un transformateur de commerce.`,
      consignes:[
        { q:"Corrigé — I", r:`1. Solution acide (pH=2,5 < 7).
2. Le pH augmente lors de la dilution (se rapproche de 7).
3a. Facteur de dilution = 10^(pHf−pHi) = 10^(4,5−2,5) = 10² = 100 fois.
3b. Volume final = 100×3 = 300 cm³ → volume d'eau ajouté = 300−3 = 297 cm³.` },
        { q:"Corrigé — II", r:`Forces en équilibre : le poids P=Mg=80×10=800N (vertical, vers le bas) ; la réaction normale N de la planche (perpendiculaire à AB) ; la force F exercée par l'ouvrier (parallèle à la planche, dans le sens de la montée).
F = P×sin(30°) = 800×0,5 = 400 N (soit 1 cm à l'échelle donnée).` },
        { q:"Corrigé — III", r:`1. Dangers du courant du secteur : électrocution, risque d'incendie.
2. Dispositifs de sécurité : le disjoncteur, la mise à la terre (ou le fusible).
3. Caractéristiques d'un transformateur : tension primaire, tension secondaire, puissance nominale, fréquence.` }
      ]
    }
  ]
},
{
  id:"svt-bepc-blanc-adeta-2026",
  cycle:"secondaire1", classe:"3e", serie:null, matiere:"SVT", examen:"BEPC Blanc", annee:2026, session:"DRE-Plateaux, IESG-Adéta — Février",
  duree:"2H", coef:"2",
  exercices:[
    {
      titre:"Exercice 1",
      points:"8 pts",
      enonce:`Dans les camps de réfugiés, les enfants sont souvent victimes de malnutrition et de maladies parasitaires. C'est le cas de Komla, âgé de 3 ans. Ce matin son père l'a conduit à l'hôpital. La consultation a confirmé une malnutrition et du paludisme qui a entraîné une anémie grave. Pour sa prise en charge, on lui propose un kit alimentaire d'urgence et une transfusion sanguine. Le kit alimentaire est composé d'aliments riches en amidon, en protides, en lipides, en sels minéraux et en vitamines, ce qui pourra fournir les nutriments nécessaires après la digestion. Pour la transfusion, le père se propose de donner son sang au fils. Après analyse, le médecin dit qu'ils ne sont pas compatibles (le fils ne peut pas recevoir le sang du père). Le père de Komla souhaite mieux comprendre ce qui se passe.

Consigne 1 : Décris comment les aliments de ce kit se transformeront en nutriments le long du tube digestif.
Consigne 2 : Explique les différentes conditions possibles dans lesquelles ce père pourra donner son sang à son fils.`,
      consignes:[
        {
          q:"Corrigé officiel — Consigne 1",
          r:`La digestion se déroule en deux aspects simultanés :
Aspect mécanique : dans la bouche, les aliments sont broyés par les dents et imprégnés de salive ; la langue rassemble le bol alimentaire, qui passe à l'œsophage par déglutition. Dans l'estomac, les aliments sont à nouveau broyés (brassage). Le mélange progresse ensuite vers l'intestin grêle qui, après absorption des nutriments, évacue les déchets dans le gros intestin.
Aspect chimique : dans la bouche, l'amylase salivaire transforme l'amidon cuit en maltose. Dans l'estomac, les protides sont transformés en polypeptides par la pepsine, donnant une bouillie pâteuse (chyme). Dans l'intestin grêle, la bile et les sucs intestinal et pancréatique transforment les polypeptides en acides aminés, les glucides en glucose, et les lipides en acides gras et glycérol. L'eau, les vitamines et les sels minéraux ne subissent aucune transformation.`
        },
        {
          q:"Corrigé officiel — Consigne 2",
          r:`Deux facteurs déterminent la compatibilité pour une transfusion : le groupe sanguin et le facteur rhésus.
Groupe sanguin (défini par les antigènes A/B sur les hématies et les anticorps anti-A/anti-B du plasma) :
— Père du groupe A → ne peut donner qu'à un fils du groupe A ou AB.
— Père du groupe B → ne peut donner qu'à un fils du groupe B ou AB.
— Père du groupe AB → ne peut donner qu'à un fils du groupe AB.
— Père du groupe O → peut donner à un fils de n'importe quel groupe.
Facteur rhésus (présence ou non de l'antigène D) : le rhésus négatif ne peut donner qu'à un receveur rhésus négatif ou positif, alors que le rhésus positif ne peut donner qu'à un receveur rhésus positif. Pour que la transfusion soit possible, groupe sanguin ET rhésus doivent être compatibles.`
        }
      ]
    },
    {

/* ===========================================================
   CONFIGURATION DE LA NAVIGATION
   -----------------------------------------------------------
   Chaque sujet (voir SUJETS ci-dessus) porte les champs :
     cycle   : identifiant d'un cycle défini dans CYCLES
     classe  : une des classes de ce cycle
     serie   : une série du cycle si cycle.hasSeries === true,
               sinon null
     matiere : une des valeurs de MATIERES_TOUTES

   CYCLES décrit la hiérarchie de navigation de façon déclarative :
   ajouter un cycle, une classe ou une série ne nécessite AUCUNE
   modification des fonctions de rendu plus bas — elles lisent
   uniquement cette configuration.
=========================================================== */
const CYCLES = [
  { id:"secondaire1", label:"Secondaire 1", classes:["6e","5e","4e","3e"], hasSeries:false },
  { id:"secondaire2", label:"Secondaire 2", classes:["Seconde","Première","Terminale"], hasSeries:true, series:["A4","D","C"] }
];

const MATIERES_TOUTES = ["SVT","Mathématiques","Français","Physique-Chimie","Anglais","Histoire-Géo","ECM"];

/* ===========================================================
   ÉTAT DE NAVIGATION
=========================================================== */
let state = {
  cycleId: "secondaire1",
  classe:  "3e",   // ouvre par défaut sur la classe qui a du contenu
  serie:   null,
  matiere: null,
  sujetId: null
};

/** Retourne la configuration du cycle actuellement sélectionné. */
function getCurrentCycle(){
  return CYCLES.find(c => c.id === state.cycleId);
}

/**
 * Filtre SUJETS selon la position courante dans la navigation
 * (cycle, classe, série si applicable), avec un filtre matière
 * optionnel. Point d'entrée unique pour tout comptage/listing —
 * évite de dupliquer la logique de filtrage à plusieurs endroits.
 */
function getSujetsAt({ matiere = null } = {}){
  const cycle = getCurrentCycle();
  return SUJETS.filter(s => {
    if (s.cycle !== state.cycleId) return false;
    if (s.classe !== state.classe) return false;
    if (cycle.hasSeries && s.serie !== state.serie) return false;
    if (matiere && s.matiere !== matiere) return false;
    return true;
  });
}

/* ===========================================================
   RENDU — un dispatcher principal + des vues composées
   à partir d'un unique composant réutilisable (renderChipRow).
=========================================================== */
const app = document.getElementById('app');

function render(){
  app.innerHTML = '';

  renderCycleTabs();
  renderClasseTabs();
  if (getCurrentCycle().hasSeries) renderSerieBand();
  renderMatiereBand();

  if (state.sujetId) renderDetail();
  else renderSujets();

  window.scrollTo(0, 0);
}

/**
 * Composant générique : une rangée de "puces" sélectionnables
 * (onglets de cycle/classe, ou bande déroulante de série/matière).
 * Centralise le rendu + la logique active/désactivé/clic pour
 * éviter la duplication entre les 4 niveaux de navigation.
 *
 * @param {object} opts
 *   items        - tableau des valeurs à afficher
 *   rowClass     - classe CSS du conteneur (ex. 'class-tabs')
 *   chipClass    - classe CSS de chaque puce (ex. 'class-tab')
 *   getLabel     - (item) => texte affiché
 *   isActive     - (item) => booléen
 *   getCount     - (item) => nombre de sujets correspondants, ou null
 *                  si le comptage ne s'applique pas à ce niveau
 *   onSelect     - (item) => effectue la sélection et réaffiche
 */
function renderChipRow(opts){
  const { items, rowClass, chipClass, getLabel, isActive, getCount, onSelect } = opts;

  const row = document.createElement('div');
  row.className = rowClass;

  items.forEach(item => {
    const count = getCount ? getCount(item) : null;
    const disabled = count === 0;

    const chip = document.createElement('div');
    chip.className = chipClass
      + (isActive(item) ? ' active' : '')
      + (disabled ? ' disabled' : '');
    chip.textContent = getLabel(item) + (count ? ' · ' + count : '');

    if (!disabled) chip.onclick = () => onSelect(item);
    row.appendChild(chip);
  });

  app.appendChild(row);
}

function renderCycleTabs(){
  renderChipRow({
    items: CYCLES,
    rowClass: 'class-tabs',
    chipClass: 'class-tab',
    getLabel: c => c.label,
    isActive: c => c.id === state.cycleId,
    getCount: null, // toujours activé, quel que soit le contenu
    onSelect: c => {
      state.cycleId = c.id;
      state.classe  = c.classes[0];
      state.serie   = c.hasSeries ? c.series[0] : null;
      state.matiere = null;
      state.sujetId = null;
      render();
    }
  });
}

function renderClasseTabs(){
  const cycle = getCurrentCycle();
  renderChipRow({
    items: cycle.classes,
    rowClass: 'class-tabs classe-tabs-sub',
    chipClass: 'class-tab',
    getLabel: c => c,
    isActive: c => c === state.classe,
    getCount: null, // la classe reste choisissable même sans contenu encore
    onSelect: c => {
      state.classe  = c;
      state.serie   = cycle.hasSeries ? cycle.series[0] : null;
      state.matiere = null;
      state.sujetId = null;
      render();
    }
  });
}

function renderSerieBand(){
  const cycle = getCurrentCycle();
  const h = document.createElement('h2');
  h.className = 'section-title';
  h.textContent = state.classe + ' — choisis une série';
  app.appendChild(h);

  renderChipRow({
    items: cycle.series,
    rowClass: 'matiere-band',
    chipClass: 'matiere-chip serie-chip',
    getLabel: s => 'Série ' + s,
    isActive: s => s === state.serie,
    getCount: null, // la série reste choisissable même sans contenu encore
    onSelect: s => {
      state.serie   = s;
      state.matiere = null;
      state.sujetId = null;
      render();
    }
  });
}

function renderMatiereBand(){
  const h = document.createElement('h2');
  h.className = 'section-title';
  const label = getCurrentCycle().hasSeries
    ? `${state.classe} (série ${state.serie}) — choisis une matière`
    : `Classe de ${state.classe} — choisis une matière`;
  h.textContent = label;
  app.appendChild(h);

  renderChipRow({
    items: MATIERES_TOUTES,
    rowClass: 'matiere-band',
    chipClass: 'matiere-chip',
    getLabel: m => m,
    isActive: m => m === state.matiere,
    getCount: m => getSujetsAt({ matiere: m }).length,
    onSelect: m => {
      state.matiere = m;
      state.sujetId = null;
      render();
    }
  });
}

function renderSujets(){
  if(!state.matiere){
    const note = document.createElement('p');
    note.className='empty-note';
    note.textContent = 'Choisis une matière ci-dessus pour voir les sujets disponibles.';
    app.appendChild(note);
    return;
  }

  const h = document.createElement('h3');
  h.className='section-title';
  h.style.marginTop='18px';
  h.textContent = state.matiere + ' — sujets disponibles';
  app.appendChild(h);

  const list = getSujetsAt({ matiere: state.matiere })
                 .sort((a,b)=>b.annee-a.annee);

  list.forEach(s=>{
    const card = document.createElement('div');
    card.className='sujet-card';
    card.onclick = ()=>{ state.sujetId=s.id; render(); };
    const titre = document.createElement('div');
    titre.className='titre';
    titre.textContent = `${s.examen} ${s.annee}`;
    const meta = document.createElement('div');
    meta.className='meta';
    meta.textContent = `${s.session}${s.duree? ' · '+s.duree:''}`;
    const badge = document.createElement('div');
    badge.className='badge-corrige';
    badge.textContent='corrigé';
    card.appendChild(badge);
    card.appendChild(titre);
    card.appendChild(meta);
    app.appendChild(card);
  });

  if(list.length===0){
    const note = document.createElement('p');
    note.className='empty-note';
    note.textContent='Aucun sujet pour le moment dans cette matière pour cette classe.';
    app.appendChild(note);
  }
}

function renderDetail(){
  const sujet = SUJETS.find(s=>s.id===state.sujetId);
  if(!sujet){ state.sujetId=null; render(); return; }

  const back = document.createElement('button');
  back.className='back-fab';
  back.textContent='← Retour aux sujets';
  back.onclick = ()=>{ state.sujetId=null; render(); };
  app.appendChild(back);

  const toolbar = document.createElement('div');
  toolbar.className='export-toolbar';
  const btnWord = document.createElement('button');
  btnWord.className='export-btn';
  btnWord.textContent='📝 Télécharger en Word';
  btnWord.onclick = () => exportSujetAsWord(sujet);
  const btnPdf = document.createElement('button');
  btnPdf.className='export-btn';
  btnPdf.textContent='📄 Télécharger en PDF';
  btnPdf.onclick = () => exportSujetAsPdf(sujet);
  toolbar.appendChild(btnWord);
  toolbar.appendChild(btnPdf);
  app.appendChild(toolbar);

  const head = document.createElement('div');
  head.className='sujet-header';
  head.innerHTML = `<div class="examtitle">${sujet.examen} ${sujet.annee}</div>
    <table>
      <tr><td>Matière</td><td>: ${sujet.matiere}</td><td>Durée</td><td>: ${sujet.duree||'—'}</td></tr>
      <tr><td>Session</td><td>: ${sujet.session}</td><td>Coef</td><td>: ${sujet.coef||'—'}</td></tr>
    </table>`;
  app.appendChild(head);

  sujet.exercices.forEach((ex,exi)=>{
    const box = document.createElement('div');
    box.className='exercice';
    let html = `<h3>${ex.titre}${ex.points? ' ('+ex.points+')':''}</h3>`;
    html += `<div class="enonce">${escapeHtml(ex.enonce)}</div>`;
    box.innerHTML = html;

    if(ex.documents){
      ex.documents.forEach(doc=>{
        const d = document.createElement('div');
        let dh = `<p style="font-family:'Courier New',monospace;font-size:12.5px;margin:14px 0 4px;font-weight:700;">${doc.titre}</p>`;
        if(doc.intro) dh += `<div class="enonce" style="font-size:14px;">${escapeHtml(doc.intro)}</div>`;
        dh += doc.html;
        d.innerHTML = dh;
        box.appendChild(d);
      });
    }

    ex.consignes.forEach((c,ci)=>{
      const cwrap = document.createElement('div');
      cwrap.className='consigne';
      const q = document.createElement('div');
      q.className='q';
      q.textContent = c.q;
      cwrap.appendChild(q);

      const btn = document.createElement('button');
      btn.className='reveal-btn';
      btn.textContent='✎ Voir le corrigé';
      const rid = `corrige-${exi}-${ci}`;
      const rdiv = document.createElement('div');
      rdiv.className='corrige';
      rdiv.id = rid;
      rdiv.innerHTML = `<span class="tick">✓</span> ${escapeHtml(c.r).replace(/\n/g,'<br>')}`;

      btn.onclick = ()=>{
        const shown = rdiv.classList.toggle('show');
        btn.textContent = shown ? '✎ Masquer le corrigé' : '✎ Voir le corrigé';
      };

      cwrap.appendChild(btn);
      cwrap.appendChild(rdiv);
      box.appendChild(cwrap);
    });

    app.appendChild(box);
  });
}

/* ===========================================================
   EXPORT — génération Word (.doc) et PDF (impression navigateur)
   -----------------------------------------------------------
   Les deux exports partagent la même mise en forme de contenu
   (buildSujetContentHtml) pour éviter toute divergence entre
   les deux formats — un seul endroit à maintenir.
=========================================================== */

/** Nom de fichier sûr : enlève accents/caractères spéciaux. */
function slugifyFilename(text){
  return text
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-zA-Z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '');
}

/**
 * Construit le HTML du contenu d'un sujet (titre, documents, exercices,
 * consignes + corrigés) — indépendant de la mise en page de l'appli,
 * pensé pour être imprimé ou ouvert dans Word.
 */
function buildSujetContentHtml(sujet){
  const nl2br = t => escapeHtml(t).replace(/\n/g, '<br>');

  let body = `<h1>${escapeHtml(sujet.examen)} ${sujet.annee}</h1>
    <p><b>Matière :</b> ${escapeHtml(sujet.matiere)} &nbsp; <b>Classe :</b> ${escapeHtml(sujet.classe)}${sujet.serie ? ' (série '+escapeHtml(sujet.serie)+')' : ''}<br>
    <b>Session :</b> ${escapeHtml(sujet.session)} &nbsp; <b>Durée :</b> ${escapeHtml(sujet.duree||'—')} &nbsp; <b>Coef :</b> ${escapeHtml(sujet.coef||'—')}</p>
    <hr>`;

  sujet.exercices.forEach(ex=>{
    body += `<h2>${escapeHtml(ex.titre)}${ex.points ? ' ('+escapeHtml(ex.points)+')' : ''}</h2>`;
    body += `<p>${nl2br(ex.enonce)}</p>`;

    if(ex.documents){
      ex.documents.forEach(doc=>{
        body += `<p><b>${escapeHtml(doc.titre)}</b></p>`;
        if(doc.intro) body += `<p>${nl2br(doc.intro)}</p>`;
        body += doc.html;
      });
    }

    ex.consignes.forEach(c=>{
      body += `<p><b>${escapeHtml(c.q)}</b></p>`;
      body += `<p style="color:#A8332A;">${nl2br(c.r)}</p>`;
    });
  });

  return body;
}

/** Télécharge le sujet au format Word (.doc), via la technique HTML-blob. */
function exportSujetAsWord(sujet){
  const content = buildSujetContentHtml(sujet);
  const doc = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
    <head><meta charset="utf-8"><title>${escapeHtml(sujet.examen)} ${sujet.annee}</title></head>
    <body style="font-family:Calibri,Arial,sans-serif;">${content}</body></html>`;

  const blob = new Blob(['\ufeff', doc], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = slugifyFilename(`${sujet.examen}-${sujet.annee}-${sujet.matiere}`) + '.doc';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/**
 * "Export PDF" via la boîte d'impression du navigateur : ouvre le
 * contenu du sujet dans une fenêtre dédiée et déclenche l'impression ;
 * l'utilisateur choisit "Enregistrer en PDF" comme destination.
 * Choix volontaire : pas de librairie PDF externe, donc rien à charger
 * depuis le réseau — cohérent avec le fonctionnement hors ligne de l'appli.
 */
function exportSujetAsPdf(sujet){
  const content = buildSujetContentHtml(sujet);
  const printHtml = `<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
    <title>${escapeHtml(sujet.examen)} ${sujet.annee}</title>
    <style>
      body{font-family:Georgia,serif; color:#1C2B23; padding:24px; line-height:1.5;}
      h1{font-size:20px;} h2{font-size:16px; margin-top:24px; border-bottom:1px solid #ccc;}
      table{border-collapse:collapse; width:100%; margin:10px 0;}
      td,th{border:1px solid #333; padding:5px 8px; text-align:left;}
    </style>
    </head><body>${content}</body></html>`;

  const printWindow = window.open('', '_blank');
  if(!printWindow){
    alert("Le navigateur a bloqué l'ouverture de la fenêtre d'impression. Autorise les pop-ups pour ce site puis réessaie.");
    return;
  }
  printWindow.document.write(printHtml);
  printWindow.document.close();
  printWindow.focus();
  printWindow.print();
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

render();

  const b = document.getElementById('offlineBadge');
  if(navigator.onLine){ b.classList.remove('show'); }
  else{ b.classList.add('show'); }
}
window.addEventListener('online', updateOfflineBadge);
window.addEventListener('offline', updateOfflineBadge);
updateOfflineBadge();
