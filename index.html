          r:`Loi de propagation rectiligne de la lumière : « Dans un milieu transparent et homogène, la lumière se propage en lignes droites. »
Position de la bougie : C'D'/CD = OC'/CO → CO = (CD×OC')/C'D' = (2×4)/1,5 = 5,3 cm.

    {
      titre:"Exercice 1 — Situation 2 (identification du cuivre)",
      points:"non précisé",
      enonce:`Au cours d'une séance de travaux pratiques, on verse de l'acide nitrique sur un morceau de cuivre, puis on ajoute de la soude à la solution obtenue, ce qui conduit à l'obtention d'un précipité.

Consigne : rédige un rapport clair de la séance, présentant tes observations, la couleur/le nom/la formule du précipité formé, le nom et la formule de l'ion mis en évidence, ainsi que le nom de la transformation et l'équation de la réaction.`,
      consignes:[
        {
          q:"Corrigé officiel",
          r:`Observations : après versement de l'acide nitrique sur le cuivre, on observe un dégagement de vapeur rousse, la disparition du cuivre et l'obtention d'une solution bleue d'ions cuivre. Après ajout de la soude, apparition d'un précipité bleu.
Précipité : couleur bleue, nom hydroxyde de cuivre, formule Cu(OH)2.

Transformation chimique. Équation : Cu²⁺ + 2OH⁻ → Cu(OH)2.`
        }
      ]
    },
    {
      titre:"Exercice 2 — Questions objectives",

      enonce:`Note : l'énoncé complet de cet exercice (les questions I à IV) n'était pas disponible — seul le corrigé officiel (réponses) a été transmis. Les réponses sont présentées ci-dessous à titre de référence, sans le texte des questions.`,
      consignes:[
        {
          q:"Corrigé officiel (réponses seules, énoncé non disponible)",
          r:`I. Vrai/Faux : 1-Faux · 2-Vrai · 3-Vrai · 4-Faux.
II. QCM : 1-b) E=100 · 2-c) 750m · 3-c) 4 diodes · 4-b) électrochimique.

    {
      titre:"Exercice 3",
      points:"6 pts",
      enonce:`I. Un glaçon cubique d'arête 3cm flotte sur l'eau. Sa densité est 0,9.
1. Pourquoi le glaçon flotte-t-il sur l'eau ?
2. Calcule la masse volumique du glaçon, puis sa masse.
3. Déduis-en la masse du liquide déplacé.
4. Calcule le volume immergé du glaçon.

II. Électrolyse d'une solution de sulfate de cuivre pour déposer du cuivre sur une médaille.
1. Où doit-on placer la médaille ?
2. Quelle est l'autre électrode ?
3. Écris les équations à chaque électrode.
4. Un volume V1=3cm³ est mesuré avant électrolyse et V2=3,8cm³ après. a. Calcule le volume de cuivre déposé. b. Calcule sa masse (densité du cuivre = 8,9). c. Sachant qu'un dépôt de 2,2g nécessite 1h, calcule le temps nécessaire pour ce dépôt.`,
      consignes:[
        {
          q:"Corrigé officiel — I",
          r:`1. Le glaçon flotte car sa densité (0,9) est inférieure à celle de l'eau (1).
2. Masse volumique : ρg = ρe×d = 1×0,9 = 0,9 g/cm³. Masse : mg = ρg×a³ = 0,9×27 = 24,3 g.
3. La masse du liquide déplacé est égale à la masse du glaçon : 24,3 g.
4. Volume immergé : Vi = mg/ρe = 24,3/1 = 24,3 cm³.`
        },
        {
          q:"Corrigé officiel — II",
          r:`1. La médaille doit être placée à la cathode.
2. L'autre électrode est l'anode.
3. À la cathode : Cu²⁺ + 2e⁻ → Cu. À l'anode : Cu → Cu²⁺ + 2e⁻.
4a. Volume de cuivre déposé : Vd = V2−V1 = 3,8−3 = 0,8 cm³.
4b. Masse : Md = ρcu×Vd = 8,9×0,8 = 7,12 g.
4c. Temps : 1h → 2,2g ; t → 7,12g → t = (1×7,12)/2,2 ≈ 3h16min.`
        }
      ]
    }
  ]
},

      points:"8 pts",
      enonce:`Notre professeur d'Histoire-Géographie a déclaré, lors d'une séance de cours portant sur le Togo sous domination coloniale allemande : « Les Allemands ont posé des actions positives sur les plans économique et social au Togo. Ils ont accompli des œuvres qui continuent de nous servir jusqu'à ce jour. » Il demande de faire ressortir ces œuvres allemandes.

Consigne 1 : Relève les œuvres allemandes dans le domaine économique (agriculture et transport).
Consigne 2 : Présente les actions sociales allemandes (enseignement et santé).`,
      consignes:[
        {
          q:"Corrigé officiel — Consigne 1",
          r:`Dans l'agriculture : introduction de nouvelles plantes (coton, cacao, café, palmier à huile) ; reboisement (tecks, cocotiers, manguiers) ; création d'une école d'agriculture à Nuatja (Notsè) en 1904 ; introduction de races sélectionnées de poules, porcs et bovins.

        },
        {
          q:"Corrigé officiel — Consigne 2",
          r:`Dans l'enseignement : accent mis sur l'enseignement en langue nationale (éwé) puis en allemand, et sur l'enseignement technique et professionnel ; construction d'écoles primaires en 1905 (Aného, Lomé, Sokodé), de l'école professionnelle de Lomé et de l'école d'agriculture de Notsè.

    },

      enonce:`1. Définis : économie bleue ; tourisme.

      consignes:[
        {
          q:"Corrigé officiel",
          r:`1. Économie bleue : ensemble des activités économiques liées à la mer, aux océans et au littoral. Tourisme : fait de voyager, de parcourir pour son plaisir un lieu autre que celui où l'on vit habituellement.

  exercices:[

      titre:"Exercice 1",
      points:"8 pts",
      enonce:`Il existe plusieurs types de sols possédant des propriétés variées, et divers facteurs à l'origine de leur dégradation.

      consignes:[
        {
          q:"Corrigé officiel",
          r:`Propriétés essentielles d'un sol : la perméabilité (capacité à se laisser traverser par l'eau) ; la capacité de rétention en eau (quantité d'eau retenue) ; la texture (granulométrie) ; la porosité (espace entre les particules) ; la teneur en humus (pourcentage de matière organique décomposée).
Facteurs de dégradation liés au climat : l'eau (ruissellement, infiltration, lessivage) et le vent (déflation, balayage de surface).
Facteurs liés à l'action de l'homme : le déboisement/la déforestation, les feux de brousse (accidentels ou volontaires), les mauvaises pratiques agricoles, la mauvaise exploitation des ressources minières, le surpâturage.
Les sols les plus favorables à l'agriculture sont les sols riches en humus et les sols argileux.`

{
  id:"maths-crpt-plo-3e-2025",
  cycle:"secondaire1", classe:"3e", serie:null, matiere:"Mathématiques", examen:"Composition Régionale (3e trimestre)", annee:2025, session:"DRE Plateaux-Ouest — corrigé officiel",
  duree:"2H", coef:"3",
  exercices:[
    {
      titre:"Exercice 1",
      points:"8 pts",
      enonce:`Un gérant de station-service reçoit une citerne de 20 000 litres de carburant super sans plomb, facturée 13 000 000 F CFA toutes taxes comprises (taxes appliquées : 18%). Il vend en moyenne 1000 litres par jour à 700 F CFA le litre.

Consigne 1 : Détermine le prix d'un litre de carburant hors taxes, puis donne ton avis sur l'affirmation du gérant concernant la date de la prochaine livraison.
Consigne 2 : Détermine le montant mensuel maximal que le gérant peut réaliser.`,
      consignes:[
        {
          q:"Corrigé officiel — Consigne 1",
          r:`Soit x le prix hors taxe d'un litre. x + 18x/100 = 13 000 000/20 000 → x + 0,18x = 650 → 1,18x = 650 → x = 650×100/118 ≈ 550,85 F CFA (prix hors taxes).
Avec 20 000 litres et une vente moyenne de 1000 litres/jour, le stock dure 20 000/1000 = 20 jours. La date limite pour la prochaine livraison est donc 20 jours après la réception (le 06 juin 2025 dans le contexte du sujet), confirmant l'affirmation du gérant.`
        },
        {
          q:"Corrigé officiel — Consigne 2",
          r:`Montant journalier maximal : 1000×700 = 700 000 F CFA. Pour un mois de 31 jours (montant mensuel maximal) : 700 000×31 = 21 700 000 F CFA.`
        }
      ]
    },
    {
      titre:"Exercice 2",
      points:"6 pts",
      enonce:`A. Réponds par vrai ou faux (énoncé complet non disponible).
B. Choisis la bonne réponse (4 questions, énoncé complet non disponible).
C. Complète (vocabulaire géométrique/algébrique) : a. Le rayon est la ...a... du diamètre. b. ... c. Le centre... / d = ... ; e = intervalle ... / f = condition d'existence d'une fraction ; g = forme simplifiée / h = un vecteur colonne.
D. Définis une pyramide régulière.`,
      consignes:[
        { q:"Corrigé officiel — A et B", r:`A. 1-Faux · 2-Faux · 3-Vrai · 4-Faux.
B. 1-a · 2-c · 3-b · 4-c.` },
        {
          q:"Corrigé officiel — C",
          r:`1. a = moitié ; b = mesure ; c = centre.
2. d = −3 ; e = (−9 ; −3).
3. f : x≠2/3 et x≠−5 ; g : H = (5−x)/(x+5).
4. h = (1;3) (vecteur colonne).`
        },
        { q:"Corrigé officiel — D", r:`Une pyramide régulière est une pyramide dont la base est un polygone régulier et dont les faces latérales sont des triangles isocèles superposables.` }
      ]
    },
    {
      titre:"Exercice 3",
      points:"6 pts",
      enonce:`I. 1a. Simplifie D = 5√28 − 3√175 + √252. 1b. Développe et réduis H = (x−3)² − (6−2x)(5−x) − x² + 9.
2. A(1;2) et H(2;2). Montre que le point E, symétrique de A par rapport à H, a pour coordonnées (3;6).

II. Une étude porte sur la masse (en g) de mangues réparties en classes : [300;350[→6, [350;400[→10, [400;450[→13, [450;500[→x, [500;550[→14, [550;600[→2. Total : 60 mangues.
a. Donne la nature du caractère étudié. b. Calcule x, et donne la classe modale. c. Calcule le pourcentage de mangues pesant moins de 450g. d. Construis l'histogramme.`,
      consignes:[
        {
          q:"Corrigé officiel — I",
          r:`1a. D = 5√(4×7) − 3√(25×7) + √(36×7) = (5×2 − 3×5 + 6)√7 = (10−15+6)√7 = √7.
1b. H = (x²−6x+9) − (30−6x−10x+2x²) − x²+9 = x²−2x²−x² −6x+16x +9+9−30 = −2x²+10x−12.
2. Vecteur AH = vecteur HE → E = 2H−A = (2×2−1 ; 2×2−2) = (3 ; 6). (Dans le corrigé officiel, y_A=−2 est utilisé pour aboutir à y_E=6 ; les coordonnées exactes de A doivent être vérifiées auprès du sujet original.)`
        },
        {
          q:"Corrigé officiel — II",
          r:`a. Le caractère étudié est la masse des mangues ; il est quantitatif.
b. 6+10+13+x+14+2=60 → x=15. Classe modale : [400;450[.
c. Nombre de mangues < 450g : 6+10+13+15=44. Pourcentage : 44/60×100 ≈ 73,33%.
d. Histogramme à construire à partir des effectifs de chaque classe.`
        }
      ]
    }
  ]
},
{
  id:"svt-crps-centrale-1a4-2025",
  cycle:"secondaire2", classe:"Première", serie:"A4", matiere:"SVT", examen:"Composition Régionale (1er semestre)", annee:2025, session:"DRE Centrale",
  duree:"2H", coef:"1",
  exercices:[
    {
      titre:"Exercice 1 — Situation d'évaluation",
      points:"8 pts",
      enonce:`Votre camarade de classe WAZILA, guéri d'un paludisme qui l'a empêché de suivre les cours, reçoit de son professeur un document (schéma d'une cellule annotée de 1 à 13, avec en particulier une grande vacuole, plusieurs mitochondries réparties dans le cytoplasme, et une structure allongée richement texturée en bas de la cellule associée aux repères 9 à 13) portant sur l'étude de la cellule, qu'il a du mal à comprendre.

Consigne 1 : Aide-le à comprendre l'organisation cellulaire tout en précisant les rôles des éléments cellulaires 5, 7 et 13.
Consigne 2 : Différencie cette cellule à un autre type de cellule que vous avez étudié.`,
      consignes:[
        {
          q:"Corrigé — Consigne 1",
          r:`Organisation : la cellule observée est délimitée par une paroi pectocellulosique et une membrane plasmique ; elle contient un cytoplasme où baignent divers organites (mitochondries, réticulum endoplasmique, vacuoles) ainsi qu'un noyau renfermant le matériel génétique.
Rôles — éléments 5 et 7 (mitochondries) : elles sont le siège de la respiration cellulaire et produisent l'énergie (ATP) nécessaire à l'activité de la cellule. Élément 13 (noyau, avec ses composantes 9 à 12) : il contient l'ADN (information génétique) et contrôle l'ensemble des activités et de la division de la cellule.
(Identification établie à partir de la disposition typique de ce type de schéma — à confronter à ton document original avant diffusion, notamment pour les éléments 5 et 7.)`
        },
        {
          q:"Corrigé — Consigne 2",
          r:`Cette cellule est une cellule végétale : elle possède une paroi pectocellulosique (absente chez la cellule animale) et une grande vacuole centrale (les vacuoles de la cellule animale sont petites et peu nombreuses, voire absentes). À l'inverse, la cellule animale possède un centrosome, structure généralement absente dans la cellule végétale mature.`
        }
      ]
    },
    {
      titre:"Exercice 2 — Questions objectives",
      points:"6 pts",
      enonce:`I. Complète le texte avec les mots suivants (eucaryote, animale, procaryote, membrane plasmique, paroi pectocellulosique, végétale, mitochondrie, vacuole) :
« La structure rigide qui entoure la membrane cellulaire et protège la cellule végétale est la ...1... Le centriole est une structure propre à la cellule ...2... Toutes les cellules sont entourées de ...3... qui sépare l'intérieur de la cellule de l'environnement extérieur. Une cellule ...4... possède un véritable noyau. »

II. Identifie l'intrus dans chaque cas :
1. Glucose, amidon, cellulose, chlorure.
2. Eau, sulfate, lactose, fer, zinc.
3. Centrosome, paroi pectocellulosique, grosse vacuole, plastes.
4. Hématies, paramécie, leucocytes, globulines.

III. Choisis la bonne réponse :
1. Les mitochondries : a) sont spécifiques aux cellules animales b) sont spécifiques aux cellules végétales c) se retrouvent dans les cellules animales et végétales d) possèdent un noyau.
2. Le centrosome : a) fournit de l'énergie à la cellule b) assure la formation de l'aster lors de la division cellulaire c) intervient dans la synthèse des protéines d) aucune bonne réponse.
3. Les lipides sont : a) des esters d'alcools et d'acides gras b) des constituants minéraux c) solubles dans l'eau d) contiennent les acides aminés.
4. Les échanges cellulaires se font : a) à travers la vacuole b) à travers la paroi cellulaire c) à travers la membrane plasmique.`,
      consignes:[
        { q:"Corrigé — I", r:`1. paroi pectocellulosique — 2. animale — 3. membrane plasmique — 4. eucaryote.` },
        {
          q:"Corrigé — II",
          r:`1. Intrus : chlorure (substance minérale ; les trois autres sont des glucides).
2. Intrus : lactose (glucide organique ; les autres sont des substances minérales ou l'eau).
3. Intrus : centrosome (structure de la cellule animale ; les trois autres sont caractéristiques de la cellule végétale).
4. Intrus : globulines (ce sont des protéines, pas des cellules ; les trois autres sont des cellules).`
        },
        { q:"Corrigé — III", r:`1-c · 2-b · 3-a · 4-c.` }

    },
    {
      titre:"Exercice 3 — Questions traditionnelles",
      points:"6 pts",
      enonce:`1. Une substance X est constituée de corps simples de formule générale R-CH(NH2)-COOH.
a. Quelle est la nature chimique de la substance X ?
b. Cite deux propriétés de X.

2. Voici une liste de constituants cellulaires : acide aminé, huile de karité, glycogène, ovalbumine, calcium, amidon, graisse, eau, glucose, beurre. Classe-les selon leur groupe (Glucides, Lipides, Protides, Substances minérales).

3. Cite quatre rôles de l'eau dans la matière vivante.`,
      consignes:[
        {

Consigne 1 : Commente le résultat de l'expérience de l'osmomètre en précisant l'application du phénomène mis en jeu.
Consigne 2 : Explique l'état de chaque cellule observée (Fig a, b, c), et explique pourquoi, en saison pluvieuse, les plants de maïs sont vigoureux et bien verts alors qu'en saison sèche ils flétrissent.`,

          r:`Résultat : le niveau du liquide dans le tube de l'osmomètre monte de h1 à h2. Ceci s'explique par le phénomène d'osmose : l'eau pure (milieu extérieur hypotonique) traverse la membrane hémiperméable vers la solution de saccharose (milieu intérieur hypertonique), l'eau se déplaçant toujours du milieu le moins concentré vers le milieu le plus concentré en soluté à travers une membrane semi-perméable.
Application : ce phénomène explique l'absorption de l'eau par les racines des plantes, le principe de la dialyse rénale, et les techniques de conservation des aliments par salaison (l'effet inverse, plasmolysant, détruit les microbes).`
        },
        {
          q:"Corrigé — Consigne 2",
          r:`Fig a (eau de robinet, milieu hypotonique) : la cellule est turgescente — elle absorbe l'eau par osmose, son volume augmente, la membrane est pressée contre la paroi.
Fig b (eau très salée, milieu hypertonique) : la cellule est plasmolysée — elle perd de l'eau par osmose vers le milieu extérieur, le cytoplasme se rétracte et se détache de la paroi.
Fig c (témoin) : état normal de référence, cellule ni turgescente ni plasmolysée.
En saison pluvieuse, le sol riche en eau est hypotonique par rapport aux cellules racinaires : l'eau pénètre par osmose dans les racines puis dans toute la plante, assurant la turgescence des cellules — d'où des plants vigoureux et bien verts. En saison sèche, l'eau du sol se raréfie et les cellules, qui continuent à perdre de l'eau par transpiration sans compensation suffisante, perdent leur turgescence : les plants flétrissent et se décolorent.`

  exercices:[
    {
      titre:"Exercice 1",
      points:"8 pts",
      enonce:`Lors d'une sortie pédagogique dans une station de traitement des eaux, des élèves observent une expérimentation sur les échanges entre cellules et environnement. Un technicien utilise une solution saline pour tester les effets de différentes concentrations sur des cellules sanguines (document A) et sur une cellule végétale (document B).

Consigne 1 : Décris les effets des solutions hypotonique et hypertonique sur les globules rouges et sur une cellule végétale, puis donne une importance de ces échanges mentionnée par le technicien.
Consigne 2 : Nomme ces cellules, fais ressortir leurs points communs et divergents, puis identifie l'organite responsable de ces échanges cellulaires.`,
      consignes:[
        {
          q:"Corrigé — Consigne 1",
          r:`En milieu hypotonique (moins concentré que le cytoplasme), l'eau entre dans la cellule par osmose : le globule rouge gonfle et peut éclater (hémolyse), n'ayant pas de paroi rigide pour le contenir ; la cellule végétale devient turgescente, sans éclater, grâce à sa paroi pectocellulosique.
En milieu hypertonique (plus concentré), l'eau sort de la cellule par osmose : le globule rouge se rétracte et se ratatine (crénelure) ; la cellule végétale se plasmolyse (le cytoplasme se détache de la paroi).
Importance : ces échanges sont essentiels en médecine pour la conception de sérums adaptés (éviter l'hémolyse ou la crénelure des globules rouges lors des perfusions) et en agriculture pour optimiser l'absorption des nutriments par les plantes.`
        },
        {
          q:"Corrigé — Consigne 2",
          r:`Cellules : le globule rouge (hématie) et une cellule végétale.

        }
      ]
    },
    {
      titre:"Exercice 2",
      points:"6 pts",
      enonce:`I. Parmi les affirmations suivantes, deux sont fausses : identifie-les puis corrige-les.
1. Les vacuoles sont plus grosses et plus nombreuses dans les cellules animales que dans les cellules végétales.
2. La mitose assure une distribution des chromosomes entre les deux cellules filles qui reçoivent des parties à peu près équivalentes du programme génétique de la cellule mère.
3. La méiose est une reproduction conforme comportant deux types de divisions : une division réductionnelle et une division équationnelle.
4. L'amidon est un polymère de glucose qui donne une solution colloïdale avec l'eau chaude et une suspension avec l'eau froide.

II. Choisis la bonne réponse :
1. Quelle est la caractéristique principale de la Prophase I de la méiose ? a. alignement des chromosomes sur l'équateur b. formation de tétrades c. séparation des chromatides d. reconstitution de l'enveloppe nucléaire.
2. Le transport actif est le passage de substances dissoutes à travers la membrane cellulaire : a. suivant le gradient de concentration b. contre le gradient de concentration c. avec consommation d'énergie.

Montage 2 : osmomètre=A, cristallisoir=B, niveau baisse.
Montage 3 : osmomètre=D, cristallisoir=C, niveau monte.
Montage 4 : osmomètre=A, cristallisoir=D, niveau monte.
Classe ces 4 solutions de la plus concentrée à la moins concentrée.`,
      consignes:[
        {
          q:"Corrigé — I",
          r:`Les deux affirmations fausses sont 1 et 3.
1. Correction : les vacuoles sont plus grosses et plus nombreuses dans les cellules VÉGÉTALES que dans les cellules animales (et non l'inverse).
3. Correction : la méiose est une reproduction RÉDUCTIONNELLE (et non conforme) comportant deux divisions, une réductionnelle et une équationnelle — c'est la mitose qui est une reproduction conforme.`
        },
        { q:"Corrigé — II", r:`1-b (formation de tétrades). 2-b et c (le transport actif se fait contre le gradient de concentration, ce qui nécessite une consommation d'énergie — les deux propriétés sont liées). 3-a (seul le phénomène d'osmose, une membrane hémiperméable ne laissant passer que l'eau, pas les solutés comme dans la dialyse). 4-d (un ester et une base).` },
        {
          q:"Corrigé — III",
          r:`Montage 1 (niveau monte, B→D) : B plus concentrée que D.

Montage 3 (niveau monte, D→C) : D plus concentrée que C.

      ]
    },
    {
      titre:"Exercice 3",
      points:"6 pts",
      enonce:`Les schémas A, B, C, D et E ont été réalisés à partir de l'observation de coupes d'organes de plantes à fleurs (cellule mère du pollen en cours de division).
1. Quelle est la formule chromosomique de cette plante à fleur ?
2. Quel est le phénomène de la vie cellulaire mis en évidence par ces schémas ? Donne-en deux importances.

4. Retrouve l'ordre chronologique du déroulement du phénomène en utilisant les lettres.`,
      consignes:[
        {
          q:"Corrigé — 1 et 2",
          r:`1. La cellule mère du pollen est diploïde, de formule chromosomique 2n ; les microspores (grains de pollen) issues de la division sont haploïdes, de formule chromosomique n.
2. Phénomène mis en évidence : la méiose (division réductionnelle permettant la formation des microspores/gamètes à partir d'une cellule mère diploïde).
Deux importances : elle maintient constant le nombre de chromosomes de l'espèce au fil des générations (la fécondation rétablissant ensuite le nombre diploïde) ; elle est source de diversité génétique par le brassage chromosomique.`
        },
        {
          q:"Corrigé — 3 et 4 (identification et ordre des schémas)",
          r:`D'après l'aspect des schémas : A montre des bivalents (chromosomes appariés) alignés au centre de la cellule (métaphase I) ; D montre les chromosomes en cours de séparation vers les pôles (anaphase I) ; E montre la cellule qui se divise en deux avec un groupe de chromosomes à chaque pôle (télophase I) ; C montre des chromosomes simples (non appariés) alignés dans l'une des cellules filles (métaphase II) ; B montre le résultat final, quatre microspores séparées (tétrade).
Ordre chronologique proposé : A → D → E → C → B.
Cette identification et cet ordre sont établis à partir de l'aspect visuel des schémas (formes et regroupements des chromosomes) — à confronter avec ton document original avant diffusion, la distinction entre certains stades (notamment A/D et le placement exact de C) n'étant pas garantie avec une certitude absolue.`
        }
      ]
    }
  ]

        {

          r:`Réq = R1+R2 = 15+20 = 35 Ω.

Puissance : P = U×I = 12×1,4 = 16,8 W.

Conclusion : l'association en série donne une résistance équivalente plus grande que chacune des deux résistances (et consomme moins d'énergie) ; l'association en dérivation donne une résistance équivalente plus petite que chacune des deux résistances.`

    {

      points:"8 pts",
      enonce:`1. Détermine les nombres α, β, ω, φ, Ω à partir de : K=[−2;4]∩[−2;→[ (donne α et β, avec α<β) ; l'inéquation (I): 2x+4≥3x+6 (donne φ) ; l'équation (E): x²−16=0, avec ω la solution négative ; le système {2x−3y=1 ; 3x−y=5} (donne Ω).
2. Place les points A, B, C, D obtenus dans un repère.

      consignes:[
        {
          q:"Corrigé officiel",
          r:`K = [−2;4]∩[−2;→[ = [−2;4]. Comme α<β : α=−2, β=4.
(I): 2x+4≥3x+6 → −x≥2 → x≤−2, donc φ=−2 (ou l'intervalle correspondant).
(E): x²−16=0 → x²=16 → x=4 ou x=−4. Comme ω est la solution négative : ω=−4.
Système : (1) donne y=(2x−1)/3. En substituant dans (2) : 9x−2x+1=15 → 7x=14 → x=2, puis y=1. Donc Ω correspond à (2;1).
Points : A(−2;4), B(−4;2), C(0;−2), D(2;0).
Aire : AB=√[(−4+2)²+(2−4)²]=√8=2√2 ; BC=√[(−4)²+(−2−2)²]=√32=4√2. Aire = L×l = 2√2×4√2 = 16 dam².

{
  id:"svt-cr2t-3e-plo",
  cycle:"secondaire1", classe:"3e", serie:null, matiere:"SVT", examen:"Composition Régionale (2e trimestre)", annee:2025, session:"DRE Plateaux-Ouest — sujet et corrigé officiels confirmés",

  exercices:[
    {
      titre:"Exercice — Situation d'évaluation",
      points:"8 pts",
      enonce:`Ton petit frère consomme un repas composé du riz mélangé du haricot, accompagné de la sauce d'arachide à la viande de poulet. Il va aux selles le lendemain matin. À sa grande surprise, il remarque des débris des grains du haricot dans ses selles. Il se pose alors des questions sur ce qui s'est passé avec les autres aliments qu'il avait consommés la veille. Il vient donc à toi pour comprendre la présence de ces débris du haricot et la disparition des autres aliments.

Consigne 1 : Explique-lui la présence de ces débris du haricot et la disparition des autres aliments.
Consigne 2 : Indique les voies empruntées par les produits issus de la digestion complète de ces aliments.`,
      consignes:[
        {
          q:"Corrigé officiel — Consigne 1",
          r:`Dans la bouche, les aliments sont broyés et imprégnés de salive (bol alimentaire) ; les glucides sont transformés en maltose par l'amylase salivaire. Dans l'estomac, après brassage et action du suc gastrique, on obtient le chyme ; les protides sont transformés en polypeptides et peptones par la pepsine et la présure. Dans l'intestin grêle, après action des sucs intestinal et pancréatique et de la bile, on obtient le chyle : l'amidon restant est transformé en maltose puis glucose, les lipides en acides gras et glycérol, les peptides en acides aminés. L'eau, les sels minéraux et les vitamines ne subissent pas de transformation.
Les débris de haricot dans les selles montrent que la mastication du haricot dans la bouche a été insuffisante/absente pour ce grain particulier, contrairement aux autres aliments qui ont bien suivi les transformations mécaniques et chimiques.`
        },
        {
          q:"Corrigé officiel — Consigne 2",
          r:`Deux voies d'absorption intestinale : la voie sanguine, empruntée par l'eau, les sels minéraux, les acides aminés, le glucose et les vitamines hydrosolubles ; et la voie lymphatique, empruntée par les acides gras, le glycérol et les vitamines liposolubles.`
        }
      ]
    },
    {
      titre:"Exercice 2",
      points:"6 pts",
      enonce:`A. Complète le texte en te servant des lettres a, b, c, d : « Dans l'organisme, le sang circule dans les ...a... Le sang est transporté du cœur vers les autres organes par les ...b..., il est ramené au cœur par les ...c... Les ...d... favorisent les échanges entre le sang et les autres tissus. »

B. Choisis la bonne réponse :
1. La présence du glucose dans l'urine est appelée : glycémie / glycosurie / glycogène.
2. Parmi ces groupes sanguins, le donneur universel est : A+ / AB+ / O−.
3. L'hémorragie artérielle est caractérisée par un écoulement : lent du sang sous forme de nappe / en jets saccadés du sang / très lent du sang.
4. L'oxyhémoglobine est formée au niveau des : tissus / poumons / cœur.

C. Réponds par vrai ou faux :
1. Le calcaire sert à fabriquer le ciment en génie civil.
2. La capacité pulmonaire est le volume d'air total que peuvent contenir les poumons.
3. La sérovaccination est l'association du sérum et d'un antigène.
4. Le cerveau a pour rôle d'analyser et de redresser l'image formée sur la rétine.`,
      consignes:[
        { q:"Corrigé officiel — A", r:`a. les vaisseaux sanguins — b. les artères — c. les veines — d. les capillaires sanguins.` },
        { q:"Corrigé officiel — B", r:`1. Glycosurie · 2. O− (donneur universel) · 3. en jets saccadés du sang · 4. poumons.` },
        { q:"Corrigé officiel — C", r:`1-Vrai (le calcaire sert bien à la fabrication du ciment). 2-Vrai. 3-Faux (la sérovaccination est l'association du sérum ET d'un vaccin, pas d'un antigène). 4-Vrai (le cerveau analyse et réinterprète l'image inversée formée sur la rétine, permettant une perception normale de l'orientation).`
        }
      ]

    {
      titre:"Deuxième partie — Sujet 1 : contraction de texte",
      points:"non précisé",
      enonce:`Texte : « Les racines de l'authenticité » (EBONGUE SOELLE, revue Bingo) — thème : le passé culturel des peuples. Consigne : fais le résumé du texte, puis discute de l'affirmation : « C'est toujours dans son passé qu'un peuple puise son énergie et l'authenticité n'est rien d'autre que l'harmonie avec ce passé. »`,

          r:`Idée générale : l'auteur invite les Africains à conserver leur authenticité culturelle. Le passé, loin d'être un enfermement, est le fondement de tout peuple : il éclaire le présent et oriente le futur. Aucun peuple ne peut s'affirmer sans son passé — l'Afrique, marquée par l'acculturation, doit prendre conscience de sa particularité culturelle pour éviter l'uniformisation et se connaître elle-même.`
        },
        {

          r:`Thèse : le passé culturel est indispensable à l'édification d'un peuple — il permet de comprendre d'où l'on vient, de tirer des leçons, de forger une identité collective et de transmettre un héritage (citations d'André Maurois et de Mario de Andrade en appui).

    {
      titre:"Partie B — Sujet 1 : dissertation",
      points:"non précisé",
      enonce:`Travailler, est-ce perdre sa liberté ? Dans une dissertation bien argumentée, résous le problème posé par ce sujet.`,
      consignes:[
        {
          q:"Corrigé officiel — Plan détaillé",
          r:`Problématique : on pense souvent qu'en travaillant l'homme se prive de sa liberté ; or le travail est aussi ce par quoi il se réalise. Le travail hypothèque-t-il la liberté humaine ?
A. Le travail comme perte de la liberté : dans la tradition judéo-chrétienne, le travail est perçu comme une malédiction (Genèse) ; dans certaines conditions (exploitation, XIXe siècle), il maintient l'homme en servitude (Karl Marx : « la liberté commence là où cesse le travail »).
B. Le travail comme facteur de réalisation de la liberté : par le travail, l'homme transforme la nature et se transforme lui-même (Marx), développe sa personnalité et satisfait ses besoins (Voltaire, Kant).
C. Les remèdes au travail assujettissant : le travail est bifacial (Alain) ; il faut améliorer les conditions de travail (horaires, mécanisation à visage humain, congés payés) pour qu'il libère effectivement l'homme.
Conclusion : le travail est un moyen de réalisation de soi à condition de créer les conditions de cette réalisation.`
        }

        {
          q:"Corrigé officiel",
          r:`Thème : origine de nos connaissances, dialectique entre expérience et raison.

Intérêt philosophique : Kant dépasse l'opposition entre empirisme (connaissance issue de l'expérience seule) et rationalisme (connaissance issue de la raison seule), en montrant que la connaissance scientifique naît de leur dialectique étroite.

          r:`La liberté comme absence de contraintes : indépendance totale, autodétermination de la volonté (libre arbitre).

Consigne : détermine la condition de décollage du solide (angle θ1) à partir des lois de la mécanique (TCI et TEC).`,
      consignes:[
        {
          q:"Corrigé officiel",
          r:`Le solide quitte la piste quand la réaction R de la piste devient nulle. En appliquant le théorème du centre d'inertie (TCI) dans le repère de Frenet, puis le théorème de l'énergie cinétique (TEC) entre A et D pour déterminer la vitesse VD, on obtient la condition : sin θ1 = (1/3)(2 sin θ0 + sin α). Pour θ0=60° et α=30°, on trouve θ1=48° : le solide quitte la piste à cet angle.`

    {
      titre:"Partie B — Chimie acide-base",
      points:"non précisé",
      enonce:`Détermine le pKa du couple NH4+/NH3 (solution de concentration C=10⁻² mol/L, pH=10,6) et celui du couple HCOOH/HCOO⁻ (C=10⁻¹ mol/L, pH=2,4).`,
      consignes:[
        {
          q:"Corrigé officiel",
          r:`Couple NH4+/NH3 : [H3O+]=10⁻¹⁰,⁶=2,51.10⁻¹¹ mol/L ; [OH⁻]=3,98.10⁻⁴ mol/L. Par relation d'électroneutralité et de conservation de la matière : [NH3]=9,6.10⁻³ mol/L, [NH4+]=3,98.10⁻⁴ mol/L. pKa = pH − log([NH3]/[NH4+]) = 10,6 − log(9,6.10⁻³/3,98.10⁻⁴) ≈ 9,2.
Couple HCOOH/HCOO⁻ : [H3O+]=10⁻²,⁴=3,98.10⁻³ mol/L. [HCOO⁻]=3,98.10⁻³ mol/L, [HCOOH]=9,6.10⁻² mol/L. pKa = 2,4 − log(3,98.10⁻³/9,6.10⁻²) ≈ 3,8.`
        }
      ]
    },

        { q:"Corrigé officiel — B", r:`1. a) rectiligne uniformément varié. 2. c) sa vitesse est constante et son accélération est nulle. 3. a) son vecteur accélération est toujours dirigé vers le centre du cercle. 4. b) −4 m/s.` },

          r:`Le mouvement est plan (az=0, Vz=0, z=0). Équation de la trajectoire : y = −g/(2V0²cos²α)·x² + x·tanα.

          r:`a. Une amine est un composé organique dérivé de l'ammoniac par substitution d'un ou plusieurs groupes alkyles.

  cycle:"secondaire2", classe:"Terminale", serie:"D", matiere:"Français", examen:"Composition (2e semestre)", annee:2025, session:"corrigé officiel (valable séries C et D)",

      enonce:`1. Sur l'assertion « De la bombe atomique à la destruction de la couche d'ozone, tout porte à croire qu'aucune littérature n'arrivera à humaniser la science » : a. formule le thème. b. explique « humaniser la science ».

      consignes:[
        {
          q:"Corrigé officiel — 1 à 4",
          r:`1a. Thème : l'inefficacité de la littérature face aux conséquences destructrices des avancées scientifiques.
1b. « Humaniser la science » : veiller à ce que les avancées scientifiques servent le bien-être dans le respect des valeurs humaines.

        },
        {
          q:"Corrigé officiel — 5",
          r:`Paragraphe attendu : la littérature est souvent perçue comme accessoire face aux besoins fondamentaux que la science satisfait (santé, communication, transport), établissant une hiérarchie qui positionne la science comme priorité pour le développement et la survie de l'humanité.`
        }
      ]
    },
    {
      titre:"Partie B — Sujet 1 : contraction de texte",
      points:"non précisé",
      enonce:`Texte : « Une relation ambivalente dans la littérature contemporaine » (Jean-Pierre Balpe, Littérature et informatique). Consigne : résume le texte, puis discute : la science et la technologie occupent-elles une place plus centrale que la littérature dans nos sociétés ?`,
      consignes:[
        {
          q:"Corrigé officiel — Résumé",
          r:`Idée générale : la science et la technologie occupent une place centrale dans nos sociétés modernes, influençant le quotidien et l'imaginaire collectif ; la littérature (notamment la science-fiction) sert de laboratoire d'idées anticipant les conséquences des avancées scientifiques ; les outils numériques, non neutres, transforment aussi l'écriture et la diffusion des œuvres littéraires. En conclusion, science et technologie sont ambivalentes.`
        },
        {
          q:"Corrigé officiel — Discussion (plan dialectique)",
          r:`Thèse : la science et la technologie sont très importantes pour nos sociétés — elles renforcent la résilience et le développement durable, améliorent la santé publique (COVID-19), stimulent la croissance économique, et permettent de relever les grands enjeux environnementaux.
Antithèse : la littérature est également importante à travers ses fonctions — vecteur d'engagement et de changement social (les Lumières, Voltaire), reflet de la société, transmission de valeurs et de patrimoine, développement intellectuel et moral.
Synthèse : la science et la technologie sont très importantes pour nos sociétés, mais la littérature y contribue aussi à travers ses fonctions propres.`
        }
      ]
    },

      points:"non précisé",
      enonce:`Texte : « Confession d'un escroc » (Moïse O. INANDJO, Le mirage des réseaux sociaux) — un jeune confesse avoir escroqué des victimes via les réseaux sociaux.`,
      consignes:[
        {
          q:"Corrigé officiel",
          r:`Thème : société et mass media, les dangers des réseaux sociaux. Idée générale : l'auteur évoque le remords d'un jeune ayant usé d'escroquerie en ligne.
Centre d'intérêt 1 — les manœuvres d'escroquerie : les réseaux sociaux, puissant moyen de communication, peuvent être détournés (« je lui fis croire », « preuves falsifiées ») — le narrateur a collecté des photos d'un homme séduisant pour bluffer des victimes sur un site de rencontres.
Centre d'intérêt 2 — le remords du jeune : la confession personnelle («je me souviens») marque une prise de conscience du mal commis.`
        }
      ]
    }
  ]

{

  exercices:[
    {
      titre:"Exercice 1",
      points:"8 pts",
      enonce:`JOE vit dans un quartier où les habitants jettent leurs ordures ménagères dans les rues. Après une forte pluie, il remarque de grands amas de déchets solides et de l'eau qui stagne, rendant difficile la circulation dans le quartier. Les enfants ayant joué dans cette eau stagnante ont développé les symptômes suivants : toux sèche, troubles digestifs, nausée, vomissement, douleurs abdominales et perte d'appétit.

      consignes:[
        {
          q:"Corrigé",
          r:`Causes des inondations : l'accumulation de déchets solides jetés dans les rues bouche l'écoulement naturel de l'eau (caniveaux/canalisations obstrués), empêchant son évacuation lors des fortes pluies.

      enonce:`Lors de l'entretien de la cour de sa maison, MADI, marchant pieds nus, piétine un clou rouillé et retire immédiatement son pied en poussant un cri de douleur. Sa sœur cherche à comprendre le mécanisme qui a permis cette réaction si rapide. Pour cela, on propose des expériences réalisées sur quatre grenouilles décérébrées (document 1). Quelques jours plus tard, MADI présente une forte fièvre et une rigidité musculaire. Après consultation, le médecin découvre qu'elle est atteinte du tétanos.

Grenouille 2 : anesthésie de la patte postérieure droite puis stimulation → pas de retrait de la patte.
Grenouille 3 : destruction de la moelle épinière puis stimulation de la patte → pas de retrait brusque de la patte.

{
  id:"svt-cds2-tled-plo",
  cycle:"secondaire2", classe:"Terminale", serie:"D", matiere:"SVT", examen:"Composition du 2e semestre", annee:2025, session:"DRE Plateaux-Ouest — corrigé officiel",
  duree:"4H",
  exercices:[
    {
      titre:"Exercice 1 — Situation d'évaluation 1 (transmission synaptique)",
      points:"non précisé",
      enonce:`Le document 1 présente la structure d'une plaque motrice. Le document 2 montre que la toxine botulique injectée dans le motoneurone provoque la paralysie du muscle, mais reste sans effet si elle est injectée directement dans la fibre musculaire. Le document 3 montre que la toxine botulique n'empêche pas l'entrée des ions Ca2+ dans le bouton synaptique, mais bloque la transmission de l'influx du motoneurone au muscle.

Consigne : explique le mécanisme normal de la transmission synaptique au niveau de la plaque motrice, puis explique comment la toxine botulique perturbe ce mécanisme.`,
      consignes:[
        {
          q:"Corrigé officiel",
          r:`Mécanisme normal : l'arrivée du potentiel d'action au niveau du bouton synaptique provoque l'ouverture de canaux à Ca2+ et l'entrée massive de ces ions dans le motoneurone. Le Ca2+ provoque la libération de l'acétylcholine (contenue dans les vésicules synaptiques) par exocytose dans la fente synaptique. L'acétylcholine se fixe sur les récepteurs postsynaptiques du sarcolemme, provoquant l'entrée d'ions Na+ dans la fibre musculaire, sa dépolarisation et la naissance d'un potentiel d'action musculaire qui déclenche la contraction. Ensuite, l'hydrolyse de l'acétylcholine et la fermeture des canaux Na+ arrêtent la stimulation.
Effet de la toxine botulique : elle n'empêche pas l'entrée des ions Ca2+ dans le bouton synaptique, mais empêche la libération (exocytose) de l'acétylcholine dans la fente synaptique. La transmission synaptique est donc bloquée, ce qui explique la paralysie observée quand la toxine est injectée dans le motoneurone (mais pas dans la fibre musculaire elle-même, qui n'est pas concernée par ce blocage).`
        }
      ]
    },
    {
      titre:"Exercice 1 — Situation d'évaluation 2 (lymphocytes T cytotoxiques)",
      points:"non précisé",
      enonce:`Des expériences sont réalisées avec des lymphocytes T cytotoxiques (Tc) d'une souris ayant reçu une injection du virus de la chorioméningite. Cas 1 : les Tc sont mis en présence de cellules infectées par le même virus → les cellules sont détruites. Cas 2 : en présence de cellules non infectées → pas de destruction. Cas 3 : en présence de cellules infectées par un virus différent (vaccine) → pas de destruction.

Consigne : explique à AFI le mécanisme de l'élimination du virus par l'organisme grâce aux lymphocytes T cytotoxiques.`,
      consignes:[
        {
          q:"Corrigé officiel",
          r:`Les résultats montrent que les lymphocytes Tc reconnaissent spécifiquement et détruisent (par lyse) les cellules infectées par le virus qui a déclenché leur formation (chorioméningite), mais sont incapables de détruire ni des cellules saines, ni des cellules infectées par un virus différent : c'est une réaction immunitaire spécifique.
Les cellules infectées présentent sur leur membrane des antigènes viraux, absents des cellules saines. Ceci permet leur reconnaissance par les récepteurs des lymphocytes Tc, qui s'y fixent (accolement par replis membranaires) puis réalisent la cytolyse de la cellule infectée, dont les structures cellulaires disparaissent presque entièrement.`
        }
      ]
    },
    {
      titre:"Exercice 2 — Questions objectives",

      enonce:`I. Identifie les affirmations justes parmi 8, et corrige les affirmations fausses (thème : physiologie du neurone).

        },
        { q:"Corrigé officiel — II, III, IV", r:`II. 1-d · 2-c · 3-c · 4-c · 5-c · 6-b · 7-b · 8-d.

      ]
    },
    {
      titre:"Exercice 3 — Contraction musculaire et régulation hormonale",
      points:"non précisé",
      enonce:`I. Un schéma de sarcomère (unités A et B) montre les composants du muscle strié.
1. Légende le schéma. 2. Compare les unités A et B et conclus. 3. Identifie les molécules énergétiques impliquées dans la contraction. 4. Fais un schéma.

II. Un tableau montre les effets de la surrénalectomie sur les concentrations plasmatique et urinaire de Na+ et K+.
1. Analyse le tableau. 2. Explique les résultats. 3. Précise le mode d'action des corticosurrénales. 4. Explique la polyurie observée.`,
      consignes:[
        {
          q:"Corrigé officiel — I",
          r:`1. Légende : 1-mitochondrie · 2-myosine · 3-zone H · 4-strie Z · 5-demi-disque clair · 6-disque sombre.
2. Comparaison : les disques sombres et les filaments de myosine/actine ont la même longueur dans les deux unités, mais la zone H et les demi-disques clairs sont plus petits dans l'unité B. Conclusion : l'unité B est contractée.
3. Molécules énergétiques : 1-ATP · 2-AMP · 3-ACP (phosphocréatine) · 4-ATP · 5-O2 · 6-ATP.`
        },
        {
          q:"Corrigé officiel — II",
          r:`1. La surrénalectomie provoque une diminution du Na+ plasmatique (et son augmentation dans l'urine), ainsi qu'une augmentation du K+ plasmatique (et sa diminution dans l'urine).
2. Explication : la baisse de réabsorption rénale du Na+ (en l'absence des corticosurrénales) augmente son élimination urinaire ; cette baisse est compensée par une augmentation de la réabsorption de K+, pour maintenir l'équilibre hydrominéral.
3. Les corticosurrénales agissent par voie hormonale, via la sécrétion d'aldostérone, qui stimule la réabsorption du Na+ par les reins.
4. La diminution du Na+ plasmatique abaisse la pression osmotique du milieu intérieur, provoquant une élimination abondante d'eau (pour rétablir cette pression) : c'est la polyurie.`
        }
      ]
    }

  duree:"2H", coef:"3",
  exercices:[
    {
      titre:"Exercice 1",
      points:"non précisé",
      enonce:`On place un objet lumineux AB devant un miroir plan. Données : AB=20cm (objet), A'B' l'image, AA'=60cm (distance objet-image). Échelle : 1/10.

Consigne 1 : énonce les lois de la réflexion de la lumière et définis la réflexion.
Consigne 2 : construis la figure à l'échelle 1/10 et détermine les caractéristiques de l'image.`,
      consignes:[
        {
          q:"Corrigé officiel — Consigne 1",
          r:`Lois de la réflexion : 1re loi — le rayon incident, le rayon réfléchi et la normale au miroir sont dans un même plan. 2e loi — l'angle incident est égal à l'angle réfléchi (i=r).
La réflexion de la lumière est le renvoi de la lumière par un corps de surface polie éclairée.`
        },
        {
          q:"Corrigé officiel — Consigne 2",
          r:`À l'échelle 1/10 : AB = 20×(1/10) = 2 cm sur la figure. AA' = 60×(1/10) = 6 cm sur la figure.
Caractéristiques de l'image : l'image A'B' formée par un miroir plan est virtuelle, droite (non renversée), de même taille que l'objet (A'B'=AB=20cm), symétrique de l'objet par rapport au plan du miroir.`
        }
      ]
    },
    {
      titre:"Exercice 2",
      points:"6 pts",
      enonce:`I. Complète (thème : électricité — dérivation, mesure, kilowattheure, protection).
II. Réponds par vrai ou faux.
III. Choisis la bonne réponse.
IV. Fais correspondre les éléments.`,
      consignes:[
        { q:"Corrigé officiel — I", r:`a. dérivation — b. mesure — c. kilowattheure — d. protège.` },
        { q:"Corrigé officiel — II", r:`1-Faux · 2-Vrai · 3-Faux · 4-Vrai.` },
        { q:"Corrigé officiel — III", r:`1. b) un précipité bleu. 2. b) uniquement les biens. 3. c) alternative. 4. c) galet.` },
        { q:"Corrigé officiel — IV", r:`1-e · 2-a · 3-f · 4-d.` }
      ]
    },
    {
      titre:"Exercice 3",
      points:"non précisé",
      enonce:`A. On réalise l'électrolyse d'une solution aqueuse de sulfate de cuivre.
1. Qu'est-ce que l'électrolyse d'une solution ? 2. Fais le schéma. 3. Écris l'équation bilan. 4. Cite deux applications.

B. On verse dans une solution de sulfate de cuivre une quantité suffisante de paille de fer.
1. Décris les observations. 2. Explique-les. 3. Écris les demi-équations puis l'équation bilan.`,
      consignes:[
        {
          q:"Corrigé officiel — A",
          r:`1. L'électrolyse d'une solution est l'ensemble des réactions se produisant dans une solution parcourue par un courant électrique.
3. À l'anode : Cu → Cu²⁺ + 2e⁻. À la cathode : Cu²⁺ + 2e⁻ → Cu.
4. Applications : purification du cuivre, dorure/recouvrement d'un objet de cuivre.`
        },
        {
          q:"Corrigé officiel — B",
          r:`1. La solution bleue se décolore et prend une teinte verte ; un dépôt rougeâtre apparaît.
2. Les atomes de fer perdent chacun deux électrons pour devenir des ions ferreux (teinte verte) ; les ions cuivre gagnent ces électrons pour devenir des atomes de cuivre (dépôt rougeâtre).
3. Demi-équations : Cu²⁺+2e⁻→Cu ; Fe→Fe²⁺+2e⁻. Équation bilan : Fe + Cu²⁺ → Fe²⁺ + Cu.`
        }
      ]
    }
  ]
},

  exercices:[
    {
      titre:"Exercice 1",
      points:"8 pts",
      enonce:`ENYONAM suspend un solide S à un dynamomètre : celui-ci indique 5N dans l'air. Elle immerge ensuite le solide, toujours suspendu, complètement dans l'eau (le dynamomètre indique 3N) puis dans l'alcool (le dynamomètre indique 1,7N). ENYONAM est étonnée que le dynamomètre donne des valeurs différentes selon le milieu.

Consigne 1 : indique ce que représente chacune des trois valeurs, puis précise la force à l'origine de la différence observée.
Consigne 2 : calcule la valeur de cette force dans l'eau et dans l'alcool.`,
      consignes:[
        {
          q:"Corrigé",
          r:`Les trois valeurs représentent le poids apparent du solide : dans l'air (5N, proche du poids réel), dans l'eau (3N) et dans l'alcool (1,7N). La différence observée est due à la poussée d'Archimède, exercée par le liquide sur le solide immergé, dirigée vers le haut.
Poussée dans l'eau : Pa(eau) = 5−3 = 2N. Poussée dans l'alcool : Pa(alcool) = 5−1,7 = 3,3N.
La poussée est plus grande dans l'alcool que dans l'eau — ce résultat dépend en réalité de la masse volumique du liquide et du volume immergé (à confirmer selon les valeurs exactes du document, une poussée plus grande dans l'alcool que dans l'eau étant physiquement surprenante puisque l'alcool est moins dense que l'eau — à vérifier avec le sujet original).`
        }
      ]

{
  id:"anglais-crpt-3e-plo-2425",
  cycle:"secondaire1", classe:"3e", serie:null, matiere:"Anglais", examen:"Composition Régionale (1er trimestre)", annee:2025, session:"DRE Plateaux-Ouest (corrigé officiel confirmé)",
  duree:"2H",
  exercices:[
    {
      titre:"I. Comprehension",
      points:"6 pts",
      enonce:`Read the passage below and then answer the questions that follow.

Text: In the old days, our ancestors lived in happiness, prosperity, good health and harmony. They believed in supernatural forces and they always consulted the Oracles before undertaking any activities to make sure that the activities ended in smile, not in tears. So before going on a journey or getting married or becoming a chief, Oracles are to be consulted to read the stars. Their go-ahead was always necessary for the success of the activities. Today, modern civilization and knowledge brought to us by the White men are destroying our culture and traditions. Oracles are no more consulted to read the stars, so accidents are now abundant; some married couples end their adventure in insults, quarrels and even divorce and chieftaincy is now the matter of the strongest. What shall we the youth of today do in front of this dilemma?
Adapted from a Ghanaian newspaper.

Questions:
1. Choose the most suitable title from the parentheses: (Modern civilization / Role of Oracles / wedding).
2. The ancestors used to consult oracles before they started any activities. True or False?
3. Complete with words from the text: Oracles are .................
4. Find in the text two activities for which consulting Oracles was necessary.
5. Are there any consequences related to the fact that Oracles are no more consulted? (Give short answer)
6. Which one do you prefer: the modern civilization or the ancestors' tradition? Justify your answer.`,
      consignes:[
        { q:"Corrigé officiel — 1 à 4", r:`1. Role of Oracles.
2. True.
3. Oracles are to be consulted to read the stars.
4. Two activities: going on a journey ; getting married (or: becoming a chief).` },
        { q:"Corrigé officiel — 5 et 6", r:`5. Yes, there are.
6. Any choice from the two proposals, with a relevant justification.` }
      ]
    },
    {
      titre:"II. Linguistic Competence",
      points:"6 pts",
      enonce:`A. Vocabulary:
Fill in the blanks with: buried; referee; match; captain.
"Do you still remember that ...1... we played against Amuku? I still remember the night the ...2... and I went to see the dibia who gave us a talisman which we ...3... on the playing ground." Gilbert said.
4. Give the antonym of: to believe ≠ ...........
5. Form a meaningful word with: o/n/t/e/c/h/y/g/l/o
6. Select the intruder: stadium – internet – web – research.

B. Grammar:
1. Complete with "despite" or "although": Our opponents were very happy .......... they didn't win the match.
2. Choose the correct form: Rafatou is used to ......... (participate/participating/participated) to the marathon.
3. Write the correct comparative/superlative form: Animism is (old) of all the religions.
4. Choose the correct tense: If my father had been at home, he (will give / would give / would have given) you the key.
5. Write the verb in the correct form: My parents (to consult) oracles any more.
6. Combine using "one another": Children know their parents. Parents know their children.`,
      consignes:[
        { q:"Corrigé officiel — A. Vocabulary", r:`1. match. 2. captain. 3. buried. 4. to doubt / to disbelieve / to unbelieve. 5. technology. 6. stadium.` },
        { q:"Corrigé officiel — B. Grammar", r:`1. although. 2. participating (despite her sickness). 3. the oldest. 4. would have given. 5. don't consult. 6. The children and the parents know one another.` }
      ]
    },
    {
      titre:"III. Writing",
      points:"8 marks",
      enonce:`For some years now, people in your community are used to celebrating a traditional festival at a given moment every year. This year you assisted to the celebration in your village or town. Basing on your competence in essay writing, describe the festival. You may use words and expressions you have learned in the lesson on the traditional celebrations. Not more than 15 lines.`,
      consignes:[
        {
          q:"Guide officiel de correction",
          r:`Structure attendue : essai descriptif en 3 parties (introduction, corps, conclusion), décrivant un festival réellement traditionnel, nommé et daté de cette année.
Actions caractéristiques à inclure : prière/libation (par les anciens), sacrifice d'animaux (hommes/garçons), préparation des repas (femmes/enfants), rassemblement de la communauté (lieu public ou en famille), musique (tambours) et danse — dans un ordre chronologique logique.
Vocabulaire attendu : celebrate, festival, community, village/town, every year, children, native, play, rejoice, gather, dance, ancestors, give thanks, drums — avec orthographe correcte.
Grammaire : temps appropriés (présent simple et passé simple), pronoms/adjectifs/adverbes corrects, accord sujet-verbe.
Originalité : phrases rédigées par le candidat lui-même, écriture lisible, environ 15 lignes.`
        }
      ]
    }
  ]
},

  duree:"1H30",
  exercices:[
    {
      titre:"I. Reading Comprehension",
      points:"6 pts",
      enonce:`Read the text carefully and answer the questions that follow.

Text: Deforestation refers to the falling of trees over a wide area where there were trees. Deforestation takes place without planting new trees. It removes all trees and exposes the land to the weather. When this happens, rain water or wind removes the topsoil which is good for crop production. This makes the land bare. Leaves that fall from the trees decay and increase the fertility of soil. Roots of trees hold the soil particles together. This prevents soil erosion. However, if we remove all trees, there will also be no roots to hold the soil particles together. These will allow rain water or wind to remove the topsoil and reduce the fertility of the land or degrade it thus making it less useful.
Deforestation leads to floods.

Questions:
1. Choose the suitable title to the text: a) Pollution b) Deforestation c) Hospital
2. Deforestation refers to the planting of trees. True/False?
3. Name two consequences of Deforestation according to the text.
4. Complete the following sentence according to the text: It removes all................
5. Reorder this sentence: leads to/deforestation/floods
6. Is it good to cut trees? Justify your answer.`,
      consignes:[
        { q:"Corrigé officiel — 1 à 4", r:`1. b) Deforestation.
2. False.
3. Two consequences: it exposes the land to the weather ; there will be erosion.
4. It removes all the trees and exposes the land to the weather.` },
        { q:"Corrigé officiel — 5 et 6", r:`5. Deforestation leads to floods.
6. Open answer (Yes or No), with justification.` }
      ]
    },
    {
      titre:"II. Linguistic Competence",
      points:"6 pts",
      enonce:`A. Vocabulary:
1. Derive a noun form: To protect = ...........
2. Give the antonym of: Deforestation ≠ ...........
3. Complete using the appropriate word: Headache is a (sickness, pharmacy, pills).
4. Select the odd man out: fauna, flora, hospital, forest.
5. Give the adverb form of this word: Quick = ...........
6. Guess the missing letters: pain in the stomach is: st-mach-che.

B. Grammar:
1. Togo has been independent (since, for, ago) 1960.
2. Kwesi (will go, goes, going) to Atakpame tomorrow.
3. Pupils should not (speaking, spoke, speak) vernacular at school.
4. Lion is (dangerous) than hyena.
5. Afi will buy a new bicycle if she (to sell) her tomatoes.
6. Use "must" in the following sentence: People don't collect rubbish.`,
      consignes:[
        { q:"Corrigé officiel — A. Vocabulary", r:`1. protection / protector. 2. forestation / afforestation. 3. sickness. 4. hospital (the other three relate to nature). 5. quickly. 6. stomachache.` },
        { q:"Corrigé officiel — B. Grammar", r:`1. since. 2. will go. 3. speak. 4. more dangerous than. 5. sells. 6. People must collect rubbish.` }
      ]
    },
    {
      titre:"III. Writing",
      points:"8 pts",
      enonce:`Your name is Ali and you are a student at CEG LA GRACE. After studying the lesson on the Environment, your friend John wants to sensitize people on its protection; but he lacks words. Help him write a paragraph about what they must do and what they must not do to protect the environment.
Use these ideas if they may help you: must not; must; avoid bushfires; plant trees; hunt wild animals; protect the forest; throw rubbish anywhere; collect rubbish; urinate in rivers; dig toilets.`,
      consignes:[
        {
          q:"Guide de rédaction",
          r:`Structurer le paragraphe autour de deux axes : ce qu'il FAUT faire (plant trees, protect the forest, collect rubbish, dig toilets) et ce qu'il ne FAUT PAS faire (avoid bushfires, don't hunt wild animals, don't throw rubbish anywhere, don't urinate in rivers), en utilisant "must" et "must not" de façon appropriée. Il n'y a pas de corrigé unique — l'évaluation porte sur la pertinence, la cohérence, la correction grammaticale et le niveau de perfectionnement (critères donnés dans le sujet).`
        }
      ]
    }
  ]
},

  exercices:[
    {
      titre:"Première partie — Situation d'évaluation",
      points:"8 pts",
      enonce:`Ton amie SOLIM en classe de 5e aime la vie facile et les sorties. Le 14 février dernier, alors qu'elle était dans un bar avec des garçons, sa boisson a été droguée à son insu ; après avoir bu son verre, elle ne pouvait plus marcher, elle est tombée dans un profond sommeil et les garçons ont profité pour la violer. Après deux mois, elle est tombée enceinte. Elle vient à toi pour recevoir des conseils.

Document : « Pour être un parent responsable, il faut : avoir 18 ans au moins, c'est-à-dire être mature, être autonome et avoir un emploi permettant de subvenir aux besoins familiaux, disposer des moyens matériels, avoir une bonne moralité, être capable d'éduquer ses enfants, avoir des notions de planification des naissances... La parenté précoce est la qualité de quelqu'un qui est parent avant l'âge de la maturité. Elle est source de problèmes : la dépendance sur les plans sanitaire, alimentaire, vestimentaire, les surcharges dans la famille, la malnutrition et la sous-alimentation des parents et enfants, la délinquance juvénile, la mendicité, la pauvreté chronique, l'abandon des études ou les échecs scolaires, le rejet des parents, tentation d'avortement, accouchement difficile entraînant la mort... »

Consigne 1 : Explique à ton amie les conséquences liées à la consommation de la drogue.
Consigne 2 : Dis-lui les conditions nécessaires pour une parenté responsable.`,
      consignes:[
        {
          q:"Corrigé officiel — Consigne 1",
          r:`La drogue est une substance psychotrope qui modifie la sensibilité physique et mentale d'un individu. Sa consommation a des conséquences sur l'individu et sur la société.
Sur le consommateur : échecs et abandons scolaires, échecs professionnels, santé fragile, risques de maladies hépatiques, pulmonaires, respiratoires et de cancer, troubles mentaux, maux de tête chroniques, folie, suicide, mort, faiblesse sexuelle, stérilité.
Sur la société : conflits avec la famille, la police, la gendarmerie et la justice, divorce, irresponsabilité parentale, délinquance juvénile, braquage, vol, viol, prostitution, crime, accidents de circulation.`
        },
        {
          q:"Corrigé officiel — Consigne 2",
          r:`La parenté responsable est la capacité pour un parent d'assumer ses responsabilités de père ou de mère. Pour le devenir, il faut : être mature (avoir 18 ans au moins) ; avoir une bonne moralité ; être bien éduqué et capable d'éduquer ses enfants ; être stable (disposer d'un travail et d'un domicile) ; avoir des notions de planification des naissances ; être responsable (disposer de moyens suffisants pour subvenir aux besoins de ses enfants).`
        }
      ]
    },
    {
      titre:"Deuxième partie — Questions objectives",
      points:"6 pts",
      enonce:`1. Réponds par vrai ou faux :
a. Les droits spécifiques ou catégoriels sont des droits qui protègent les personnes vulnérables.
b. Avoir trop tôt la grossesse n'est pas bon pour une élève.
c. Les délégués ou majors de classe sont nommés par le titulaire de classe.
d. L'apparition des règles signifie rapport sexuel précoce chez la jeune fille.

2. Choisis la bonne réponse entre parenthèses :
a. Les droits des enfants sont une catégorie des droits (civils et politiques ; spécifiques).
b. Le Comité de classe est (choisi par le Directeur de l'établissement ; élu par ses camarades de classe ; nommé par le Titulaire de classe).
c. Le parti majoritaire est le parti qui détient (moins, plus, égalité) de sièges à l'Assemblée nationale.
d. (La pudeur ; la pilosité ; la prise de risque) est l'un des changements physiques observables chez les adolescents.

3. Reproduis le tableau et mets une croix au niveau de la bonne proposition (Droit humain / Droit des enfants) :
Droit d'aller à l'école. / Droit à l'emploi. / Droit d'être aimé. / Droit de jouer.`,
      consignes:[
        {
          q:"Corrigé officiel — 1. Vrai/Faux",
          r:`a. Vrai.
b. Vrai.
c. Faux — les délégués/majors de classe sont élus par leurs camarades de classe, pas nommés par le titulaire.
d. Faux — l'apparition des règles est un signe de maturité physiologique (puberté), pas un signe de rapport sexuel précoce.`
        },
        {
          q:"Corrigé officiel — 2. QCM",
          r:`a. spécifiques. b. élu par ses camarades de classe. c. plus (de sièges). d. la pilosité.`
        },
        {
          q:"Corrigé officiel — 3. Tableau",
          r:`Droit d'aller à l'école → droit des enfants. Droit à l'emploi → droit humain (général). Droit d'être aimé → droit des enfants. Droit de jouer → droit des enfants.`
        }
      ]
    },
    {
      titre:"Troisième partie — Questions traditionnelles",
      points:"6 pts",
      enonce:`1. Définis : dignité humaine ; parenté précoce. (1 pt)
2. Cite deux inconvénients d'une parenté précoce. (2 pts)
3. Énumère deux transformations physiologiques qu'on observe chez le jeune garçon au cours de l'adolescence. (2 pts)
4. Les jeunes de ta localité se livrent à la consommation de la drogue. Produis une affiche ou un slogan pour les sensibiliser. (1 pt)`,
      consignes:[
        {
          q:"Corrigé officiel — 1 et 2",
          r:`1. Dignité humaine : le respect que mérite une personne. Parenté précoce : fait pour un adolescent d'être parent ou géniteur avant l'âge adulte.
2. Inconvénients (deux au choix) : la dépendance sur les plans sanitaire, alimentaire, vestimentaire ; les surcharges dans la famille ; la malnutrition et la sous-alimentation ; la délinquance juvénile ; la mendicité ; la pauvreté chronique ; l'abandon des études ou les échecs scolaires ; le rejet des parents ; la tentation d'avortement ; l'accouchement difficile pouvant entraîner la mort.`
        },
        {
          q:"Corrigé officiel — 3 et 4",
          r:`3. Transformations chez le garçon adolescent (deux au choix) : augmentation du volume des organes génitaux (testicules, pénis) ; apparition des poils au pubis et sous les aisselles ; premières éjaculations ; mue de la voix (devient grave) ; formation des muscles.
4. Exemple de slogan : « La drogue détruit tes rêves — choisis la vie ! »`
        }
      ]
    }
  ]
},

  exercices:[
    {
      titre:"Première partie — Dictée",
      points:"6 pts",
      enonce:`Dictée : « Importance de l'école »
« Apprendre à lire et à écrire est une bonne chose : c'est important, mais ce n'est pas suffisant. J'ai toujours eu de l'école une idée plus élevée. À mes yeux, c'est à l'école que les enfants prennent la mesure du monde et de la société. Ce qui me paraît essentiel, c'est de leur ouvrir l'esprit de la vie... »

      points:"6 pts",
      enonce:`Texte : « Initiation au culte vaudou »
C'était un soir, des coups de tam-tam retentissent. Ce genre de tam-tam annonce d'ordinaire l'entrée d'un homme ou d'une femme au couvent. Cette personne, c'était Bossou. Cette nuit, le prêtre lui fit les premières cérémonies. Le lendemain, on le vit le visage balafré, de même que la poitrine et le dos. Il était vêtu d'un pagne noir, enroulé autour des reins. Bossou devint la risée de ses camarades de classe, lui qui était le meilleur élève et qui tenait toujours la tête.
Humilié, désemparé, il ne faisait que pleurer à longueur de journée. Ce qui l'ennuyait le plus, c'est qu'il devait rester dans ce couvent pendant deux ans, période durant laquelle ses copains pourront évoluer normalement dans les études et décrocher le Certificat d'Études Primaires. Il n'avait pas le droit de porter d'autres habits à part le pagne noir. En le voyant dans cette situation, sa maman n'arrivait plus à manger. Un fils unique sur qui elle comptait beaucoup. Car, disait-elle : « quand tu seras grand et que tu termineras tes études, tu construiras une belle maison où je passerai le reste de mes jours. Tu achèteras une voiture comme celle du Commandant de Cercle. » Maintenant que son fils Bossou est au couvent, tous ses espoirs sont vains.

b. Utilise ce même mot dans une autre phrase où il aura un sens différent.

        { q:"Corrigé officiel — 1, 2, 3", r:`1. Bossou est triste d'entrer au couvent.

      titre:"Exercice 1",
      points:"8 pts",
      enonce:`Un jardinier a remis à son neveu 600 mangues à vendre au marché du village voisin. Pour lui faire les comptes de la vente, le neveu a laissé une feuille sur laquelle est écrit : « Les 600 mangues n'ont pas toutes été vendues. Lors du transport, 120 mangues ont été écrasées et jetées. Les trois quarts (3/4) des mangues transportées en bon état au marché ont été vendues à 150F l'unité et le reste des mangues à 75F l'unité ». De retour, le jardinier ne comprend rien de ce qui est écrit sur la feuille. Il veut juste savoir le montant qu'il prendra chez son neveu.

Consigne : aide le jardinier à trouver le montant qu'il doit prendre chez son neveu.`,
      consignes:[

          q:"Corrigé officiel",
          r:`Nombre de mangues parvenues au marché : 600−120 = 480 mangues.

      enonce:`Pour résoudre le problème d'inondation dans la ville de Kpalimé, l'État et la mairie décident de créer des caniveaux. Un caniveau va passer sur la parcelle AEFC du terrain de Mme Odile, en la divisant en deux parties, avec AE=3m, BF=12m, EF=15m et AC=20m (ABCD est un rectangle, B et D sont des points intermédiaires sur les côtés). La mairie dédommage Dame Odile à raison de 25 000 FCFA/m² sur l'espace pris par le caniveau. L'État ajoute un bonus de 10% du montant de la mairie. Dame Odile envisage de construire une boutique sur la parcelle EBF, coûtant 1 500 000 FCFA selon son architecte.

Consigne 1 : Prouve que la parcelle prise par la construction du caniveau est de 42 m², comme l'avait prévu le géomètre de la mairie.
Consigne 2 : Aide Dame Odile à trouver le montant total qu'elle recevra pour son projet de boutique.`,
      consignes:[
        {
          q:"Corrigé officiel — Consigne 1",
          r:`Triangle BEF rectangle en B : EF²=BE²+BF² → BE²=15²−12²=81 → BE=9m. Donc AB=BE+AE=9+3=12m=DC.
Triangle ACD rectangle en D : AD²=AC²−DC²=20²−12²=256 → AD=16m.
Aire du rectangle ABCD : A=AB×AD=12×16=192 m².
Aire du triangle BEF : A1=(BE×BF)/2=(9×12)/2=54 m².
Aire du triangle ACD : A2=(AD×DC)/2=(16×12)/2=96 m².
Aire de la portion AEFC (prise par le caniveau) : B=A−(A1+A2)=192−(54+96)=42 m². Conclusion confirmée : l'aire est bien 42 m².`
        },

          q:"Corrigé officiel — Consigne 2",
          r:`Frais de dédommagement : 42 m² × 25 000F = 1 050 000F.

  cycle:"secondaire1", classe:"5e", serie:null, matiere:"Mathématiques", examen:"Composition du 3e trimestre", annee:2025, session:"DRE Plateaux-Ouest — sujet et corrigé confirmés",

  exercices:[
    {
      titre:"Exercice 1",
      points:"8 pts",
      enonce:`Afin de motiver les élèves à mieux travailler, la direction du CEG décide de récompenser les meilleurs élèves après la remise des bulletins du 2e trimestre. La direction possède 48 bics et 30 cahiers de 300 pages, à répartir en paquets identiques contenant un même nombre de bics et de cahiers, pour les premiers méritants.

Consigne : aide l'adjoint à trouver le plus grand nombre de paquets qu'on peut faire, et la composition de chaque paquet.`,
      consignes:[
        {
          q:"Corrigé",
          r:`Diviseurs de 48 : {1,2,3,4,6,8,12,16,24,48}. Diviseurs de 30 : {1,2,3,5,6,10,15,30}. PGCD(48,30)=6.
Le plus grand nombre de paquets est 6. Composition de chaque paquet : bics = 48÷6 = 8 ; cahiers = 30÷6 = 5.

    {
      titre:"Exercice 2",
      points:"6 pts",
      enonce:`I. Réponds par vrai ou faux :
1. 2/5 = 8/20.

4. Un losange est un parallélogramme qui a des angles droits.

II. Choisis la bonne réponse :
1. La solution de l'équation x+(−3)=(+5,2) est : a) x=−2,2 b) x=+8,2 c) x=−8,2.
2. Deux angles sont supplémentaires si la somme de leur mesure est : a) 90° b) 180° c) 960°.
3. Le point P est à l'intérieur du cercle (C) de centre O et de rayon r si : a) OP>r b) OP<r c) OP=r.
4. L'opération A=3×5²−20 a pour résultat : a) A=15 b) A=55 c) A=205.

III. Complète les affirmations suivantes :
1. Le quart de 120 est ...........................
2. Le centre du cercle circonscrit à un triangle est le point de concours des ......................... de ce triangle.
3. Tout point pris sur un cercle, qu'on joint aux extrémités du diamètre, forme un ........................ en ce point.
4. a) 5+5+5+5=...........×............. b) 5×5×5×5=.......................`,
      consignes:[
        {
          q:"Corrigé — I. Vrai/Faux",
          r:`1. Vrai (2/5 = 8/20, car 2×4=8 et 5×4=20). 2. Faux (un nombre premier a exactement deux diviseurs : 1 et lui-même). 3. Vrai. 4. Faux (c'est un rectangle qui a des angles droits ; le losange a quatre côtés égaux).`
        },
        { q:"Corrigé — II. QCM", r:`1-b) x=+8,2 (x=5,2+3). 2-b) 180°. 3-b) OP<r. 4-b) A=3×25−20=55.` },
        {
          q:"Corrigé — III. Complète",
          r:`1. Le quart de 120 est 30 (120÷4=30).
2. Le centre du cercle circonscrit est le point de concours des médiatrices de ce triangle.
3. Tout point pris sur un cercle, joint aux extrémités du diamètre, forme un angle droit en ce point.
4a. 5+5+5+5 = 4×5. 4b. 5×5×5×5 = 5⁴.`
        }
      ]
    },
    {
      titre:"Exercice 3",
      points:"6 pts",
      enonce:`1. Cite quatre polygones étudiés en classe.
2. Calcule : A=7×3²−25 ; B=48−PGCD(48;30) ; C=PPCM(15;25).
3. a. Compare 5/12 et 3/4. b. Range par ordre croissant : 99/98 ; 0 ; 1 ; 98/99.
4. Construis le triangle ABC tel que AB=4cm, AC=3cm et BC=5cm, puis construis le cercle (C) de centre O et de diamètre [BC]. Construis le point D symétrique de A par rapport à O.
a) Quelle est la nature du triangle BAC et du quadrilatère ABDC ? Justifie tes réponses.
b) Marque les points M, N et Q tels que OM=2cm, ON=3cm et OQ=2,5cm, puis donne les positions de ces points par rapport au cercle (C).`,
      consignes:[
        { q:"Corrigé — 1 et 2", r:`1. Quatre polygones : carré, rectangle, losange, triangle (autres exemples possibles : trapèze, pentagone).
2. A = 7×9−25 = 63−25 = 38. B = 48−PGCD(48;30) = 48−6 = 42. C = PPCM(15;25) = 75 (15=3×5, 25=5², PPCM=3×5²=75).` },
        { q:"Corrigé — 3", r:`a. 5/12 < 3/4 (car 3/4 = 9/12, et 5/12 < 9/12).
b. Ordre croissant : 0 < 98/99 < 1 < 99/98.` },
        {
          q:"Corrigé — 4",
          r:`a. Dans le triangle ABC : AB²+AC²=4²+3²=16+9=25=BC² → d'après la réciproque de Pythagore, ABC est rectangle en A.
O étant le milieu de [BC] (centre du cercle de diamètre [BC]) et aussi le milieu de [AD] (D symétrique de A par rapport à O), les diagonales [BC] et [AD] du quadrilatère ABDC se coupent en leur milieu : ABDC est un parallélogramme. Comme A appartient au cercle de diamètre [BC], l'angle en A est droit (Thalès) — ABDC est donc un rectangle.
b. Rayon du cercle : r = BC/2 = 2,5cm. M (OM=2cm<r) est à l'intérieur du cercle. N (ON=3cm>r) est à l'extérieur du cercle. Q (OQ=2,5cm=r) est sur le cercle.`
        }
      ]
    }
  ]
},

{
  id:"maths-crtt-4e-angles",
  cycle:"secondaire1", classe:"4e", serie:null, matiere:"Mathématiques", examen:"Composition Régionale (3e trimestre)", annee:2025, session:"DRE Plateaux-Ouest — sujet et corrigé officiels confirmés",
  duree:"2H", coef:"3",
  exercices:[
    {
      titre:"Exercice 1",
      points:"8 pts",
      enonce:`À la recherche d'un logo pour le club mathématique du collège CEG Kpodzi, un élève de la classe de 4e propose à ses camarades le motif suivant. Précisions : le point O est le centre du cercle (C) de rayon 3cm ; les droites (AI) et (FD) sont parallèles ; les droites (OF) et (CE) sont parallèles. On donne la mesure de l'angle AÔF : 60°.

Le meilleur de la classe affirme que sur cette figure, plusieurs angles ont la même mesure que l'angle AÔF.

Consigne : à partir de tes connaissances en géométrie, trouve tous les angles de même mesure que l'angle AÔF, détermine la longueur des arcs AF et BC, puis compare la longueur des cordes [AF] et [BC].`,
      consignes:[
        {
          q:"Corrigé officiel",
          r:`Comme (AI)∥(FD) : les angles AÔF et OF̂E sont alternes-internes, donc de même mesure. Comme (AI)∥(FD) également : les angles BÔC et OF̂E sont correspondants, donc de même mesure — donc BÔC = AÔF. Comme (FB)∥(EC) : les angles AÔF et OĈE sont correspondants, donc de même mesure.
Conclusion : les angles OĈF, BÔC et OF̂E sont tous de même mesure que l'angle AÔF (60°).
Longueur des arcs : AF = (π×60×3)/180 = 3,14 cm. BC = (π×60×3)/180 = 3,14 cm (même formule, même angle au centre).
Conclusion : les angles AÔF et BÔC étant de même mesure et étant des angles au centre, ils interceptent des arcs de même longueur ; les cordes [AF] et [BC] sont donc aussi de même longueur.`
        }
      ]
    },
    {
      titre:"Exercice 2",
      points:"6 pts",
      enonce:`I. Réponds par vrai ou faux :
1. L'écriture scientifique du nombre 0,002000387×10⁻² est 2,000387×10⁻⁴.
2. Le plus grand commun diviseur de deux nombres premiers est égal à un.
3. Par une translation, deux droites parallèles ont pour image deux droites parallèles.
4. Un plan orthogonal est un plan constitué de deux droites perpendiculaires.

II. Choisis la bonne réponse :
1. L'arrondi à quatre décimales de 3,428571 est : a) 3,4285 b) 3,4287 c) 3,4258 d) 3,4286.
2. Deux droites sont dites non coplanaires si : a) elles sont sécantes b) elles sont parallèles c) elles sont perpendiculaires d) elles ne sont ni sécantes ni parallèles.
3. Lorsque deux points A et B sont confondus, on dit que le vecteur AA ou BB est un : a) vecteur opposé b) vecteur égal c) vecteur orthogonal d) vecteur nul.
4. La factorisation de (2x−3)(x−4)+3(x−4) est : a) (x−4)(2x+6) b) 3(x−4) c) 2x(2x−3) d) 2x(x−4).

III. Relie chaque calcul à son résultat :
Calculs : (−1)−(−4)+(−5)−(+4)−(−4,5)+(+0,5) ; l'opération 1/2 : 4/20 − 3/2 ; le développement de (z+4)(z−3)−(z²+z) ; la valeur numérique de (2y−3)(5y−7) pour y=0.
Résultats : 21 ; −12 ; 1 ; −1.

IV. Réarrange pour obtenir des phrases correctes :
1. En divisant les nombres de la deuxième ligne / il suffit donc de vérifier que les quotients obtenus / par les nombres de la seconde ligne (ou inversement) sont égaux pour chaque colonne. / Pour vérifier si un tableau est un tableau de proportionnalité,
2. les n premiers chiffres après la virgule de l'écriture décimale de x. / est le nombre décimal d'ordre n de x obtenu ne conservant que / la troncature à n décimales d'un nombre rationnel positif`,
      consignes:[
        { q:"Corrigé officiel — I", r:`1-Faux · 2-Vrai · 3-Vrai · 4-Vrai.` },
        { q:"Corrigé officiel — II", r:`1-d) 3,4286. 2-d) elles ne sont ni sécantes ni parallèles. 3-d) vecteur nul. 4-d) 2x(x−4).` },
        {
          q:"Corrigé officiel — III",
          r:`(−1)−(−4)+(−5)−(+4)−(−4,5)+(+0,5) = −1+4−5−4+4,5+0,5 = −1.
1/2 : 4/20 − 3/2 = (1/2)×(20/4) − 3/2 = 5/2 − 3/2 = 1.
(z+4)(z−3)−(z²+z) = z²−3z+4z−12−z²−z = −12.
(2y−3)(5y−7) pour y=0 = (−3)(−7) = 21.`
        },
        {
          q:"Corrigé officiel — IV",
          r:`1. « Pour vérifier si un tableau est un tableau de proportionnalité, il suffit donc de vérifier que les quotients obtenus en divisant les nombres de la deuxième ligne par les nombres de la seconde ligne (ou inversement) sont égaux pour chaque colonne. »
2. « La troncature à n décimales d'un nombre rationnel positif est le nombre décimal d'ordre n de x obtenu ne conservant que les n premiers chiffres après la virgule de l'écriture décimale de x. »`
        }
      ]
    },
    {
      titre:"Exercice 3",
      points:"6 pts",
      enonce:`I. Un commerçant fait une promotion de 20% sur ses articles vendus à moins de 5000F et une promotion de 15% sur les autres articles. Le rabais accordé sur un article de 5200F est-il plus important que celui accordé sur un article de 4500F ?

II. Écris plus simplement :
1. AF+CD+FA+EC
2. MN−OP+NP+OM

III. On lance un dé et on relève à chaque jet le nombre obtenu :
5;3;2;3;1;3;3;3;6;1;4;1;5;2;5;6;5;4;5;4;2;5;4;1;1;3;3;5;1;5;5;6
1. Organise ces résultats dans un tableau faisant apparaître les effectifs et les fréquences (en %) de chaque valeur.
2. Représente graphiquement les effectifs à l'aide d'un diagramme en bâtons.

IV. Applique le programme suivant pour annoncer le résultat final sous forme irréductible : prendre 5 comme nombre de départ, retrancher 1/2, puis diviser le tout par 3/4.`,
      consignes:[
        {
          q:"Corrigé officiel — I",
          r:`Rabais sur l'article à 4500F (20%) : (4500×20)/100 = 900F.
Rabais sur l'article à 5200F (15%) : (5200×15)/100 = 780F.
Conclusion : le rabais accordé sur l'article à 5200F (780F) est moins important que celui sur l'article à 4500F (900F) — donc la réponse à la question est non.`
        },
        {
          q:"Corrigé officiel — II",
          r:`1. AF+CD+FA+EC = (AF+FA)+(EC+CD) = 0+ED = ED.
2. MN−OP+NP+OM = MN+NP+PO+OM = MP+PM = 0 (vecteur nul).`
        },
        {
          q:"Corrigé — III (calculs vérifiés)",
          r:`Sur 32 lancers : valeur 1 → 6 fois (18,75%) ; valeur 2 → 3 fois (9,375%) ; valeur 3 → 7 fois (21,875%) ; valeur 4 → 4 fois (12,5%) ; valeur 5 → 9 fois (28,125%) ; valeur 6 → 3 fois (9,375%). Total : 32 lancers, 100%.
Diagramme en bâtons à construire à partir de ces effectifs (axe horizontal : valeurs 1 à 6 ; axe vertical : effectifs).`
        },
        {
          q:"Corrigé — IV (calcul vérifié)",
          r:`5 − 1/2 = 9/2. (9/2) ÷ (3/4) = (9/2)×(4/3) = 36/6 = 6. Résultat final : 6.`
        }
      ]
    }
  ]
},
